name: zanshin
description: Flutter macOS shell for the Zanshin JJ VCS GUI.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^1.0.3
  inject_annotation: ^1.1.0-pre1
  inject_flutter: ^1.0.2
  native_toolchain_rust: 1.0.4
  yaru: ^10.1.0

dev_dependencies:
  build_runner: ^2.15.0
  ffigen: 20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  inject_generator: ^1.1.0-pre1

flutter:
  uses-material-design: true
