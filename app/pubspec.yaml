name: zanshin
description: Flutter macOS shell for the Zanshin JJ VCS GUI.
publish_to: 'none'

version: 2026.9.1+1

environment:
  sdk: ^3.14.0-143.0.dev
  flutter: ^3.48.0-1.0.pre-295
resolution: workspace

dependencies:
  ffi: ^2.2.0
  flat_buffers: ^25.9.23
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  inject_annotation: ^1.2.1
  inject_flutter: ^1.2.1
  logging: ^1.3.0
  lottie: ^3.5.1
  # theme_tailor_annotation: ^3.1.3
  marionette_flutter: ^0.6.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.1
  # The pure-Dart Rust↔Dart bridge (FFI + worker). Provides the zanshin-ffi native
  # asset via its own build hook; the app aggregates it at build time.
  yaru:
    path: ../../yaru.dart
  zanshin_core:
    path: ../packages/zanshin_core
  zanshin_settings:
    path: ../packages/zanshin_settings
  zanshin_shell:
    path: ../packages/zanshin_shell

dev_dependencies:
  build_runner: ^2.16.0
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  inject_generator: ^1.2.1
  # Test-only: the fake ZanshinShellPlatform in test/ mixes in MockPlatformInterfaceMixin.
  plugin_platform_interface: ^2.1.8
  zanshin_shell_platform_interface:
    path: ../packages/zanshin_shell_platform_interface
  # theme_tailor: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/svg/
    - assets/images/grain_128.png
    - assets/lottie/nami_loader.json
    - assets/lottie/nami_loader_transparent.json
  fonts:
    - family: Inter
      fonts:
        - asset: 'assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf'
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-VariableFont_wght.ttf
    - family: ShipporiMincho
      fonts:
        - asset: assets/fonts/Shippori_Mincho/ShipporiMincho-Medium.ttf
          weight: 500
        - asset: assets/fonts/Shippori_Mincho/ShipporiMincho-SemiBold.ttf
          weight: 600
