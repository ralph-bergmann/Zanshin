name: zanshin
description: Flutter macOS shell for the Zanshin JJ VCS GUI.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  hooks: ^1.0.3
  inject_annotation: ^1.1.0-pre1
  inject_flutter: ^1.0.2
  native_toolchain_rust: 1.0.4
  theme_tailor_annotation: ^3.0.1
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: ^2.15.0
  ffigen: 20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  inject_generator: ^1.1.0-pre1
  theme_tailor: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/svg/
