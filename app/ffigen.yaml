# ffigen configuration for the Zanshin Rust core FFI bindings.
# Output: lib/src/ffi/bindings.dart (committed; regenerate via `cargo make codegen`).
# Per AR-P-6 / FR-BO-6 — never auto-regenerated by the build.

name: 'ZanshinFfi'
description: 'FFI bindings for the Zanshin Rust core. Auto-generated by ffigen — DO NOT EDIT. Regenerate via `cargo make codegen`.'

output: 'lib/src/ffi/bindings.dart'

headers:
  entry-points:
    - '../crates/zanshin-ffi/include/zanshin_ffi.h'
  # WHY: allow-list keeps ffigen from descending into <stdint.h> / <stdbool.h> and
  # emitting Dart bindings for macOS-SDK private typedefs (__darwin_*, __int128_t,
  # etc). Without this, bindings.dart explodes to hundreds of lines of irrelevant
  # SDK noise.
  include-directives:
    - '../crates/zanshin-ffi/include/zanshin_ffi.h'

# WHY: regex allow-list — only zanshin_* symbols cross into the Dart class.
# Belt-and-suspenders with `include-directives`.
functions:
  include:
    - 'zanshin_.*'

comments:
  style: doxygen
  length: full

# preamble: |   # ← only add this if T5's `dart analyze` reveals analyzer
#               # complaints about ffigen-generated identifiers; see AC-16.
#   // ignore_for_file: non_constant_identifier_names, camel_case_types
