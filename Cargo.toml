# Single workspace version (AR-AD-7). Pre-1.0 — breaking changes allowed in WIP.

[workspace]
members = ["crates/*"]
# WHY: explicit list (not derived from `members`) so `cargo build --release` skips
# xtask. New production crates MUST be added here; xtask is intentionally excluded.
# The test gate uses `--workspace` so xtask is still linted/tested (see Makefile.toml).
default-members = [
    "crates/zanshin-diff",
    "crates/zanshin-ffi",
    "crates/zanshin-graph",
    "crates/zanshin-jj",
    "crates/zanshin-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zanshin — macOS Flutter GUI for the Jujutsu (jj) VCS"
homepage = "https://github.com/dasralph/zanshin"
repository = "https://github.com/dasralph/zanshin"
authors = ["Ralph Bergmann <ralph@dasralph.de>"]
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", features = ["clock"] }  # WHY: pinned to jj-lib's exact transitive version; DatePatternContext requires From<DateTime<Local>>
clap = { version = "4", features = ["derive"] }
flatbuffers = "=25.12.19"
futures = "0.3" # WHY: jj-lib exposes Stream-based APIs — consumed in production by zanshin-jj (status.rs, revset.rs, graph.rs) and by the zanshin-jj graph_blueprint bench
jj-lib = "=0.42.0"  # WHY: pre-1.0 exact-pin; API churn absorbed inside zanshin-jj (FR-JJ-16)
notify-debouncer-full = "=0.7.0"  # WHY: watcher core; re-exports notify — no separate notify dep needed; pre-1.0 exact-pin (AD-5)
pollster = "0.3"
tar = "0.4"
tempfile = "3"
gix = { version = "0.84.0", default-features = false } # WHY: gix::remote::fetch::Tags required by jj_lib::git::add_remote; pinned to match jj-lib 0.42's transitive gix version
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zanshin-graph = { path = "crates/zanshin-graph", version = "0.1.0" }
zanshin-jj = { path = "crates/zanshin-jj", version = "0.1.0" }
zstd = "0.13"

[workspace.lints.clippy]
# WHY: priority = -1 so later, individually-configured lints (level overrides
# for single pedantic lints) take precedence over the group without a
# Cargo "ambiguous lint priority" warning.
pedantic = { level = "warn", priority = -1 }

# WHY: full DWARF debug info for the ~200+ dependency crates (not our own ~15) is
# the single biggest contributor to target/ size for a tree this large, and (per
# docs/coverage.md) dependencies are outside the coverage baseline's scope. Line
# tables only keeps file:line in backtraces through jj-lib/gix frames — which we DO
# read when a test panics inside jj-lib — while dropping the bulk (type/variable
# DWARF). `package."*"` excludes workspace members by definition, so our own crates
# keep Cargo's default (full) dev debug info — deliberately: the PROFILE-level
# `[profile.dev] debug = "line-tables-only"` was verified by hand (2026-08-13) to
# break `-C instrument-coverage`'s source-line attribution for OUR OWN crates
# (crates/zanshin-ffi/src/ffi_strings.rs cargo-side coverage dropped from 115/116
# to 102/116 lines with it on), which the coverage ratchet would then flag as a
# false regression. Do not "simplify" this into the profile-level form.
[profile.dev.package."*"]
debug = "line-tables-only"
