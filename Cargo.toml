# Single workspace version (AR-AD-7). Pre-1.0 — breaking changes allowed in WIP.

[workspace]
members = ["crates/*"]
# WHY: explicit list (not derived from `members`) so `cargo build --release` skips
# xtask. New production crates MUST be added here; xtask is intentionally excluded.
# The test gate uses `--workspace` so xtask is still linted/tested (see Makefile.toml).
default-members = [
    "crates/zanshin-diff",
    "crates/zanshin-ffi",
    "crates/zanshin-graph",
    "crates/zanshin-jj",
    "crates/zanshin-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Zanshin — macOS Flutter GUI for the Jujutsu (jj) VCS"
homepage = "https://github.com/dasralph/zanshin"
repository = "https://github.com/dasralph/zanshin"
authors = ["Ralph Bergmann <ralph@dasralph.de>"]
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
jj-lib = "=0.41.0"
pollster = "0.3"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util"] } # WHY: provides AsyncRead impl for Cursor<Vec<u8>>, required for jj-lib's Store::write_file in xtask
zstd = "0.13"

[workspace.lints.clippy]
# WHY: priority = -1 so later, individually-configured lints (level overrides
# for single pedantic lints) take precedence over the group without a
# Cargo "ambiguous lint priority" warning.
pedantic = { level = "warn", priority = -1 }
