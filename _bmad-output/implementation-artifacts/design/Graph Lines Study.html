<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zanshin — graph lines study</title>
<link rel="stylesheet" href="fonts.css?v=1"/>
<link rel="stylesheet" href="app.css?v=34"/>
<link rel="stylesheet" href="graph.css?v=16"/>
<link rel="stylesheet" href="float.css?v=13"/>
<style>
a{color:var(--accent)}a:hover{color:var(--text)}
.ls{position:fixed;inset:0;background:var(--canvas)}
.ls .ls-scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none}
.ls .ls-scroll::-webkit-scrollbar{display:none}
.ls-sizer{position:relative;margin:0 auto}
.ls-plane{position:absolute;transform-origin:0 0}
.ls-panel{position:absolute;z-index:20;border-radius:14px}
.ls-top{top:12px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 14px 10px}
.ls-note{margin:0;font-size:12.5px;line-height:1.45;color:var(--text-muted);text-align:center;text-wrap:pretty}
.ls-scn{left:12px;bottom:12px;width:min(350px,calc(100% - 24px));display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 14px}
.ls-view{right:12px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;padding:6px;max-width:calc(100% - 386px)}
.ls-w{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;font-size:12.5px;color:var(--text-muted);white-space:nowrap}
.ls-w .gtb-range{width:110px}
.ls-tag{font:600 10px var(--font-mono);color:var(--accent);padding:1px 5px;border-radius:5px;background:var(--accent-soft)}
.ls-rule{align-self:stretch;height:1px;background:var(--fl-border)}
.ls-n{margin-left:auto;padding-left:8px;font:600 11px var(--font-mono);color:var(--text-faint)}
.ls-scn .ls-h{align-self:stretch}
.ls-days{position:absolute;left:0;top:0}.ls-days .gtime-label{left:4px}
.ls-h{font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.ls-cid{font:12px var(--font-mono);color:var(--text-faint)}
.ls-cid b{color:var(--text);font-weight:700}
.ls-seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--fl-hover)}
.ls-seg button{display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-muted);white-space:nowrap;transition:background 120ms,color 120ms}
.ls-seg button:hover{color:var(--text)}
.ls-seg button.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.ls-seg kbd{font:600 10.5px var(--font-mono);color:var(--text-faint);background:none;border:0;padding:0;min-width:0;height:auto;box-shadow:none}
.ls-seg button.on kbd{color:var(--accent)}
.ls-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ls-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;background:var(--fl-hover)}
.ls-chip i{font:600 10.5px var(--font-mono);font-style:normal;color:var(--text-faint)}
.ls-chip.is-x i{color:var(--accent)}
.ls-chip button{width:16px;height:16px;margin-right:-4px;border-radius:4px;display:grid;place-items:center;font-size:10px;color:var(--text-faint)}
.ls-chip button:hover{color:var(--text);background:var(--fl-on)}
.ls-hint{margin:0;font-size:11.5px;line-height:1.45;color:var(--text-dim);text-wrap:pretty}
@media (max-width:900px){.ls-view{bottom:auto;top:132px;max-width:calc(100% - 24px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.revsetMatch = (id) => id === "all" ? () => true : (c) => !!c.inDefault;</script>
<script src="graph-data.js?v=3"></script>
<script type="text/babel" src="graph-gaps.jsx?v=3"></script>
<script type="text/babel" src="graph-layout.jsx?v=2"></script>
<script type="text/babel" src="graph-view.jsx?v=29"></script>
<script type="text/babel" src="graph-lines-study.jsx?v=5"></script>
</body>
</html>
