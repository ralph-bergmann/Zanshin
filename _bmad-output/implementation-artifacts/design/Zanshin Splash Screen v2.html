<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Zanshin — Splash Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;gap:0;font-family:"Inter",system-ui,sans-serif;background:var(--desk);transition:background 240ms}
body[data-desk="light"]{--desk:#e9eaee;--desk-ink:#3f3f46}
body[data-desk="dark"]{--desk:#0b0c10;--desk-ink:#8b8b93}
body[data-desk="tint"]{--desk:radial-gradient(120% 120% at 20% 10%,#5a6a86,#2b3346 60%,#171b26);--desk-ink:#c9cdd6}
.stage{display:grid;place-items:center;gap:26px;padding:48px 24px}

/* ---------- SPLASH ---------- */
.splash{position:relative;width:560px;height:320px;border-radius:14px;overflow:hidden;isolation:isolate;
  /* dezenter, nicht-linearer Verlauf: mehrere Radials + Conic-Sheen ueber indigo Grund */
  background:
    radial-gradient(90% 120% at 8% 0%,rgba(96,120,178,.34),rgba(96,120,178,0) 58%),
    radial-gradient(70% 90% at 100% 100%,rgba(220,168,91,.20),rgba(220,168,91,0) 60%),
    radial-gradient(120% 80% at 50% 118%,rgba(9,11,22,.85),rgba(9,11,22,0) 65%),
    conic-gradient(from 200deg at 78% 18%,rgba(255,255,255,.07),rgba(255,255,255,0) 28%,rgba(255,255,255,.04) 62%,rgba(255,255,255,0) 100%),
    linear-gradient(160deg,#1d2540,#131831 72%,#10142a);
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 0 0 1px rgba(8,10,20,.55),0 24px 60px -16px rgba(10,14,30,.65),0 4px 14px -4px rgba(10,14,30,.5)}
.splash::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;box-shadow:0 0 0 1px rgba(244,207,128,.10) inset}
/* Grain + Wellen-Silhouette */
.tex{position:absolute;inset:0;opacity:.5;mix-blend-mode:soft-light}
.silh{position:absolute;left:-10%;width:124%;bottom:-16%;opacity:.055;pointer-events:none}

.body{position:relative;height:100%;display:grid;grid-template-rows:1fr auto;padding:34px 36px 0}
.top{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mark{width:76px;height:76px;flex:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
.kanji-bg{position:absolute;right:22px;top:14px;writing-mode:vertical-rl;font-family:"Shippori Mincho",serif;font-weight:600;font-size:118px;line-height:1;color:#f4cf80;opacity:.06;letter-spacing:-.02em;pointer-events:none;user-select:none}
.lockup{display:flex;align-items:center;justify-content:center;gap:20px}
.lockup .kanji{font-family:"Shippori Mincho",serif;font-weight:500;font-size:44px;line-height:1;color:#f4cf80;letter-spacing:.04em;flex:none}
.wm{height:52px;flex:none;display:flex;align-items:center}
.tag{margin-top:14px;font-size:11.5px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;color:#a9b3d0}

.foot{border-top:1px solid rgba(255,255,255,.08);padding:14px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.ver{font:12px/1.5 "JetBrains Mono",monospace;color:#e7dcc4}
.ver span{color:#8792b4}
.status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#98a3c2;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#f4cf80;box-shadow:0 0 0 3px rgba(244,207,128,.16);animation:breathe 1.85s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:2px;background:linear-gradient(90deg,rgba(244,207,128,0),#f4cf80,#dca85b,rgba(181,131,70,0));animation:slide 2.1s cubic-bezier(.65,.05,.35,.95) infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}

/* ---------- Vorschau-Chrome ---------- */
.hint{font-size:12px;color:var(--desk-ink);letter-spacing:.02em}
.desks{display:flex;gap:6px;padding:4px;border-radius:9px;background:rgba(125,125,140,.16)}
.desks button{font:500 11.5px/1 "Inter",sans-serif;padding:7px 13px;border-radius:6px;border:0;cursor:pointer;color:var(--desk-ink);background:transparent}
.desks button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#18181b;box-shadow:0 1px 3px rgba(0,0,0,.18)}
body[data-desk="dark"] .desks button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#f4f4f5}
a{color:#dca85b}a:hover{color:#f4cf80}
</style></head>
<body data-desk="light">
<div class="stage">
  <div class="splash" data-screen-label="Splash">
    <svg class="silh" viewBox="14 76 228 116" aria-hidden="true"><g id="silh-g" fill="none" stroke-linecap="round"></g></svg>
    <svg class="tex" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)" opacity="0.32"></rect></svg>
    <div class="kanji-bg">残心</div>
    <div class="body">
      <div class="top">
        <div class="lockup"><span class="kanji">残心</span><div class="wm" id="wmMono"></div></div>
        <div class="tag">Jujutsu Client</div>
      </div>
      <div class="foot">
        <div class="ver">2026.2.1 <span>· Build 4127</span></div>
        <div class="status"><i class="dot"></i><span id="stat">Repository wird geladen…</span></div>
      </div>
    </div>
    <div class="bar"><i></i></div>
  </div>
  <div class="hint">Zentriertes Lock-up · Wellen nur als stilles Ornament · Bewegung allein in der Ladeleiste. Desktop testen:</div>
  <div class="desks" id="desks">
    <button aria-pressed="true" data-d="light">Day</button>
    <button aria-pressed="false" data-d="dark">Night</button>
    <button aria-pressed="false" data-d="tint">Wallpaper</button>
  </div>
  <div class="hint"><a href="Zanshin Wordmark Study.html">Wortmarken-Studie ansehen</a></div>
</div>
<script src="wordmark.js"></script>
<script>
const LINES=[
 {y:92, w:9,  c:"#f4cf80", per:10, start:[28,92],
  segs:[[[72,60],[116,92]],[[160,124],[196,92]],[[218,84],[228,90]]]},
 {y:134,w:11, c:"#dca85b", per:10, start:[24,134],
  segs:[[[76,100],[132,134]],[[188,168],[212,134]],[[226,130],[234,134]]]},
 {y:178,w:13, c:"#b58346", per:15, start:[22,178],
  segs:[[[88,138],[154,178]],[[220,218],[234,178]]]}
];
const X0=22,X1=234,T={h:20.5,sig:40,sweep:1.3,pause:.55};
function basePoints(l){if(l._pts)return l._pts;const p=[[l.start[0],l.start[1]]];let p0=l.start;
 l.segs.forEach(function(s){const c=s[0],p1=s[1];for(let i=1;i<=l.per;i++){const t=i/l.per,m=1-t;
  p.push([m*m*p0[0]+2*m*t*c[0]+t*t*p1[0],m*m*p0[1]+2*m*t*c[1]+t*t*p1[1]])}p0=p1});l._pts=p;return p}
function pathFor(l,p){const pts=basePoints(l);let cx=0;
 if(p>=0){const e=.5-.5*Math.cos(p*Math.PI),a=X0-T.sig*1.7,b=X1+T.sig*1.7;cx=a+e*(b-a)}
 let d="";for(let i=0;i<pts.length;i++){const x=pts[i][0];let y=pts[i][1];
  if(p>=0){const u=(x-cx)/T.sig;y-=T.h*Math.exp(-u*u)}
  d+=(i?"L ":"M ")+x.toFixed(1)+" "+y.toFixed(2)+" "}return d}

const silh=document.getElementById("silh-g");
silh.innerHTML=LINES.map(function(l,i){return '<path d="'+pathFor(l,-1)+'" stroke="#f4cf80" stroke-width="'+(l.w*.62)+'" opacity="'+(.95-i*.18)+'"/>'}).join("");

const steps=["Repository wird geladen…","Index wird aufgebaut…","Operation-Log wird gelesen…","Arbeitskopie wird geprüft…"];
let si=0;setInterval(function(){si=(si+1)%steps.length;document.getElementById("stat").textContent=steps[si]},2100);

document.getElementById("wmMono").innerHTML=ZanshinWordmark.svg("ZANSHIN",{cap:38,track:32,swPx:2.8,gradient:["#fff6e4","#f4cf80","#d9a755"]});
document.getElementById("desks").addEventListener("click",function(e){const b=e.target.closest("button");if(!b)return;
 document.body.dataset.desk=b.dataset.d;
 this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))})});
</script>
</body></html>
