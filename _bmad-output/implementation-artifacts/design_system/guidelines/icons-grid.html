<!-- @dsCard group="Brand" viewport="900x860" name="Icons — on the grid" subtitle="Every glyph whole at 4×, on its 16-unit grid with the 1-unit live-area keyline — the SVG sources the app renders" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>body{margin:0;padding:20px 24px;background:var(--canvas);min-height:100vh;box-sizing:border-box;color:var(--text);font-family:var(--font-sans)}.hd{display:flex;align-items:center;gap:14px;margin-bottom:16px}.hd p{margin:0;font-size:var(--fs-md);color:var(--text-dim)}.g{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:14px 10px}.c{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.t{position:relative;width:72px;height:72px;border-radius:var(--radius-md);background-color:var(--card-solid);background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:4px 4px;background-position:4px 4px;box-shadow:inset 0 0 0 1px var(--border-strong)}.t>i{position:absolute;left:4px;top:4px;width:64px;height:64px;outline:1px solid var(--border-strong)}.t>i::after{content:"";position:absolute;inset:4px;outline:1px dashed var(--accent-line);opacity:.55}.t svg{position:absolute;left:4px;top:4px;width:64px;height:64px;color:var(--text)}.s{display:flex;align-items:center;gap:8px;height:16px;color:var(--text-muted)}.s svg{display:block}.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--fs-sm) var(--font-mono);color:var(--text-dim)}</style>
</head>
<body>
<div class="hd"><p>59 glyphs · 1 grid line = 1 unit · dashed = live area 1–15 · 16 and 12px below each · the Flutter app renders these files (precompiled, tinted in one colour) — there is no icon font</p></div>
<div class="g" id="g"></div>
<script>
(async () => {
  const strip = (t) => t.replace(/<metadata>[\s\S]*?<\/metadata>/g, "").replace(/\s?xmlns:c2pa="[^"]*"/, "");
  const { names } = await (await fetch("../assets/icons/glyphs.json")).json();
  const ui = await Promise.all(names.map((n) => fetch("../assets/icons/ui/" + n + ".svg").then((r) => r.text()).then(strip)));
  document.getElementById("g").innerHTML = names.map((n, i) => '<div class="c" title="' + n + '"><div class="t"><i></i>' + ui[i] + '</div><div class="s">' + ui[i].replace("<svg", '<svg style="width:16px;height:16px"') + ui[i].replace("<svg", '<svg style="width:12px;height:12px"') + '</div><div class="n">' + n + "</div></div>").join("");
})();
</script>
</body>
</html>
