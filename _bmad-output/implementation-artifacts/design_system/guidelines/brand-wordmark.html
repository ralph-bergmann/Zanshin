<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark" subtitle="Monoline geometric strokes, A without crossbar, wide tracking — paths only, no font" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="specimen.css"/>
</head>
<body>
<div class="grid" style="grid-template-columns:1.3fr 1fr 1fr">
<div style="display:grid;place-items:center;height:96px;border-radius:12px;background:var(--canvas);border:1px solid var(--border)"><img src="../assets/zanshin-wordmark-gold.svg" alt="ZANSHIN" style="height:30px"/></div>
<div data-theme="paper" style="display:grid;place-items:center;height:96px;border-radius:12px;background:var(--canvas);border:1px solid var(--border)"><img src="../assets/zanshin-wordmark-ink.svg" alt="ZANSHIN" style="height:22px"/></div>
<div style="display:grid;place-items:center;height:96px;border-radius:12px;background:#000"><img src="../assets/zanshin-wordmark-white.svg" alt="ZANSHIN" style="height:22px"/></div>
</div>
<div class="grid" style="grid-template-columns:1.3fr 1fr 1fr;margin-top:8px"><span class="v">gold gradient #fff6e4 → #f4cf80 → #d9a755 · on night</span><span class="v">ink #26304d · on paper</span><span class="v">#f2f3f7 · on pure black</span></div>
</body>
</html>
