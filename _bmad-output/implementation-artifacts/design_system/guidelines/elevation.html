<!-- @dsCard group="Spacing" viewport="700x220" name="Elevation & rings" subtitle="Four shadows — island, menu (one material for every menu, popover, callout and the peek), tooltip, sheet — plus the selection, @ and drop rings. Windows take the system's shadow." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="specimen.css"/>
</head>
<body>
<div style="display:flex;justify-content:space-between;padding:12px 6px 0">
<div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-island);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--shadow-island);"></div><span class="k" style="margin-top:8px">--shadow-island</span><span class="v">islands, toast, panels</span></div><div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-popover);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--shadow-menu);"></div><span class="k" style="margin-top:8px">--shadow-menu</span><span class="v">every menu, popover, callout, peek</span></div><div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-chip);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--shadow-tooltip);"></div><span class="k" style="margin-top:8px">--shadow-tooltip</span><span class="v">tooltips, the drag command</span></div><div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-dialog);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--shadow-dialog);"></div><span class="k" style="margin-top:8px">--shadow-dialog</span><span class="v">modal sheets (not windows)</span></div>
<div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-card);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--ring-select);border-color:var(--accent-line)"></div><span class="k" style="margin-top:8px">--ring-select</span><span class="v">selected</span></div><div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-card);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--ring-wc);border-color:var(--co)"></div><span class="k" style="margin-top:8px">--ring-wc</span><span class="v">@ glow</span></div><div class="sw" style="align-items:center;text-align:center"><div style="width:96px;height:56px;border-radius:var(--radius-card);background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border);box-shadow:var(--ring-drop);border-color:var(--accent-line)"></div><span class="k" style="margin-top:8px">--ring-drop</span><span class="v">drop target</span></div>
</div>

</html>
