<!-- @dsCard group="Brand" viewport="700x210" name="Wave ornament" subtitle="The icon’s waves, large and quiet in the ground — 5% opacity, never animated in the UI" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="specimen.css"/>
</head>
<body>
<div class="grid" style="grid-template-columns:1fr 1.4fr">
<div style="display:grid;place-items:center;height:150px;border-radius:12px;background:var(--canvas);border:1px solid var(--border)"><img src="../assets/zanshin-waves.svg" alt="" style="height:96px"/></div>
<div style="position:relative;height:150px;border-radius:12px;overflow:hidden;border:1px solid rgba(244,207,128,.1)"><img src="../assets/zanshin-splash-bg.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/><img src="../assets/zanshin-wave-ornament.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/></div>
</div>
<div class="grid" style="grid-template-columns:1fr 1.4fr;margin-top:8px"><span class="k">assets/zanshin-waves.svg</span><span class="k">zanshin-splash-bg.svg + zanshin-wave-ornament.svg</span></div>
</body>
</html>
