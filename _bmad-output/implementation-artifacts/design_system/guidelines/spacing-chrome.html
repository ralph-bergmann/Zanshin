<!-- @dsCard group="Spacing" viewport="700x330" name="Chrome geometry — the 12px rhythm" subtitle="Traffic lights + rail form one 52px column; islands sit 12px from every edge" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="specimen.css"/>
<style>.w{position:relative;height:290px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}.i{position:absolute;border-radius:14px}.g{position:absolute;border:0 dashed var(--primary-action);opacity:.7}.n{position:absolute;font:600 10.5px var(--font-mono);color:var(--primary-action);background:var(--fl-bg-solid);padding:1px 5px;border-radius:4px;white-space:nowrap}</style>
</head>
<body>
<div class="w zs-canvas">
<div class="zs-traffic" style="position:absolute;left:12px;top:28px"><button class="c"></button><button class="m"></button><button class="z"></button></div>
<div class="i zs-glass" style="left:76px;top:12px;width:150px;height:44px"></div>
<div class="i zs-glass" style="left:250px;top:12px;width:250px;height:44px"></div>
<div class="i zs-glass" style="right:136px;top:12px;width:84px;height:44px"></div>
<div class="i" style="right:12px;top:12px;width:112px;height:44px;box-shadow:inset 0 0 0 1px var(--primary-ring),var(--fl-shadow);background:linear-gradient(180deg,var(--primary-fill-a),var(--primary-fill-b)),var(--fl-bg)"></div>
<div class="i zs-glass" style="left:12px;top:68px;width:52px;height:150px;border-radius:16px"></div>
<div class="i zs-glass" style="right:12px;top:68px;width:180px;bottom:12px;border-radius:16px"></div>
<div class="g" style="left:76px;top:0;bottom:0;border-left-width:1px"></div>
<div class="g" style="left:0;right:0;top:68px;border-top-width:1px"></div>
<span class="n" style="left:82px;top:236px">x 76 = 12 + 52 + 12</span>
<span class="n" style="left:300px;top:74px">y 68 = 12 + 44 + 12</span>
<span class="n" style="left:12px;top:228px">52</span>
<span class="n" style="left:236px;top:24px">44</span>
<span class="n" style="right:200px;top:150px">inspector 460</span>
</div>
</body>
</html>
