<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="specimen.css"/>
<style>.chip{height:104px}</style>
</head>
<body>
<div class="grid" style="grid-template-columns:1fr 1fr">
<div class="sw"><div class="chip" style="background:var(--canvas)"></div><span class="k">--canvas · night</span><span class="v">radial lift #6078b2 @ 24% from top-left + 165° #1a2038 → #12162a → #0e1224 · base --canvas-base #12162a</span></div>
<div class="sw"><div class="chip" data-theme="paper" style="background:var(--canvas)"></div><span class="k">--canvas · paper</span><span class="v">radial warm #dca85b @ 20% from top-left + 165° #f7f4f0 → #f0ece7 → #e8e3dd · base #f0ece7</span></div>
</div>
</body>
</html>
