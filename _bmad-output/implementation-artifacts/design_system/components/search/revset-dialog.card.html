<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel">
(() => {
  const { RevsetDialog } = window.ZanshinDesignSystem_a33847;
  const SEED = [
    { id: "c-onb", name: "Onboarding feature", op: "&", rules: [{ fn: "files", mode: "prefix", value: "lib/features/onboarding/", not: false }] },
    { id: "c-lena", name: "Lena’s changes", op: "&", rules: [{ fn: "author", mode: "substring", ci: true, value: "Lena", not: false }] },
    { id: "c-fix", name: "My fixes", op: "&", rules: [{ fn: "mine", not: false }, { fn: "subject", mode: "glob", value: "fix*", not: false }] },
  ];
  const COUNT = { default: 33, all: 35, "c-onb": 7, "c-lena": 12, "c-fix": 1 };
  function One({ sel0, home0, active = true, ask0 = false, edited = false }) {
    const [configs, setConfigs] = React.useState(edited ? SEED.map((c) => (c.id === "c-fix" ? { ...c, name: "My fixes this week" } : c)) : SEED), [sel, setSel] = React.useState(sel0), [home, setHome] = React.useState(home0);
    const [ask, setAsk] = React.useState(ask0);
    const dirty = configs !== SEED || home !== home0;
    return <RevsetDialog height={580} active={active} project="zanshin-app" configs={configs} selected={sel} defaultId={home} me="Ralph Stein" matchCount={COUNT[sel] != null ? COUNT[sel] : 0} total={35} dirty={dirty}
      discarding={ask} onDiscarding={setAsk} onSelect={setSel} onDefaultChange={setHome} onChange={setConfigs} onCancel={() => { setConfigs(SEED); setHome(home0); }} onApply={() => {}} onOk={() => {}}/>;
  }
  const Demo = () => (
    <div className="col">
      <div className="lbl">A built-in selected — jj log is the default, its switch locked on · inactive: the graph is key</div>

      <One sel0="c-fix" home0="c-onb" edited ask0/>
    </div>
  );
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
})();
</script>
