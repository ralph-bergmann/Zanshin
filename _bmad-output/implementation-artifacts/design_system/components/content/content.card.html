<!doctype html>
<html lang="en">
<head>

<style>body{margin:0;padding:20px 24px;background:var(--canvas);min-height:100vh;box-sizing:border-box;color:var(--text)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:16px}.lbl{font:var(--type-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-dim);width:78px;flex-shrink:0}.g{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}.hd{display:flex;align-items:center;gap:8px;padding:0 0 8px;font-size:12px;color:var(--text-dim)}.hd b{font-size:12.5px;font-weight:600;color:var(--text)}.list{display:flex;flex-direction:column;gap:1px;margin:0 -8px}.keys{display:flex;align-items:center;gap:4px;margin-top:16px;font-size:11px;color:var(--text-dim)}.tree{margin-top:18px;display:flex;flex-direction:column;gap:1px;padding:6px;border-radius:12px;background:var(--fl-sheen),var(--fl-bg-solid);border:1px solid var(--fl-border)}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
(() => {
  const { FileRow, DiffView, DiffHunk, ProjectRow, Kbd, Segmented, Checkbox } = window.ZanshinDesignSystem_a33847;
  function Demo() {
    const [sel, setSel] = React.useState(0);
    const [mode, setMode] = React.useState("unified");
    const [hs, setHs] = React.useState({ a: true, b: false });
    const [viewed, setViewed] = React.useState(false);
    const [parts, setParts] = React.useState([1]);
    // Story 10.43: hidden unchanged lines between and around the hunks; a control shrinks the count (this preview opens no lines)
    const [gaps, setGaps] = React.useState({ top: 4, ab: 22, bc: 16, cd: 2383, end: 40 });
    const gap = (id, extra) => (gaps[id] > 0 ? [{ t: "unchanged", n: gaps[id], ...extra }] : []);
    const expand = (id) => (row, how) => setGaps({ ...gaps, [id]: how === "all" ? 0 : Math.max(0, gaps[id] - 20) });
    const nulls = (xs) => xs.map(() => null);
    // Story 10.41: the diff options (whitespace, context lines) and a hunk as jj diff -w prints it — a TextField wrapped in Semantics:
    // the real changes, re-indented context lines with their marks, a gap for the lines jj skips (Show / Hide), and a second part
    // that only re-indents, folded into one hatched row with its checkbox. Any pick opens the gaps without a pill.
    const [ws, setWs] = React.useState("all");
    const [ctx, setCtx] = React.useState(3);
    const [wsPicked, setWsPicked] = React.useState([]);
    const [gapOpen, setGapOpen] = React.useState(false);
    const [foldOpen, setFoldOpen] = React.useState(false);
    const flip = (xs, p) => (xs.includes(p) ? xs.filter((x) => x !== p) : [...xs, p]);
    const ignoring = ws !== "show";
    const pickedAny = wsPicked.length > 0;
    const k = ignoring ? " " : "~";
    const mv = (o, n, field) => k + o + ":" + n + "|      {+  +}" + field;
    const wsLines = [], wsParts = [];
    const add = (line, p) => { wsLines.push(line); wsParts.push(p); };
    gap("top", { top: true }).forEach((g) => add(g, null));
    add("~5:5|    return {+Semantics(+}", 0);
    add("+:6|{+      identifier: identifier,+}", 0);
    add("~5:7|{+      child: +}TextField(", 0);
    add(mv(6, 8, "controller: controller,"), 0);
    add(mv(7, 9, "enabled: enabled,"), 0);
    if (ignoring) add({ t: "gap", n: 3, open: gapOpen || pickedAny, fixed: pickedAny }, 0);
    if (!ignoring || gapOpen || pickedAny) [mv(8, 10, "style: textStyle,"), mv(9, 11, "focusNode: focusNode,"), mv(10, 12, "obscureText: obscureText,")].forEach((l) => add(l, 0));
    add(mv(11, 13, "maxLines: maxLines,"), 0);
    add("+:14|{+      ),+}", null);
    add(" 12:15|    );", null);
    add(" 13:16|  }", null);
    if (ignoring) add({ t: "fold", n: 1, open: foldOpen || pickedAny, fixed: pickedAny }, 1);
    if (!ignoring || foldOpen || pickedAny) add(k + "17:20|  {+  +}static const x = 1;", 1);
    const files = [["M", "lib/onboarding/swipe_controller.dart"], ["A", "lib/onboarding/widgets/swipe_hint.dart"], ["D", "lib/legacy/onboarding_pager.dart"], ["R", "lib/onboarding/pager.dart", "lib/legacy/pager.dart"], ["M", "test/onboarding/swipe_controller_test.dart"]];
    return (
      <div className="g">
        {/* Story 10.42: calm — no status letter, no counts, a quiet word after the name; unchecked boxes show only while the pointer
            is over this pane or focus is inside it (.zs-check-reveal); picked and mixed always show. */}
        <div className="zs-check-reveal">
          <div className="hd"><span className="zs-file-gut" style={{ marginLeft: -8 }}><Checkbox size="sm" mixed label="Select all"/></span><b>Changes</b><span>5 files</span></div>
          <div className="list" role="list">{files.map(([s, p, from], i) => <FileRow key={p} status={s} path={p} from={from} selected={sel === i} viewed={i === 4} selectable checked={i === 1} mixed={i === 0} onClick={() => setSel(i)}/>)}</div>
          {/* Story 10.39 / 10.42: the tree — a joined folder row (mixed, open glyph), a closed one, files by name under their folder */}
          <div className="list" role="tree" aria-label="Tree">
            <FileRow open name="lib/onboarding" path="lib/onboarding" selectable mixed/>
            <FileRow tree depth={1} status="M" path="lib/onboarding/swipe_controller.dart" selectable checked/>
            <FileRow open={false} depth={1} name="widgets" path="lib/onboarding/widgets" selectable/>
            <FileRow tree status="A" path="README.md" selectable/>
          </div>
          <div className="tree" role="tree">
            <ProjectRow kind="group" name="Mobile" expanded count={3}/>
            <ProjectRow depth={1} name="MyApp" path="~/code/work/mobile/myapp" branch="feature/new-ui" status="dirty" ahead={6} lastOpened="now" open selected/>
            <ProjectRow depth={1} name="design-kit" path="~/code/work/mobile/design-kit" branch="main" status="behind" behind={3} lastOpened="5d ago"/>
            <ProjectRow depth={1} name="old-experiment" path="~/code/play/old-experiment" branch="—" status="missing" lastOpened="6mo ago"/>
          </div>
          <div className="tree" role="tree" aria-label="Moving rows">
            <ProjectRow kind="group" name="Backend" count={2} drop="into"/>
            <ProjectRow name="infra" path="~/code/work/infra" branch="main" status="clean" lastOpened="1w ago" drop="before"/>
            <ProjectRow name="dotfiles" path="~/dotfiles" branch="main" status="clean" lastOpened="today" dragging/>
            <ProjectRow kind="group" depth={1} editing name="" onCommit={() => {}} onCancel={() => {}}/>
          </div>
          <div className="keys"><span>Moving: into a group · between rows · in hand · naming a new group</span></div>
          <div className="keys"><Kbd>⌘</Kbd><Kbd>,</Kbd><span>Settings</span><span style={{ width: 10 }}></span><Kbd>⌘</Kbd><Kbd>↩</Kbd><span>Commit / Split</span></div>
        </div>
        <div className="zs-check-reveal">
        <DiffView file={files[sel][1]} copyPath={"/Users/you/code/app/" + files[sel][1]} viewed={viewed} onViewedChange={setViewed}
          options={{ whitespace: ws, context: ctx }} onOption={(id) => (id.startsWith("ws:") ? setWs(id.slice(3)) : setCtx(Number(id.slice(4))))}
          tools={<Segmented size="sm" label="Diff layout" value={mode} onChange={setMode} options={[{ value: "unified", icon: "split-inline", title: "Unified" }, { value: "split", icon: "split-side", title: "Side by side" }]}/>}>
          {/* Story 10.43: no header — one checkbox per part on its first changed row; resting the pointer on it draws the bar on
              every row of the part (the whitespace gap row included); gap rows of unchanged lines, their controls only while the
              pointer or focus is in this pane. Story 10.41: whitespace ignored — exactly jj diff -w's rows; a whitespace gap row
              with Show / Hide; a part that only re-indents is the same band, hatched, with its checkbox. */}
          <DiffHunk mode={mode} selectable parts={wsParts} picked={wsPicked} onTogglePart={(p) => setWsPicked(flip(wsPicked, p))} onExpand={expand("top")}
            onShow={(row) => (row.t === "gap" ? setGapOpen(true) : setFoldOpen(true))} onHide={(row) => (row.t === "gap" ? setGapOpen(false) : setFoldOpen(false))} lines={wsLines}/>
          <DiffHunk mode={mode} selectable picked={hs.a ? [0] : []} onTogglePart={() => setHs({ ...hs, a: !hs.a })} lines={[
            " 12:12|  final double threshold;",
            "~13:13|  void onEnd({+DragEndDetails d+}) {",
            "+:14|{+    if (d.primaryVelocity!.abs() > threshold) {+}",
            "+:15|{+      _commit(d.primaryVelocity! < 0);+}",
            "+:16|{+      return;+}",
            "+:17|{+    }+}",
            " 14:18|    _reset();",
            " 15:19|  }",
            " 16:20|",
            "~17:21|  static const _kSettle = [-220-]{+260+};",
          ]}/>
          <DiffHunk mode={mode} selectable picked={hs.b ? [0] : []} onTogglePart={() => setHs({ ...hs, b: !hs.b })} onExpand={expand("ab")} lines={[
            ...gap("ab"),
            " 40:45|  }",
            "-41:|  // [-Tablet only: the wide font overflows-] the app bar[-.-]",
            "-42:|[-  testWidgets('shows Save on the last step-]', (tester) async {",
            "+:46|  // {+The phone app bar has little room:+} the app bar{+ shows the short label.+}",
            "+:47|{+  testWidgets('shows Save on a phone+}', (tester) async {",
            "+:48|{+    await openWizard(tester, size: phone);+}",
            "+:49|{+  });+}",
            " 43:50|  });",
          ]}/>
          {/* Story 10.38: one hunk of three parts (jj's diff-editor sections) — a checkbox per part, the second picked; the numbers stay
              pinned when the hunks scroll sideways. */}
          <DiffHunk mode={mode} selectable parts={[...nulls(gap("bc")), null, 0, null, null, 1, 1, null, null, 2]} picked={parts} onTogglePart={(p) => setParts(parts.includes(p) ? parts.filter((x) => x !== p) : [...parts, p])} onExpand={expand("bc")} lines={[
            ...gap("bc"),
            " 60:60|  let a = 1;",
            "~61:61|  let b = [-2-]{+3+};",
            " 62:62|  let c = 4;",
            " 64:64|  let d = 5;",
            "-65:|[-  log(\"x\");-]",
            "+:65|{+  log(\"a line long enough to scroll the well sideways, so the numbers stay pinned at its left edge\");+}",
            " 66:66|  let e = 6;",
            " 68:68|  let f = 7;",
            "~69:69|  exit([-0-]{+1+});",
          ]}/>
          {/* Settings › Changed words off (Story 5.14): no tint; a changed line keeps its runs in their hue, a removed or
              added line shows only its fill and ink. */}
          <DiffHunk mode={mode} wordMarks={false} onExpand={(row, how) => expand(row.bottom ? "end" : "cd")(row, how)} lines={[
            ...gap("cd"),
            " 2453:2453|        .into_inner()",
            "~2454:2454|        .map_err(|err| {+{+}",
            "+:2455|{+            let (source, out) = err.into_parts();+}",
            "+:2456|{+            let path = out.get_ref().lock_path().to_owned();+}",
            "+:2457|{+            PathError { path, source }+}",
            "+:2458|{+        })+}",
            "~2454:2459|{+        .map_err(+}GitResetHeadError::from_git[-(err.into_error())-])?;",
            " 2455:2460|    lock.commit()",
            ...gap("end", { bottom: true }),
          ]}/>
        </DiffView>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
})();
</script>
