<!-- @dsCard group="Components" viewport="1240x560" name="Split divider" subtitle="SplitDivider — the band between the inspector's files and diff: grip at rest, accent line on hover and drag, side by side from 780 and stacked below 740, minimums, double-click resets" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);min-height:100vh;box-sizing:border-box;color:var(--text);font-family:var(--font-sans)}
.row{display:flex;gap:24px;align-items:flex-start}
.ins{position:relative;height:400px;display:flex;flex-direction:column}
.split{flex:1;min-height:0;display:flex;padding:12px 16px 14px}
.split.is-y{flex-direction:column}
.pane{min-width:0;min-height:0;border-radius:10px;display:grid;place-items:center;font:var(--fs-sm) var(--font-mono);color:var(--text-dim)}
.files{background:var(--fl-hover)}
.diff{flex:1 1 0;border:1px solid var(--fl-border);background:var(--code-bg)}
.cap{margin:8px 2px 0;font-size:12px;color:var(--text-muted)}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.p{margin:0;font-size:12px;line-height:1.55;color:var(--text-muted);text-wrap:pretty}.p b{color:var(--text);font-weight:600}
code{font:11px var(--font-mono);color:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
(() => {
  const { Island, SplitDivider } = window.ZanshinDesignSystem_a33847;
  function Split({ width, className }) {
    const wide = width >= 780;
    const room = (wide ? width - 32 : 400 - 26) - 12;
    const def = room * (wide ? .34 : .38);
    const [files, setFiles] = React.useState(def);
    const min = wide ? 220 : 110, max = room - (wide ? 320 : 140);
    return (
      <div>
        <Island shape="panel" className="ins" style={{ width }}>
          <div className={"split" + (wide ? "" : " is-y")}>
            <div className="pane files" style={{ flex: "0 0 " + files + "px" }}>files · {Math.round(files / room * 100)}%</div>
            <SplitDivider className={className} axis={wide ? "x" : "y"} value={files} min={min} max={max} total={room} defaultValue={def} onChange={setFiles}/>
            <div className="pane diff">diff</div>
          </div>
        </Island>
        <p className="cap">{width}pt — {wide ? "side by side (≥ 780)" : "stacked (< 740)"}</p>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(
    <div>
      <div className="row"><Split width={800} className="st-hover"/><Split width={380}/></div>
      <div className="notes">
        <p className="p"><b>Band</b> — 12pt; at rest a 4pt grip in <code>--fl-border</code>, 10 % of its length; on hover and while dragging a full-length 2pt <code>--accent</code> line (the wide one shows it).</p>
        <p className="p"><b>Layout</b> — the inspector puts the files beside the diff from 780pt and above it below 740; between the two the last layout stays. Minimums: files 220 / 110, diff 320 / 140 — the diff's wins.</p>
        <p className="p"><b>Remembered</b> — the files' share per layout, app-wide (.34 / .38), written when a drag ends or on reset. Keys: ← → or ↑ ↓ 10 (⇧ 50), ↩ resets; VoiceOver: "Files and diff", a percentage.</p>
      </div>
    </div>
  );
})();
</script>
</body>
</html>
