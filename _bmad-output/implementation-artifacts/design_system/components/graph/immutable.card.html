<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{margin:0;padding:18px 24px;background:var(--canvas);min-height:100vh;box-sizing:border-box;color:var(--text);font-family:var(--font-sans)}h4{margin:0 0 14px;font:var(--type-caps);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-dim)}.cards{display:grid;grid-template-columns:repeat(4,200px);gap:30px 18px;margin-bottom:24px}.cell{display:flex;flex-direction:column;gap:8px}.cell span{font-size:var(--fs-sm);color:var(--text-dim)}.peeks{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px}.side{display:flex;flex-direction:column;gap:14px;padding-top:4px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.k{font:var(--fs-sm) var(--font-mono);color:var(--text-dim)}.zoom{display:grid;place-items:center;width:64px;height:64px;border-radius:var(--radius-md);background:var(--fl-hover)}.zoom .zs-hatch{transform:scale(4)}.paper{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:24px 24px 18px;margin:0 -24px -18px;background:var(--canvas)}p.n{margin:0;max-width:300px;font-size:var(--fs-md);line-height:1.45;color:var(--text-dim);text-wrap:pretty}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
