  10-13-time-layout-lab: done  # [UI] EXPERIMENT DONE 2026-09-27 (console session; OUTCOME decided by Ralph via the spike viewer on a real 1.4k-commit repo; closing the story = Claude's call on that outcome -- item 6 leaves the Flutter lab to Ralph, who can reopen it for a Flutter confirmation): layout modes Free (DEFAULT) + Compact, Time and Time+gaps DROPPED; lane order compact (DEFAULT) + greedy, optimized DROPPED (4-11 OQ 8). Why done: the story's outcome (item 5) IS this decision, now recorded and fed to 4-11, 10-2, 10-5 and 10-7; the Flutter lab (items 1-4) is not built -- with only Free and Compact left there is nothing to compare, and 10-2/10-4/10-12 exercise Free on real data. Residual questions re-homed: Free's constants + buses behind cards -> 4-11 OQ 4; committer vs author -> 4-10 OQ 2 / 10-2 (g); M1's knobs and the clock semantics are moot; real-repo recordings never enter git. Originally: added 2026-09-26 (Ralph, re-plan from the HTML design). Ralph wants commits made at about the same time on parallel branches at the SAME HEIGHT so order AND time distance are visible, and is unsure between FIXED ROWS and a FREE layout whose vertical spacing follows elapsed time. The A/B spike already implements every engine candidate (SPEC section 0: compact, time with the topological clamp D1, free with provisional constants D8) -> the question is which modes the PRODUCT exposes, the default, and the constants. Lab in the demo host only: real-repo dumps by the spike's stage-2 dumper run on a SCRATCH `jj git clone` of a local repo (Zanshin, ../jj; never `jj git init` in place -- ../jj is read-only, neither is a jj workspace today) + the spike's fixture/synthetic inputs, laid out by the spike's reference impl and recorded via 10-1's recorder. Variants: M0 Rows (engine compact/time = the design), M1 Rows + time-sized gaps between buckets (the ONLY view-side variant: a VerticalLayout, prefix sums over buckets, log/capped, lanes/routes unchanged, slider knobs), M2 Free y (engine free output via UniformRows at U = 16 -- NO view-side y or clamp; constants are the engine's, variants are separate recordings). Readouts: content height, gaps, 10-4's route report split into horizontals behind non-endpoint cards (free-mode issue SPEC D8; impossible in M0/M1) and verticals behind cards (blocked merges D9, every mode), same-height pairs. Recordings gate on the hard invariants only. Outcome = a dated decision fed to 4-11 (which modes ship, free constants, buses behind cards) + 10-2 (gutter) + 10-7 (Layout control); does NOT gate 4-11 (it carries all three modes). Faster path TAKEN 2026-09-26: the spike viewer (spikes/graph-layout-ab/viewer; virtualised, synth-100k at 60 fps) paints Compact/Time/Free/Time+gaps x greedy/optimized/compact on the real 1.4k-commit repo, the fixtures and synthetic inputs up to 100k. STATUS 2026-09-26: Ralph currently PREFERS FREE (tentative, still an experiment); his review led to a Free day axis (-> 10-2 item 9) and the compact lane order (-> 4-11 item 11). Still to decide: Free as the default + whether Compact/Time stay, M1's knobs, Free's constants (U 16, gap curve, cap 48) + buses behind cards (real all(): 11/15/13 horizontals cross a card under greedy/optimized/compact, none in the row modes), the default lane order (4-11 OQ 8), every layout needs timestamps if Free is the default (4-10 OQ 1), whether the Flutter lab shrinks to a confirmation or is dropped. Open: exposed modes + default, M1 knobs, M2 constants, committed recordings, committer vs author timestamp, clock semantics (Time re-buckets on "now", free never relayouts on a tick). Depends on 10-1, 10-4, spike stages 2-3 (uses 10-2/10-3 if landed). See epics.md Story 10.13.
