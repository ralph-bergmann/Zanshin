  10-5-graph-view-model-repo-wiring: backlog  # [UI/bridge] added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. GraphViewModel = @inject ChangeNotifier + ViewModelFactory init: (handle at init). Declares the view's PORTS: GraphSource = layout(GraphRequest) (recorded until 10-12) + the handle's events + logDefaults (real adapters here), and GraphActions (run a verb; fake here, real in 10-9, so 10-6's double-click and 10-8's action row need not wait). Exports RepoHandle/OpenedRepoHandle/LogDefaults/ZanshinFfiException/Precondition. GraphRequest = revset (the "jj log" preset = EFFECTIVE revsets.log from logDefaults().log, or all()), layout mode (Compact|Time, + Free if 10-13 exposes it), lane order (engine knob), prioritize/shortPrefixes/anchors passed explicitly (syntheticElided no longer sent: 4-10's topology has no synthetic nodes; its meaning stays 10-4 (a)); greedy first, then optimized above ~50k many-lane nodes (4-11; the greedy result is shown until the optimized one replaces it, not dropped as stale); utcOffsetMin alongside now, "now" for Time (the offset also for Free's day buckets if 4-11 OQ 9 is accepted; Free sends no "now"); no W/H (layout is W-independent). Reload on OpHeadsChangedEvent + own mutations, coalesced 1+1, latest wins, stale dropped; own-snapshot op converges; a Time re-bucket (10-2's clock policy) = a new request with a new "now" + anchored relayout. ANCHOR on swap: node key + viewport offset on both axes (a new head shifts every row one pitch; lane order can move columns). Re-centre on @ at first layout (instant) and after a revset/layout switch IN THE SAME relayout, REPLACING the anchor there; width/detail changes never jump. ONE SCROLL PRECEDENCE for 10-1/10-7/10-8/10-14: explicit reveal (bookmark pick, locate @, go-to-change) > @ re-centre on a switch > anchor (fallback when the key is absent; the rule for reloads, card size, side panels unless 10-8 (e) keeps the raw offset); a reveal is consumed once, never re-armed (