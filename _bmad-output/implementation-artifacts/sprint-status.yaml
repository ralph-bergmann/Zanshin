  11-7-settings-window: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). One 620 px glass sheet with tabs General | <project>; ⌘, toggles it (a no-op over the Projects dialog), also opened from the Project menu and View options; the scope lines show 9-28's configPath paths (never hardcoded); every jj row shows its config key and the effective value + source. GENERAL: Theme (the existing appearance.themeMode), Density (new; scales the base size; open: keep it -- recommended), Hide controls (new, default on; gates 11-3's calm), Diff layout (new, Unified by default; 10-24), Identity user.name/user.email at the user scope via 9-28 (shows the working-copy-author fact; the target of 9-27's identity_missing). PROJECT: git.fetch / git.push selects of remotes() (open: list/pattern values since jj 0.46 -> read-only TOML text + Edit… -- recommended), "Check for remote changes" Off/5/15 min (default 15; drives 11-8's 9-24 poll; the export's "Fetch automatically" promises a real fetch), Trunk = revset-aliases."trunk()" written as <name>@<remote> like the CLI's own writer (+ Custom…), Immutable heads = revset-aliases."immutable_heads()" (a broken value -> 10-5's revset error + the previous value offered back), a repo-scope user.email switch (set/unset). Writes of trunk()/immutable_heads()/revsets.log feed 10-5 item 16 (one re-request under the anchor). Witnesses on a fake config port. Depends on 11-2, 11-3, 11-5, 11-8; 9-27/9-28 done. See epics.md Story 11.7. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Settings becomes a window of its own on 11-12 (key settings, 620 wide, shrink-wrapped height, title = the tab label; decisions 16.13, 16.42 d); ⌘, opens or activates it on the tab shown last and never toggles (16.14); General gains 'Accent colour: Follow macOS · Zanshin' (16.2) and Theme Paper · Night (16.11); Zs controls (16.1). Depends on 11-12, 11-11, 11-13. DESIGN UPDATE 2026-10-26 (console session, DS #12/#13): Settings gets PAGES (SettingsRow onOpen navigation row -> SettingsPage with '‹ <project>', ⌘[, the window title = the page name; a page belongs to its tab); History's 'Immutable heads' text field becomes the page 'Immutable commits' (ImmutablePage: Built in = the 4 builtin_immutable_heads() switches, Also immutable = others (trunk().. & ~mine()) / bookmark chips / custom revset, Result well with the TOML + count + heads, Reset). Claude's proposals: chips written as present(<name>); custom revset written on ↩/blur only once revsetCounts(cap 0) resolves it; Reset = configUnset at repo scope; the effective alias is read back and mapped onto the controls; count = revsetCounts('::immutable_heads() ~ root()', cap 10000). Card menu's 'Immutable commits…' (10-15) opens it. Depends also on 10-3 (HatchSwatch) and 9-25.
  11-8-sync-fetch-push-poll-badge: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). The ACTION group's Fetch and Push (36 px icon buttons; the tooltips name the jj command + the resolved remotes). FETCH until 9-30: one remote -> fetch it, several -> a menu to pick one, none -> disabled; with 9-30: no remote passed (the CLI's defaults), enabled while remotes() is not empty; progress from 6-4a's ProgressEvents, the project dot reads "syncing", the result or the error in 10-23's toast with Retry; the graph reloads via op-heads. PUSH disabled until 9-20 (then the CLI's defaults, git.push + revsets.git-push passed through; open: no confirmation -- recommended, as in the CLI; undo warns per 9-39). POLL (decision (g)): 9-24's read-only remote-change check at 11-7's interval and on window activation -- no operation, nothing moves; BADGE = the number of remote bookmarks that moved/appeared/vanished, the tooltip names them, no commit count, a fetch clears it; nothing before 9-24. Depends on 11-3, 11-5, 11-7, 10-23; 6-4a/2-9 shipped; 9-30, 9-24, 9-20 backlog. See epics.md Story 11.8. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Push opens a selection sheet with a --dry-run preview (⇧⌘P) per DS PushDialog, with jj v0.46.0's per-mode semantics (decisions 16.8, 16.25); this supersedes the push with the CLI's defaults and no confirmation, design question (b) and the non-goal 'pushing single bookmarks'; Fetch has no shortcut (16.42 m); both buttons are Zs controls. Depends on 9-20, 11-11, 11-13. NOTE 2026-10-21 (Ralph, after the story loop 9.24/9.30/9.31; epics.md 11.8 dated note): witness RepoHandle.remoteChanges('origin') once in the running app (Marionette), since dart test reaps the git child; the timed poll gets NO special auth handling (1Password/credential dialogs may appear, as in SourceTree) -- an unconfirmed tick fails quietly, no toast, next tick retries, tick