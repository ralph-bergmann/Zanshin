  10-33-ignore-whitespace-in-the-inspector-diff: backlog  # [UI] added 2026-11-12 (Ralph, console session; Sourcetree has the option). Flutter UI work re-indents a lot (wrapping a widget in Padding shifts its whole subtree); jj diff -b (--ignore-space-change) / -w (--ignore-all-space) drop lines that changed only in whitespace. BACKEND DONE, CLI parity, no Rust work: zanshin-jj Whitespace (crates/zanshin-jj/src/hunks.rs) -> jj-lib LineCompareMode; FFI + zanshin_core zanshinDiff(whitespace: DiffWhitespace, default exact; packages/zanshin_core/lib/src/ffi/diff.dart); the app never sets it. SCOPE: a switch in the inspector diff header next to Unified / Side by side (app/lib/src/features/graph/inspector_diff.dart; the Undo Timeline's operation view reuses the widget, so it gets the switch too); a mode change reloads the diff; remembered as a setting like GeneralSettings.diffLayout (packages/zanshin_settings), also in Settings > General. NEEDS DESIGN, Claude's proposal (not Ralph-decided): three modes like the CLI, show all (default, the CLI's) / ignore changes in amount (-b) / ignore all (-w); the control from the DS (DS change via the design-artifacts skill). CHECK IN THE STORY: what Sourcetree's option does (-b, -w or both); whether the word marks (5-2, 5-9) also ignore whitespace under -b / -w; a file whose every change is whitespace keeps its section with no hunks (hunks.rs test ignoring_whitespace_drops_a_whitespace_only_hunk) -> the view needs a note. Non-goals: backend changes, a mode per file. Witnesses: a subtree wrapped in Padding leaves only the new Padding( lines and closing brackets under -b; "a b" -> "a  b" drops out under -b and -w, "a b" -> "ab" only under -w; the mode survives a restart; the operation view shows the switch. Depends on 10-24 (done), 10-32 (done). See epics.md Story 10.33.
  10-34-word-marks-differ-in-lightness: done  # [UI] DONE 2026-11-12 (bmad-build-auto, spec-10-34-word-marks-differ-in-lightness): the story's starting values unchanged (night rem .24 / add .38, paper rem .40 / add .18) in DS tokens/colors.css + ZsColors + _ds_manifest.json; zs_tokens_test pins the three rules over all 144 appearances (dL* 15.2 night / 13.6 paper on a changed line; --text >= 4.76:1, night added word on its own line is the tightest; each fill >= 8.6 L* off its surface); DS + canvas republished. STORY LOOP DONE 2026-11-12: final gate green without a fix-up run; catalogue checked with Marionette (night + paper, unified), the DS Content card serves the same values. For Ralph's eye: paper's removed marks are strong (.40), its added marks sit close to the added line's fill (8.6 L*). WAS: [UI] added 2026-11-12 (Ralph, console session, after 5-10; takes over the deferred-work entry "On a changed line the removed and added word marks differ by hue only" and changes 10-32's token values). Since 5-10 one line can hold removed and added words side by side; their fills --rem-word-bg / --add-word-bg differ by hue only (CIE L* on the code well: paper 88.2 vs 88.1, night 25.6 vs 31.4), which the DS checklist ("differ in lightness, not hue alone") warns against. DECIDED (Ralph): a lightness step, added = the lighter fill, removed = the darker one, in night and paper; no underline, no strikethrough, no other cue. SCOPE: new values for the two tokens, no new token; starting values night rgba(248,113,113,.24) / rgba(74,222,128,.38), paper rgba(194,58,58,.40) / rgba(26,127,69,.18), tunable inside the rules. RULES (both themes, composited as the inspector draws: word fill over --code-bg on --fl-bg-solid, on a removed/added line also over its --rem-bg / --add-bg): the two word fills differ by >= 12 in CIE L* on a changed line; --text keeps >= 4.5:1 on every word fill wherever it is drawn; each word fill differs from the surface under it by >= 8 in L*. WHERE: DS tokens/col