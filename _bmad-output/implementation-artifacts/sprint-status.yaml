nputs; the checker gains 4-13's column invariant I7; a stack toggle = an anchored relayout (anchor = the toggled stack); callouts (10-6) are card-anchored widgets, the card pinned while open. 2026-09-30 (design update, e243dd2): recordings gain the 52-commit sample at e243dd2 (both revsets; the design's flags = a stand-in for a narrower revset, defect 24) for 10-19's gaps; records carry NO N (counts dropped); the spike's `node tools/design-input.mjs --rev e243dd2` converts this export (fixed 2026-09-30; without --rev it reads the pinned 57f259c); for 10-20 (a constraint only): keep the previous layout's nodes mounted during a transition and paint them on an overlay layer with opacity/blur/offset, visible set = the union, a card's y = a per-key paint parameter. See epics.md Story 10.1. DESIGN UPDATE 2026-10-14 (export e74ced3): offX 0 in both modes (no gutter, same width); I8 joins the checker after 4-14; edges come from 4-15's router (a card-size change re-runs it, no layout request); the plane gets margins from 10-5's insets (GV:1065-1077); no scrollbars (the minimap is the scroll indicator, FC:18-19; design question (a) answered); the arrow cursor everywhere, grabbing only while panning, an I-beam in fields (FC:144-152). Item 12 is replaced by 11-1's token layer, and the demo host's file and main*.dart become Claude's proposals (decision (e)). Recordings: design-input.mjs cannot read e74ced3 (GD unchanged, e243dd2 inputs stay), the Lines Study's FAN/PRESETS join as router fixtures, and for 10-20's FLIP a card's x and y are per-key paint parameters. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The demo host becomes the Widgetbook 'Graph' folder, with slow motion = Widgetbook TimeDilation (decision 16.30); resize cursors are one-way with a drag-time override (16.42 q); offsets follow live, resizable insets.
  10-2-canvas-background-time-gutter: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph named "Hintergrund" as its own piece), re-authored 2026-09-26 from the HTML design. Canvas #12162a/#f0ece7; dot grid 1 px every 24 px offset 4, anchored to the content, covering max(content, viewport), ONE draw call per frame. Time (and Free, see FREE DAY AXIS): sticky 88 px gutter painted above the cards with a canvas-base->transparent gradient; hits PASS THROUGH to cards (pointer-events:none -- replaces the old "absorb hits"); one mono pill per bucket centred on the bucket's OLDEST node; dotted guides (dash 2 6) in the gap below each bucket except the oldest, no height; content offX 88. Labels formatted by the view from the layout's bucket kind + value: ladder 10m/20m/40m/1h/2h/4h/8h/12h, then "Yesterday"/"Sep 23" from the bucket value with the engine's fixed offset (spike D7), so labels never disagree with buckets. The BUCKETING (rows) is 4-11's and needs every timestamp + "now" before layout; the clock's relayout is 10-5's. All y from VerticalLayout, so 10-13's gap variant reuses it. Not copied: prototype defect 3 (child older than parent). FREE DAY AXIS (Ralph's request 2026-09-26 while reviewing the spike viewer, built there the same day; item 9, if Free ships): the same sticky gutter in Free, one label per local day: "Today", "Yesterday", "Sep 24". The day is the local day of the CLAMPED time T (SPEC 4.2 free step 2), never the raw ts (raw ts put 418 of 2,951 labels out of order on synth-100k); it comes from the layout (4-11 OQ 9: free day buckets proposed, else sorted (row, day) pairs), never computed in the view. Label centred on the day's TOP card, dotted guide mid-gap above it, labels < 22 px apart pushed down; the day at the viewport top stays PINNED until the next label pushes it out (not in the design); free never relayouts on a tick: passing midnight re-formats the labels (a repaint), a new UTC offset is a relayout. Open: clock policy (freeze "now" per reload vs re-bucket -> rows move), "Today" for >12h today, locale (Ralph's request was written in German; the viewer's Intl gives ?lang=de, in Flutter DateFormat.MMMd + 2 ARB strings; applies to Time too), gutter semantics, Free axis details (pin, top vs bottom card, a year for other years, a clamped child's own date inside its parent's day), DST-exact days (SPEC 11.3), committer vs author timestamp. Depends on 10-1; real buckets via 10-12 (4-10/4-11). DECIDED 2026-09-27 (Ralph): Free is the DEFAULT and Time is dropped -> the gutter is Free's day axis (no longer conditional); Time's bucket pill/guide placement, the age ladder and the re-bucketing are no longer built (the pill/guide styles stay for Free); kept as INTENDED DEVIATIONS from the design: content fading under the gutter (the design's Time gutter gradient GC:57, now in Free) and the PINNED current day; labels stay localisable with an English default for now (English-only vs translated app = open, deferred-work); (b) moot, (a) only formats Today/Yesterday, (g) now for Free. See epics.md Story 10.2. DESIGN UPDATE 2026-10-14 (export e74ced3): retitled "Canvas and Free's day axis"; decision (a2) supersedes the dot grid, the 88 px gutter with its fade (deviation (b)) and the pinned current day (deviation (c)). The canvas is the window-fixed --canvas behind the viewport; each day's label sits on the dashed divider below the day's oldest commit (the oldest day's below its first commit), >= 22 px apart pushed up, horizontally sticky right of the rail/pinned panel, a year outside the current year, placed from the engine's day buckets (GL:586-603). The minimap's pill (10-16) names the day at the viewport centre; (e) answered, (a)/(d) Claude's proposals, (f)/(g) engine questions. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The day axis's sticky label column follows 10-5's live left inset: 76 with no pinned panel or a collapsed one, else 76 + the panel's effective width (240-440, default 300) + 12 (decisions 16.22, 16.23).
  10-3-commit-cards: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. Slotted RenderBox card (splash_card_render.dart pattern), fixed W x H, ellipsis. Detailed H 62: subject 13/500; meta line @ badge (gold, wc only), id (◆ if immutable non-root, 2 bold + dim rest to 8 chars, 5 on @), author FIRST name, relative committer date (minute tick, 0 builds), italic "empty", amber conflict, merge glyph (parentCountOf >= 2, Missing parents included, GD:56 -- not the layout edge count). Compact H 40: one line. States per GC:72-94: hover, selected (accent + 3 px ring), working copy (gold border/tint/rings/glow; + selected = blue outer ring, no drop glow, GC:76), immutable (muted subject), root (mono; no bookmark control/"..."/bottom "+", keeps top "+"); DIM (.4) is painted by the viewport from 10-6's focus set. Bookmark control on the TOP border: button mode or legend pill (Always|On hover option) showing shortBookmark(first): JIRA key bold / prefix + bold last segment, @remote, +N, order prefix-main-@remote-rest-+N (GV:326-330); bookmarks arrive as the app-side GraphRef view fact, never a wire type. "..." always visible bottom-right; "+" chips (jj new / jj new --insert-before) only on hover; child box = card + overhang (>= 11 px top and bottom, >= 13 px + shadow at the bottom if 10-15's fan is drawn in-card, GC:142), but ONLY the card rect + affordance slots hit (the empty margin reaches the canvas pan / edges, as GV:564); HOVER IS PAINT-ONLY (RenderBox listens + markNeedsPaint: 0 builds); selection via per-key Listenables (select A then B = 2 builds); W 160-400 step 10 default 240 + Detailed default on = pixel remap + anchor. Not copied: dimming on empty CHANGE (defect 14), legend covering rightward branch-off exits (defect 8), no-op `hov` class. Open: placeholder vs empty-change style, legend placement, fixed 2 bold vs CLI shortest prefix, author fallback, undesigned states (divergent/hidden/conflicted+unsynced bookmarks/other workspaces/pending), tags, lead bookmark, relative-date format (GD pre-formats now/40m/1h/20h/1d/3d/Sep 19 with no rule). Depends on 10-1. 2026-09-27: defect 8 (the legend over rightward branch-off exits) disappears with 10-4's top-centre exit -> open (b) answered by moving the exit point. 2026-09-28 (design update): "..." and the EMPTY bookmark button appear ONLY ON HOVER (GC:135-136 @a399daf; filled buttons + legend pills stay visible), hit only while hovered; the card's tooltip is gone (its text = 10-6's callout hint line); glyphs from the export's icons/ui (8 SVGs missing in app/assets/icons/svg -> copy + map; Ralph's icon font); the stack card is 10-17. 2026-09-30 (for 10-20, a constraint only): the card can paint without its border; content opacity and a text-line offset are per-key paint parameters (paint-only); 10-20 traces the outline itself. See epics.md Story 10.3. DESIGN UPDATE 2026-10-14 (export e74ced3): the fan and the '+' chips are retired: the card keeps its bookmark control and a hover-only ••• that opens 10-15's card menu (a right-click opens it too; the root's menu offers only New change on top). Selection is moon (--accent border + 3 px --accent-ring; @ + selected = 1 px co-deep + 4 px moon ring), and every card token comes from the design system. The legend pill stays ≤ W/2 − 34 px, painted above router B's right-side exits; the Bookmark labels option goes; design question (a) is answered by the DS (the dim italic is keyed on an empty description); the 2026-09-30 tracing paint parameters are superseded by 10-20's FLIP model. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Icons come from the SVG IconRegistry (decision 16.32), the change id renders as jj renders it (bold shortest unique prefix, decision 16.35), other workspaces get name@ slots with a yield order (16.28), and 'moon' now means the accent role (16.43); no hover in an inactive window.
  10-4-graph-edges-rounded-routes: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph) as 10-4-graph-lines-edges-elbows; renamed in the 2026-09-26 re-plan because the per-row lane-line model + colorIdx colour pass are OBSOLETE (research section 5's colour pitfall is moot). One orthogonal polyline per parent edge, shape from the layout source (4-11 = the spike's route/blocked): straight (same column), merge (up the parent's column to 0.4 gapY BELOW the child, across, up), branch-off (out of the parent's top at +-0.28 W, up to 0.4 gapY ABOVE the parent, across, up; siblings share the bus); corners r=10 clamped; 1.5 px --edge; indirect dashed 3 5. Crossing hops (Bridge gap default | Plain): 12x10 gap cut into the HORIZONTAL at strict-interior crossings, computed PER VISIBLE WINDOW against a whole-layout index of vertical runs (no O(E^2) all-pairs). Elided marker: dashed 38 px stub + "~ N elided" label (gold on @'s lineage), bottomExtra 44; Missing edges come from 4-10's topology, N (if kept) from a follow-up count call (the layout outputs neither, SPEC section 0/3). @ lineage = ALL ancestors of @ (bitset per layout), gold 2.25 px + glow, painted last; hover/dim from 10-6 (hov --edge-hov, dim .28 fading 160 ms). Virtualized (research section 5): interval index over edge y-extents, horizontal culling, one Path per style, all y from VerticalLayout (engine free mode + 10-13's gaps work unchanged); point -> SET of edges lookup for 10-6/10-10; edge identity = index (defect 6). Route invariant (no segment behind a non-endpoint card, no collinear overlap except shared buses) added to 10-1's checker as a COUNTED REPORT, not a gate: the spike keeps blocked-merge routing (defect 2, D9, open SPEC 11.4; e.g. 229 blocked merges on synth-10k compact/greedy) and free-mode buses may pass behind cards (D8) -> counted per kind/mode for 10-13, fails only hand-built unit cases; a gate for the row modes once 4-11 fixes D9. Open: "~ N elided" vs jj's bare "~" (+ ui.log-synthetic-elided-nodes), stub hidden under the node's own incoming edge (defect 7), edge hover, bridge crossings between edges that share a node? (prototype skips them GV:87; the spike's optimiser counts them). Depends on 10-1. CHANGED 2026-09-27 (Ralph, an intended deviation; recorded only, the spike viewer keeps the side exit): every edge leaves the parent's top at the CENTRE, branch-offs included ([(pcx,outY),(pcx,hy),(ncx,hy),(ncx,inY)]; edges already entered the child at the centre and straight/merge already left at the centre, only branch-offs left at pcx +-0.28 W) -> a branch-off shares the exit stub with the parent's continuation (a T-junction at the bus height; no hop there, it is an endpoint), both sides share the stub, the route report (item 10, widened) exempts overlaps of edges sharing a node incl. the stub, D9's vertical is unchanged, defect 8 disappears; route classes and layout outputs unchanged. DECIDED 2026-09-27: crossing hops ALWAYS ON -- no Plain, no Crossings option (an intended deviation). 2026-09-30 (design update, e243dd2): item 5 (the elided marker) MOVES TO 10-19, which answers (a) no counts, (b) the stub on the design's side slots under the 24 px rule, (c) dashed edges/markers/stubs are hover targets with a callout; this story keeps the dashed style and the hit lookup (it serves 10-19's hover bands); the non-goal "a legend" is lifted (10-19); 10-19 cuts 8x12 px under each // as split subpaths; build the run indexes (verticals + horizontals, bends, junctions) so that 10-19 can use them; for 10-20 (a constraint only): partial strokes from the parent end by length, a cross-layout edge identity (child key, parent key), the lineage style switchable without a new layout. See epics.md Story 10.4. DESIGN UPDATE 2026-10-14 (export e74ced3): retitled; decision (a1) (router B) supersedes items 1 and 3 and product decision 5 / deviation (d): the painter strokes 4-15's polylines (own exits/entries, tracks, gutter routes, Free detours), bridges follow 4-15's clearance rule (12x10 in the horizontal, else 10x12 in the vertical), and design question (d) follows the export (no bridge between edges that share a node; Claude's proposal). The route report becomes a gate in Compact (lane-blocked lines take gutters) and stays counted in Free; tokens from the design system (components/graph/graph.css:60-65). Depends on 4-15 too.
  10-5-graph-view-model-repo-wiring: backlog  # [UI/bridge] added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. GraphViewModel = @inject ChangeNotifier + ViewModelFactory init: (handle at init). Declares the view's PORTS: GraphSource = layout(GraphRequest) (recorded until 10-12) + the handle's events + logDefaults (real adapters here), and GraphActions (run a verb; fake here, real in 10-9, so 10-6's double-click and 10-8's action row need not wait). Exports RepoHandle/OpenedRepoHandle/LogDefaults/ZanshinFfiException/Precondition. GraphRequest = revset (the "jj log" preset = EFFECTIVE revsets.log from logDefaults().log, or all()), layout mode (Compact|Time, + Free if 10-13 exposes it), lane order (engine knob), prioritize/shortPrefixes/anchors passed explicitly (syntheticElided no longer sent: 4-10's topology has no synthetic nodes; its meaning stays 10-4 (a)); greedy first, then optimized above ~50k many-lane nodes (4-11; the greedy result is shown until the optimized one replaces it, not dropped as stale); utcOffsetMin alongside now, "now" for Time (the offset also for Free's day buckets if 4-11 OQ 9 is accepted; Free sends no "now"); no W/H (layout is W-independent). Reload on OpHeadsChangedEvent + own mutations, coalesced 1+1, latest wins, stale dropped; own-snapshot op converges; a Time re-bucket (10-2's clock policy) = a new request with a new "now" + anchored relayout. ANCHOR on swap: node key + viewport offset on both axes (a new head shifts every row one pitch; lane order can move columns). Re-centre on @ at first layout (instant) and after a revset/layout switch IN THE SAME relayout, REPLACING the anchor there; width/detail changes never jump. ONE SCROLL PRECEDENCE for 10-1/10-7/10-8/10-14: explicit reveal (bookmark pick, locate @, go-to-change) > @ re-centre on a switch > anchor (fallback when the key is absent; the rule for reloads, card size, side panels unless 10-8 (e) keeps the raw offset); a reveal is consumed once, never re-armed (prototype defect 1: late re-centre, jump on first relayout, scroll to OLD @ after dbl-click edit, jump to @ after a bookmark pick -- all from re-arming at GV:538). Selection keyed; null when abandoned OR filtered out by the revset (defect 9). File-edit refresh policy = Ralph; WatchErrorEvent -> degraded. States loading/empty/revset error (keep last)/errors+retry; warnings + lastPrecondition exposed; counter shown = nodes, total = |all()| (null until 10-12); owns the cards' minute tick. Open: anchor node choice (recommend selected-if-visible else centre node), vanished-anchor fallback, refresh policy, state looks, warnings surface, follow @ on external ops. Witnesses on fake ports + one real-cdylib event->request test. Depends on 10-1. 2026-09-27: GraphRequest mode = Free (DEFAULT) | Compact, lane order = compact (DEFAULT) | greedy; optimized and the greedy-then-optimized pair are gone (greedy first + a compact swap-in for big repos = 4-11 OQ 8); no request carries "now" (Time dropped). 2026-09-28 (design update): GraphRequest gains the stack state (stacks flag, user expandedKeys/collapsedKeys persisted per repo by 10-17, keepOpenKeys = selection + a pending go-to-change target); a toggle = a new request ANCHORED on the toggled stack, never a re-centre; a run holding the selection stays open until the user collapses it (then the selection clears); shown = the revset's commit count incl. collapsed members. 2026-09-30 (design update): 10-19's "Show in all()" = a revset switch to all() with an explicit reveal (rank 1) resolved on the new layout, plus keepOpenKeys = the child's real parents that the old revset hid (from show), so the hidden parent's stack opens in the same relayout; the view model derives the flash set from the new layout and the old keys; the legend's "Show all()" is a plain switch (re-centres @). For 10-20 (a constraint only): a reload with a new operation and a stack toggle hand the view the previous and the new layout plus the anchor; the previous one stays alive until the transition ends. See epics.md Story 10.5. DESIGN UPDATE 2026-10-14 (export e74ced3): the graph fills the window and the chrome floats over it, so panels cover margins instead of resizing the viewport: new item 14 = GraphInsets from 11-3 (top 68, left 76 | 388 pinned, right/bottom 12, inspector 472, minimap 146; every centring targets the visible rect, the extents include the insets, pin/unpin shifts the offset by the inset delta so no card moves, the inspector scrolls only a covered selection, the day labels follow the left inset, @'s direction is published for 10-6's pill); item 15 = the calm signal for 11-3 (user scroll only, > 30 px, off 650 ms / 420 ms after a pan, blocked during drags and open menus, the inspector pin decided at phase start, gated by Hide controls); item 16 = an 'effective config changed' input for 11-7's writes via 9-28 (re-read logDefaults, re-request under the anchor). GraphRequest.revset now comes from 10-21's view state (any expression), 10-21 shows the revset error, and the shown view persists per repository (decision (g)). The scroll-precedence clause about side panels no longer covers the floating panels. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): A stale working copy is a project-level state instead of the retry error (decision 16.28; the StaleNotice names jj workspace update-stale until 9-23 lands), GraphInsets follow the resizable and collapsible panel and inspector live (16.22, 16.23), the top inset is 60, the chrome API gains scroll-to-selection ⌘J and scroll-to-@ ⇧⌘J (16.18), and our workspace name goes on the wire.
  10-6-selection-hover-keyboard: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. Controllers GraphSelection/GraphHover (Listenables, per key, no setState, no per-build closures). FINAL from the design: click selects + opens the panel AFTER the double-click window (prototype 220 ms), no scroll; double-click on a MUTABLE card = jj edit via 10-5's GraphActions port (fake until 10-9; no confirm); hover focus path (default on) = hovered + all ancestors + all descendants, others painted at .4 by the viewport (hover = 0 card builds), edges .28; Esc leaves describe mode first, then clears the selection -- scoped to the graph's focus (the prototype's Esc is a window keydown listener GV:541-548, so the Esc closing the Projects dialog APP:2034 also clears the graph selection: defect 11); "@ Working copy" = reveal(@, centre, animated), an explicit reveal in 10-5's precedence; tooltip texts "Click: details · Double-click: jj edit" / "Working copy (@)". Empty-canvas press = 10-1's pan (the prototype never clears the selection there, GV:563-569 -- a behaviour to decide, not a defect). Focus-set cost measured at 100k. GO-TO-CHANGE MECHANICS (item 11; the spike viewer, 2026-09-26): RECOMMENDED an instant jump = reveal(key, centre, animate: false) = jumpTo on both axes; animate or not + select or not = (d) (the viewer: instant, centred vertically, horizontal scroll only as far as needed to clear the gutter, selects + pulses 3x); 10-1's reveal takes ONE alignment for both axes -> a per-axis alignment or centre both; an explicit reveal in 10-5's precedence. The frame after a jump is a pure function of the offset (binary search for the first card, only the visible cards built) -> viewer, 200 random jumps on the real 1.4k repo AND synth-100k (up to 5.4 M px): on screen in the first frame after the key, frame work median 3.8/3.4, p95 6.7/5.7, max 7.4/7.0 ms (real/synth; a later rerun median 3.95-4.3, p95 6.5-7.1, max 8.1-10.8) vs idle 0.5-0.7 ms, a median of 8-13 cards created (max 18), |r(distance, work)| <= 0.08; an animated scroll would build ~2,000 viewports over 1.6 M px. Budget: at most the visible cards + cache extent built, within one frame at 100k. Target: a full id via 4-12's lookups (a named consumer); a prefix/bookmark/revset/description = a backend path resolved as the CLI does (ambiguous prefix refused; deferred-work). Witness: a far jump on a 100k recording builds no card in between; work recorded at 3 distances (not gated). NOT designed: keyboard navigation for a layout with several cards per row, go-to-change, context menu (design uses quick actions + popover), multi-select. Open: immutable double-click (nothing vs CLI refusal), empty-canvas click clears selection?, key map, go-to-change affordance (candidate: the viewer's ⌘F box -- change/commit-id prefix else description substring, <= 50 hits + total, Enter/Shift+Enter walk, Esc keeps the query; open: instant vs animated (and locate @ over long distances), select or only reveal, jj prefix semantics, revset input, hits outside the revset, where a description search runs), context menu, multi-select, @ shortcut. Depends on 10-1, 10-3, 10-4 (10-5 for reload survival + the port, 10-9 for the real edit). See epics.md Story 10.6. DECIDED 2026-09-27 (Ralph): the spike viewer's found-commit PULSE ships (item 12): after a go-to-change the target card pulses 3 x 650 ms ease-out -- a #3B82F6 ring growing 2 -> 22 px while fading 80 % -> 0 %, the card raised above all others, painted in the overlay layer; restart on a repeated jump; paint-only (one ticker, 0 other card builds); reduce motion -> no pulse, just the selection ring (recommended). Intended deviation (e) from the design. Scope decided 2026-09-27 (Ralph): go-to-change only for now -- locate @, bookmark pick and minimap click do not pulse; other use cases can add it later. 2026-09-28 (design update): item 7's tooltips become the COMMIT CALLOUT (GV:461-484 @a399daf: full subject, full description from 4-10, change id + commit id, full author, date, hint "Click: details · Double-click: jj edit" / on @ "Working copy (@) · Click for details" / none on the root; NO stats row), after 450 ms beside the card; ONE hover-callout controller for it, 10-17's stack popover (380 ms) + row callouts (180 ms) and 10-15's bookmark popover (no delay): hoverable + nested, the gap bridged, closes when the pointer leaves the chain, stays closed over bookmark control/"..."/"+", flips to stay inside the canvas (above cards + gutter), card-anchored widgets with the card pinned, 0 card builds on hover, none while panning/dragging; VoiceOver gets the description as the card's hint (proposal accepted); the focus path passes through stacks. 2026-09-30 (design update): the hover-callout controller also serves 10-19's GAP CALLOUT (targets: a 12 px band along each dashed edge via 10-4's hit lookup, a marker's box, an end stub; opens after 380 ms, closes 180 ms after the pointer leaves); 10-19's flash after "Show in all()" runs on item 12's ticker and overlay (a 2.4 s accent ring, static under reduce motion). DESIGN UPDATE 2026-10-14 (export e74ced3): the @ 'Working copy' pill moves here from 10-7: it shows only while @ is wholly outside the unobscured area and no toast is up, points toward @, and reveals @ centred in the unobscured area. Go-to-change is 10-21's Go to (it selects; all() fallback; keepOpenKeys), so (d) and (e) are answered (the card menu is 10-15's). Reveals are smooth within about 3 viewports and instant beyond; the keyboard is one roving focus node with the design's ring and Enter/Space; the focus path is always on with a 140 ms hover intent; the selected card scrolls clear of the inspector; the pulse stays in moon and also fires for 10-21's Bookmark go-tos and recents, not for 10-14's pick. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): ⌘J, ⇧⌘J and the @-pill click only scroll, the selection stays (decision 16.18); the pulse and the flash follow reduce motion by property (16.4: the ring fades at a fixed size); the callout takes the one menu material; 'moon' = the accent role (16.43); ⌘Z belongs to 11-13.
  10-7-graph-toolbar: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design (the old free-text revset field + Apply/Save to revsets.log is NOT in the design). 46 px bar: revset select = "$" button + 320 px listbox with exactly two presets, "jj log" (the EFFECTIVE revsets.log via logDefaults, re-read while selected; never a baked builtin_log()) and "jj log -r 'all()'", with the design's descriptions; Layout segmented Compact ("Rows = dependency depth") | Time ("Rows = rounded commit time"), default Compact, switch re-centres @, a Free segment only if 10-13 decides so; switch labelled "Detailed cards"/"Compact cards" (default on); Card width range 160-400 step 10 with "240px" readout (default 240); right: "{shown} / {total} commits" (total = |all()|) + "@ Working copy". Prefs app-global in zanshin_settings (GV:504-507). material_ui controls. Thin: the dropdown is a popup, not final. Open: two presets final or free text + Apply/Save (9-25 / 9-28 configSet) back, default tracking, revset error surface (design has none), counter before total is known, advanced params (prioritize/short-prefixes/anchors; synthetic-elided is no longer sent), which tweaks become settings (Bookmark labels, Lane order, Crossings, Hover focus), shortcuts, Free segment. Depends on 10-2, 10-3, 10-5, 10-6. DECIDED 2026-09-27 (Ralph): Layout = Free (DEFAULT; the design's default is Compact, GV:507) | Compact, Time dropped; Free's label/hint and the segment order are open; Crossings is no longer an option (always on); Lane order = compact (default) | greedy, its label open ("Compact" collides with the Compact layout). 2026-09-28: a "Group stacks" switch (GV:336-339 @a399daf; default on, app-global like Detailed) -> 10-5's stacks flag, anchored relayout, never re-centres @. 2026-09-30: 10-19's gap legend (a chip "N gaps" with its popover) sits right after the revset select (GV:366 @e243dd2); this story leaves room for it, 10-19 builds it. See epics.md Sto