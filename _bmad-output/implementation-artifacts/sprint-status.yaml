  10-11-content-paging-after-4-10: backlog  # [UI] added 2026-09-26 (Ralph), re-authored 2026-09-26. The view side of 4-10's topology/content split, built against the port with FAKE latency (real call via 10-12, which also exports 4-10's types). content(opId, commitIds) for the visible nodes +- a buffer once the viewport settles (not while flinging/panning); cached by COMMIT id across reloads (view facts come with geometry); stale pages dropped under 10-5's coalescing; skeleton cards until content arrives with NO geometry change. Time/free modes: timestamps are LAYOUT input, never paged content (4-10 carries them on request); card dates use the geometry timestamp when present. Also serves 10-14's hidden-target subjects. Open: skeleton look (not in the design), buffer size. Depends on 10-3, 10-5. 2026-09-28: a visible stack card loads all its members' content (authors, dates, conflicts; 10-17); the stack popover loads rows as they scroll in; 10-6's commit callout reads the same cache (full description from 4-10). See epics.md Story 10.11. DESIGN UPDATE 2026-10-14 (export e74ced3): still no skeleton design. New cache readers: the card menu's header, the drag ghost and the inspector, each showing the id until content arrives. 10-21's subject and description search needs its own backend path, not the visible-range cache. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The DS now has a skeleton: 11-11's Skeleton, shown only after --delay-skeleton 150, pulsing under reduce motion (decision 16.4); this supersedes 'still no skeleton design' above.
