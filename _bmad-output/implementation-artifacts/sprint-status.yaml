e CLI's defaults and no confirmation, design question (b) and the non-goal 'pushing single bookmarks'; Fetch has no shortcut (16.42 m); both buttons are Zs controls. Depends on 9-20, 11-11, 11-13. NOTE 2026-10-21 (Ralph, after the story loop 9.24/9.30/9.31; epics.md 11.8 dated note): witness RepoHandle.remoteChanges('origin') once in the running app (Marionette), since dart test reaps the git child; the timed poll gets NO special auth handling (1Password/credential dialogs may appear, as in SourceTree) -- an unconfirmed tick fails quietly, no toast, next tick retries, ticks never overlap. DESIGN UPDATE 2026-10-26 (console session, DS #10): the Push sheet's change row with exactly one allowable reason shows a short 'Allow' at the end of its label line and the reason right under it ('Refused — <id> has no description' -> 'Allowed — … · pushed with --allow-empty-description', the flag joins the command once ticked); several reasons keep the chip row; the name field stays below.
