  10-5-graph-view-model-repo-wiring: done  # DONE 2026-10-30 (spec-10-5-graph-view-model-repo-wiring, commit 5d5548c): ports + GraphViewModel + GraphCanvas/GraphView + StaleNotice + RepoGraphSource on fake/recorded layouts; real-repo host and workspace name -> 10-12; @ direction -> 10-6; inspector scroll -> 10-8; toasts -> 10-23; design question (c) stays Ralph's. [UI/bridge] added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. GraphViewModel = @inject ChangeNotifier + ViewModelFactory init: (handle at init). Declares the view's PORTS: GraphSource = layout(GraphRequest) (recorded until 10-12) + the handle's events + logDefaults (real adapters here), and GraphActions (run a verb; fake here, real in 10-9, so 10-6's double-click and 10-8's action row need not wait). Exports RepoHandle/OpenedRepoHandle/LogDefaults/ZanshinFfiException/Precondition. GraphRequest = revset (the "jj log" preset = EFFECTIVE revsets.log from logDefaults().log, or all()), layout mode (Compact|Time, + Free if 10-13 exposes it), lane order (engine knob), prioritize/shortPrefixes/anchors passed explicitly (syntheticElided no longer sent: 4-10's topology has no synthetic nodes; its meaning stays 10-4 (a)); greedy first, then optimized above ~50k many-lane nodes (4-11; the greedy result is shown until the optimized one replaces it, not dropped as stale); utcOffsetMin alongside now, "now" for Time (the offset also for Free's day buckets if 4-11 OQ 9 is accepted; Free sends no "now"); no W/H (layout is W-independent). Reload on OpHeadsChangedEvent + own mutations, coalesced 1+1, latest wins, stale dropped; own-snapshot op converges; a Time re-bucket (10-2's clock policy) = a new request with a new "now" + anchored relayout. ANCHOR on swap: node key + viewport offset on both axes (a new head shifts every row one pitch; lane order can move columns). Re-centre on @ at first layout (instant) and after a revset/layout switch IN THE SAME relayout, REPLACING the anchor there; width/detail changes never jump. ONE SCROLL PRECEDENCE for 10-1/10-7/10-8/10-14: explicit reveal (bookmark pick, locate @, go-to-change) > @ re-centre on a switch > anchor (fallback when the key is absent; the rule for reloads, card size, side panels unless 10-8 (e) keeps the raw offset); a reveal is consumed once, never re-armed (prototype defect 1: late re-centre, jump on first relayout, scroll to OLD @ after dbl-click edit, jump to @ after a bookmark pick -- all from re-arming at GV:538). Selection keyed; null when abandoned OR filtered out by the revset (defect 9). File-edit refresh policy = Ralph; WatchErrorEvent -> degraded. States loading/empty/revset error (keep last)/errors+retry; warnings + lastPrecondition exposed; counter shown = nodes, total = |all()| (null until 10-12); owns the cards' minute tick. Open: anchor node choice (recommend selected-if-visible else centre node), vanished-anchor fallback, refresh policy, state looks, warnings surface, follow @ on external ops. Witnesses on fake ports + one real-cdylib event->request test. Depends on 10-1. 2026-09-27: GraphRequest mode = Free (DEFAULT) | Compact, lane order = compact (DEFAULT) | greedy; optimized and the greedy-then-optimized pair are gone (greedy first + a compact swap-in for big repos = 4-11 OQ 8); no request carries "now" (Time dropped). 2026-09-28 (design update): GraphRequest gains the stack state (stacks flag, user expandedKeys/collapsedKeys persisted per repo by 10-17, keepOpenKeys = selection + a pending go-to-change target); a toggle = a new request ANCHORED on the toggled stack, never a re-centre; a run holding the selection stays open until the user collapses it (then the selection clears); shown = the revset's commit count incl. collapsed members. 2026-09-30 (design update): 10-19's "Show in all()" = a revset switch to all() with an explicit reveal (rank 1) resolved on the new layout, plus keepOpenKeys = the child's real parents that the old revset hid (from show), so the hidden parent's stack opens in the same relayout; the view model derives the flash set from the new layout and the old keys; the legend's "Show all()" is a plain switch (re-centres @). For 10-20 (a constraint only): a reload with a new operation and a stack toggle hand the view the previous and the new layout plus the anchor; the previous one stays alive until the transition ends. See epics.md Story 10.5. DESIGN UPDATE 2026-10-14 (export e74ced3): the graph fills the window and the chrome floats over it, so panels cover margins instead of resizing the viewport: new item 14 = GraphInsets from 11-3 (top 68, left 76 | 388 pinned, right/bottom 12, inspector 472, minimap 146; every centring targets the visible rect, the extents include the insets, pin/unpin shifts the offset by the inset delta so no card moves, the inspector scrolls only a covered selection, the day labels follow the left inset, @'s direction is published for 10-6's pill); item 15 = the calm signal for 11-3 (user scroll only, > 30 px, off 650 ms / 420 ms after a pan, blocked during drags and open menus, the inspector pin decided at phase start, gated by Hide controls); item 16 = an 'effective config changed' input for 11-7's writes via 9-28 (re-read logDefaults, re-request under the anchor). GraphRequest.revset now comes from 10-21's view state (any expression), 10-21 shows the revset error, and the shown view persists per repository (decision (g)). The scroll-precedence clause about side panels no longer covers the floating panels. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): A stale working copy is a project-level state instead of the retry error (decision 16.28; the StaleNotice names jj workspace update-stale until 9-23 lands), GraphInsets follow the resizable and collapsible panel and inspector live (16.22, 16.23), the top inset is 60, the chrome API gains scroll-to-selection ⌘J and scroll-to-@ ⇧⌘J (16.18), and our workspace name goes on the wire.
  10-6-selection-hover-keyboard: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. Controllers GraphSelection/GraphHover (Listenables, per key, no setState, no per-build closures). FINAL from the design: click selects + opens the panel AFTER the double-click window (prototype 220 ms), no scroll; double-click on a MUTABLE card = jj edit via 10-5's GraphActions port (fake until 10-9; no confirm); hover focus path (default on) = hovered + all ancestors + all descendants, others painted at .4 by the viewport (hover = 0 card builds), edges .28; Esc leaves describe mode first, then clears the selection -- scoped to the graph's focus (the prototype's Esc is a window keydown listener GV:541-548, so the Esc closing the Projects dialog APP:2034 also clears the graph selection: defect 11); "@ Working copy" = reveal(@, centre, animated), an explicit reveal in 10-5's precedence; tooltip texts "Click: details · Double-click: jj edit" / "Working copy (@)". Empty-canvas press = 10-1's pan (the prototype never clears the selection there, GV:563-569 -- a behaviour to decide, not a defect). Focus-set cost measured at 100k. GO-TO-CHANGE MECHANICS (item 11; the spike viewer, 2026-09-26): RECOMMENDED an instant jump = reveal(key, centre, animate: false) = jumpTo on both axes; animate or not + select or not = (d) (the viewer: instant, centred vertically, horizontal scroll only as far as needed to clear the gutter, selects + pulses 3x); 10-1's reveal takes ONE alignment for both axes -> a per-axis alignment or centre both; an explicit reveal in 10-5's precedence. The frame after a jump is a pure function of the offset (binary search for the first card, only the visible cards built) -> viewer, 200 random jumps on the real 1.4k repo AND synth-100k (up to 5.4 M px): on screen in the first frame after the key, frame work median 3.8/3.4, p95 6.7/5.7, max 7.4/7.0 ms (real/synth; a later rerun median 3.95-4.3, p95 6.5-7.1, max 8.1-10.8) vs idle 0.5-0.7 ms, a median of 8-13 cards created (max 18), |r(distance, work)| <= 0.08; an animated scroll would build ~2,000 viewports over 1.6 M px. Budget: at most the visible cards + cache extent built, within one frame at 100k. Target: a full id via 4-12's lookups (a named consumer); a prefix/bookmark/revset/description = a backend path resolved as the CLI does (ambiguous prefix refused; deferred-work). Witness: a far jump on a 100k recording builds no card in between; work recorded at 3 distances (not gated). NOT designed: keyboard navigation for a layout with several cards per row, go-to-change, context menu (design uses quick actions + popover), multi-select. Open: immutable double-click (nothing vs CLI refusal), empty-canvas click clears selection?, key map, go-to-change affordance (candidate: the viewer's ⌘F box -- change/commit-id prefix else description substring, <= 50 hits + total, Enter/Shift+Enter walk, Esc keeps the query; open: instant vs animated (and locate @ over long distances), select or only reveal, jj prefix semantics, revset input, hits outside the revset, where a description search runs), context menu, multi-select, @ shortcut. Depends on 10-1, 10-3, 10-4 (10-5 for reload survival + the port, 10-9 for the real edit). See epics.md Story 10.6. DECIDED 2026-09-27 (Ralph): the spike viewer's found-commit PULSE ships (item 12): after a go-to-change the target card pulses 3 x 650 ms ease-out -- a #3B82F6 ring growing 2 -> 22 px while fading 80 % -> 0 %, the card raised above all others, painted in the overlay layer; restart on a repeated jump; paint-only (one ticker, 0 other card builds); reduce motion -> no pulse, just the selection ring (recommended). Intended deviation (e) from the design. Scope decided 2026-09-27 (Ralph): go-to-change only for now -- locate @, bookmark pick and minimap click do not pulse; other use cases can add it later. 2026-09-28 (design update): item 7's tooltips become the COMMIT CALLOUT (GV:461-484 @a399daf: full subject, full description from 4-10, change id + commit id, full author, date, hint "Click: details · Double-click: jj edit" / on @ "Working copy (@) · Click for details" / none on the root; NO stats row), after 450 ms beside the card; ONE hover-callout controller for it, 10-17's stack popover (380 ms) + row callouts (180 ms) and 10-15's bookmark popover (no delay): hoverable + nested, the gap bridged, closes when the pointer leaves the chain, stays closed over bookmark control/"..."/"+", flips to stay inside the canvas (above cards + gutter), card-anchored widgets with the card pinned, 0 card builds on hover, none while panning/dragging; VoiceOver gets the description as the card's hint (proposal accepted); the focus path passes through stacks. 2026-09-30 (design update): the hover-callout controller also serves 10-19's GAP CALLOUT (targets: a 12 px band along each dashed edge via 10-4's hit lookup, a marker's box, an end stub; opens after 380 ms, closes 180 ms after the pointer leaves); 10-19's flash after "Show in all()" runs on item 12's ticker and overlay (a 2.4 s accent ring, static under reduce motion). DESIGN UPDATE 2026-10-14 (export e74ced3): the @ 'Working copy' pill moves here from 10-7: it shows only while @ is wholly outside the unobscured area and no toast is up, points toward @, and reveals @ centred in the unobscured area. Go-to-change is 10-21's Go to (it selects; all() fallback; keepOpenKeys), so (d) and (e) are answered (the card menu is 10-15's). Reveals are smooth within about 3 viewports and instant beyond; the keyboard is one roving focus node with the design's ring and Enter/Space; the focus path is always on with a 140 ms hover intent; the selected card scrolls clear of the inspector; the pulse stays in moon and also fires for 10-21's Bookmark go-tos and recents, not for 10-14's pick. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): ⌘J, ⇧⌘J and the @-pill click only scroll, the selection stays (decision 16.18); the pulse and the flash follow reduce motion by property (16.4: the ring fades at a fixed size); the callout takes the one menu material; 'moon' = the accent role (16.43); ⌘Z belongs to 11-13. DESIGN UPDATE 2026-10-26 (console session, DS #12/#13): the peek of an immutable non-root change gets an eyebrow (HatchSwatch + IMMUTABLE + the reason); the reason comes from one revsetCounts call (cap 1) per term of immutable_heads() in 11-7's order, '<id> & (term)' = head, '<id> & ::(term)' = 'below …', first hit wins, cached per commit+op and reused by 10-8/10-15 (Claude's proposal); the hint drops 'Double-click: jj edit' on immutable changes.
  10-7-graph-toolbar: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design (the old free-text revset field + Apply/Save to revsets.log is NOT in the design). 46 px bar: revset select = "$" button + 320 px listbox with exactly two presets, "jj log" (the EFFECTIVE revsets.log via logDefaults, re-read while selected; never a baked builtin_log()) and "jj log -r 'all()'", with the design's descriptions; Layout segmented Compact ("Rows = dependency depth") | Time ("Rows = rounded commit time"), default Compact, switch re-centres @, a Free segment only if 10-13 decides so; switch labelled "Detailed cards"/"Compact cards" (default on); Card width range 160-400 step 10 with "240px" readout (default 240); right: "{shown} / {total} commits" (total = |all()|) + "@ Working copy". Prefs app-global in zanshin_settings (GV:504-507). material_ui controls. Thin: the dropdown is a popup, not final. Open: two presets final or free text + Apply/Save (9-25 / 9-28 configSet) back, default tracking, revset error surface (design has none), counter before total is known, advanced params (prioritize/short-prefixes/anchors; synthetic-elided is no longer sent), which tweaks become settings (Bookmark labels, Lane order, Crossings, Hover focus), shortcuts, Free segment. Depends on 10-2, 10-3, 10-5, 10-6. DECIDED 2026-09-27 (Ralph): Layout = Free (DEFAULT; the design's default is Compact, GV:507) | Compact, Time dropped; Free's label/hint and the segment order are open; Crossings is no longer an option (always on); Lane order = compact (default) | greedy, its label open ("Compact" collides with the Compact layout). 2026-09-28: a "Group stacks" switch (GV:336-339 @a399daf; default on, app-global like Detailed) -> 10-5's stacks flag, anchored relayout, never re-centres @. 2026-09-30: 10-19's gap legend (a chip "N gaps" with its popover) sits right after the revset select (GV:366 @e243dd2); this story leaves room for it, 10-19 builds it. See epics.md Story 10.7. DESIGN UPDATE 2026-10-14 (export e74ced3): renamed 'Graph controls in the floating top bar' -- the docked bar is gone; 11-3 hosts the View capsule (after 10-21's search: 10-19's gap legend, the count '**N** of M' / '**M** changes' hidden at <= 1040 px, the View options popover with Layout Free|Compact, Detailed cards, Group stacks, Card width and a 'Settings… ⌘,' row that opens 11-7) and places the gold New change in its ACTION slot (jj new on @ via 10-9, the card grows out of @ in 540 ms per decision (c), icon only at <= 920 px). The revset select, its witnesses and design questions (a)-(c) move to 10-21/10-22 ((a) answered: no free text, no Apply/Save, configurations replace 9-25's presets; 'jj log' stays the effective revsets.log, while the export's RC:58 bakes builtin_log()), (d)-(h) are answered (no lane-order control, decision (b)), and the @ button becomes 10-6's bottom pill. NEEDS DESIGN is dropped. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Built on 11-11's Zs controls, not Yaru (decision 16.1); 'Appearance, diffs and more' opens Settings on General with no ⌘, (16.14); New change uses the one primary recipe; the count and the gap legend hide at <= 1040 px (16.37); the shortcuts are bound in 11-13. Depends on 11-11.
  10-8-commit-detail-panel: backlog  # [UI/bridge] PLACEHOLDER + NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design: THIN by default, because the design extraction lists the detail panel (with its describe mode) among the design's dialogs/popups, which Ralph says are not final (open (a): exempt or not). Minimal material_ui right column (480 px placeholder width); data = the node's view facts + RepoHandle.show(<commit id>) (9-6; show() snapshots -> convergence witness); exports ShowEntry/Change/Signature/ConflictState/FileChange/FileChangeKind. Header: tags (@ working copy / ◆ immutable / empty / merge (parent count incl. Missing, as 10-3) / conflict), full change id (2 bold), Edit (hidden on @ + immutable), Describe (hidden on immutable + while editing), close/Esc. Subject + bookmark chips (synced/local/remote from GraphRef; "behind" reads behind once 9-29 lands -- the prototype maps it to "local"). Meta (author, date, change id, ALL parents; root shows none -- the prototype fakes "c3d4e5f"), description, a PLAIN changed-file list (status + path). NO review meter / Viewed state / auto-advance / Inline/Split / +-counts: the review workflow reviews diffs that do not exist before Epic 5 -> moved to the Epic 5 diff follow-up (deferred-work). Diff = "not available yet" until Epic 5 (5-6/5-8), NEVER a sample or Dart-side diff. Action row Edit/Squash/Abandon/Rebase... via 10-5's GraphActions port (fake until 10-9; Squash/Rebase disabled with reason until 9-15/9-16). Describe mode = 10-15's editor. Open: covered by "not final"? (thin vs exempt), row vs header (Edit twice; immutable hide vs disable), multi-parent look, committer/signature, canvas on panel open (hold anchor vs the prototype's raw offset), pre-Epic-5 look. Depends on 10-5, 10-6, 9-6 (done); 10-9 for the real actions. See epics.md Story 10.8. DESIGN UPDATE 2026-10-14 (export e74ced3): NO LONGER THIN — the floating inspector, built to the design (decision (d)), title "Inspector — floating panel, header, title-as-describe, meta, bookmark chips, action row, file list" without PLACEHOLDER: a 460 px strong-glass island over the graph (11-2/11-3; it does not shrink the canvas, scrolls the selected card clear only when covered, hides the minimap, steps aside while scrolling unless a field has focus), header = full change id with jj's unique prefix bold + flags + ×, the title is the describe field (moved from 10-15 item 4; Save = the CLI's two -m paragraphs "S\n\nD\n", nothing when unchanged; drafts kept per change), meta = author · date · every parent, chips (↓/↕ via 9-29; drag via 10-10), an action row by state (immutable/root: New change on top; @: New change · Squash into parent · Abandon; other mutable: Edit · Squash into parent · Abandon; no Rebase…; Squash enabled by 10-25), the file list from show() and the four empty states. It answers design questions (a)–(f); the diff, ± and Viewed are 10-24, the composer 10-25, hunk selection 10-26, file/hunk drags 10-27. See the 2026-10-14 note in epics.md Story 10.8. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The inspector is drag-resizable at its left edge (380-720, default 460) with the collapse rule (decisions 16.22, 16.23), sits at top 60, uses the Zs controls (16.1), shows commands in full with the change id (16.39), takes the generic exit (16.40) and handles the stale and inactive states. Depends on 11-3, 11-11. DESIGN UPDATE 2026-10-26 (console session, DS #12/#13): the Immutable flag carries HatchSwatch instead of ◆, its tooltip is 'Immutable · <reason>' (10-6's reason), not on the root.
  10-9-action-runner: backlog  # [UI/bridge] NEEDS DESIGN, added 2026-09-26 (Ralph) as 10-9-action-dialogs; renamed in the 2026-09-26 re-plan: the design has NO dialogs, it triggers verbs from double-click, panel header/row, quick-action fan, "+" chips and the bookmark popover and shows no feedback. Implements 10-5's GraphActions port = ONE runner every affordance calls. Shipped verbs: edit, describe, newChange([id]) (new on top), abandon, bookmarkCreate/Delete, undo; backlog -> affordance disabled with reason: squash 9-15, rebase 9-16, bookmark rename/move 9-19, new --insert-before/-A (NO backend story; 9-31 previews it). Offers every param the shipped verb exposes, pre-filled with CLI defaults (missing flags = deferred backend gaps). Pending state on affected cards (serial worker); anchored reload via 10-5; MutationResult + FinishFacts facts; ONE surface for CLI-worded refusals, 9-32 warnings and 9-35 precondition/warnings; Undo only while opLog head == newOpId (else dropped; real fix 9-12); abandon never confirms (CLI parity). Exports MutationResult/FinishFacts. Open: reveal new @ after new/edit, feedback surface, undo affordance, shortcuts, and once 9-15/9-16 land: Squash's combined description (the CLI's $EDITOR case; 9-15 must surface jj-lib's combined message) + Rebase...'s target picking (click a card/edge via 10-4's lookup, or 10-10). Depends on 10-3, 10-5. See epics.md Story 10.9. DESIGN UPDATE 2026-10-14 (export e74ced3): the triggers are now double-click, the top bar's New change, the card menu (10-15), the inspector's action row, title-as-describe and composer (10-8, 10-25), drops (10-10, 10-27) and the toast's Undo (10-23); new verbs are commit (9-49), split with paths or a GUI tree and -A/-B, squash -r and --from/--into (9-15), duplicate (9-9), bookmark move/rename (9-19) and new -A/-B (9-48). Answered: (a) after new the new card is revealed only if off-screen, edit reveals nothing; (b)/(c) by 10-23's toast; (e) the squash message = 10-8's Summary/Details pre-filled with 9-15's combined message when the CLI would open its editor, and Rebase's target = a drop only. Selection and anchor per verb come from MutationResult, composer refusals stay in the composer (INC:91) while other refusals use 10-23's warn variant, and every outcome hands 10-5/10-20 its op hints (anchor, flash ids, born id, drop origin). DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): ⌘Z moves to the menu bar under the three-place undo rule (decision 16.7) and every undo ends in the 'Undid <action> · Redo' toast (16.46); the runner publishes Zanshin's own latest op label for 11-13 and runs the Change menu (target = the selection, else @; 16.34); commands shown are real and complete (16.39, 16.44); a stale working copy disables every verb (16.28). DESIGN UPDATE 2026-10-26 (console session, DS #11): revert leaves the Non-goals: RepoHandle.revert(revisions:[change], insertBefore:['@']) = jj revert -r <change> -B @ (9.18), no description passed (templates.revert_description); the reverted change is the anchor, the new one is born from it, an open inspector follows to it; 'Insert after' with an immutable child the view knows is left out by 10-15, the backend refusal stays for unseen children.
  10-10-graph-drag-and-drop: backlog  # [UI] PLACEHOLDER + NEEDS DESIGN, added 2026-09-26 (Ralph; not in the design -- refine once 9-31 is scheduled). Drag-and-drop per 9-31's decided UI shape; the design's canvas drag PANS (10-1's canvas-only recognizer), which leaves card drags free. Drag a card (ghost, reverse-paint-order hit testing, source KeepAlive-pinned), auto-scroll both axes; drop ON a commit (-o T) or an EDGE T->C (-A T -B C) via 10-4's point -> edge-SET lookup (a shared bus returns several edges: design); no gap zones. drop_actions(source, location) on hover-settle: debounced, one in flight, cached per (source, location) keyed by the layout's op id (10-12) or invalidated on every OpHeadsChangedEvent; each query snapshots -> 10-5 HOLDS reloads during a drag. Drop menu Available / NoOp / Refused-with-CLI-reason; runs via 10-9 (the verb's refusal stays authoritative). Alt = duplicate, Esc cancels. Blocked on 9-31 + 9-16 (+ 9-15/9-9/9-18). Open: ghost/highlight looks, which edge a shared bus targets, menu order, interdiff drop, multi-card drags. Depends on 10-1, 10-3, 10-4, 10-6, 10-9. 2026-09-28 (Ralph: cards AND bookmarks will be draggable later): BOOKMARK DRAGS join (legend pill, button, popover rows; a drop on a card = bookmark move/set via 9-19; --allow-backwards = a visible drop-menu choice, never a hidden default) -> the "no bookmark drops" non-goal is lifted. Already required now: click/double-click/drag start separated by the slop on cards, stack cards and bookmark controls; callouts close on drag start; the focus path pauses; the dragged card pinned. New open: a stack as source (-r over the run vs -s from the oldest) and as target (newest member vs expand on hover-hold), dragging a member out of the popover, a bookmark dropped on a stack splits the run. See epics.md Story 10.10. DESIGN UPDATE 2026-10-14 (export e74ced3): no longer a placeholder: the export designs it (DND, DNC, GV:792-930), and decision (a4) supersedes items 3, 4 and 7 and 9-31's U