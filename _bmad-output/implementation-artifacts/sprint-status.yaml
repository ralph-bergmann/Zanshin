  10-44-bookmark-and-tag-views: backlog  # [UI/bridge] Added 2026-11-15 (Ralph, console session; design round done: design/Refs Study.html sections 2-5, approved by Ralph 2026-11-15 "Passt"). SCOPE: (1) a Tags button in the rail below Bookmarks, same behaviour (hover preview of 5 + "+N more", click pins the panel); new `tag` icon (DS + ZI). (2) both views (features/bookmarks/bookmark_list_view.dart + bookmark_list_model.dart; a sibling for tags) as a tree split at "/" like the inspector tree of 10.42 (folder icon open/closed, no chevron, leaf = last segment), a filter field on top for this tree only (matches highlighted, folders open), NO leading icon on leaves; leaf = name, "change id · subject", state right (✓, ↑N/↓N, deleted, conflict; local-only shows none; untracked remote dimmed + dim @origin); click/return select, dimmed outside the view, local bookmarks draggable, tags not; Bookmarks rows as today (--all-remotes, no @git), Tags rows = 9.59's list. (3) row buttons instead of today's Track/Untrack below the row (it makes the list jump): on the hovered/focused leaf, IconButtons in place of the state, row keeps its height: "New change here" (jj new <name> / <name>@origin), "Delete…" (local), Track (untracked remote) / Untrack (tracked); right-click menu with these + "Rename…" (bookmarks) + "Copy name". (4) delete dialog for every Delete of a bookmark or tag (row, row menu, card bookmark popover 10.15, tag popover 10.45): no remote -> delete at once, toast Undo; with a remote a sheet with 3 choices + their commands: "Only here — keep it on origin" (jj bookmark forget <name>; tag: jj tag untrack <name>@origin + jj tag delete <name>, jj 0.47 has no tag forget), "Here, and on origin when you push the deletion" (default; jj bookmark|tag delete; note: a plain push skips deletions, the Push sheet offers them, 11.22), "Here and on origin now" (danger; delete + jj git push --remote <r> -b|-t <name>; "Can't be undone"); several remotes named each. (5) DS: tag icon, tree r