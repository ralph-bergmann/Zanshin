  10-35-inspector-fixes-title-form-parent-ids-split: done  # DONE 2026-11-14 (build-auto; spec-10-35-inspector-fixes-title-form-parent-ids-split.md; jump = graph.goTo, glyph `parent` in DS + app; Marionette check left to the console session). [UI] Added 2026-11-14 (Ralph, console session; every item checked against the code). (1) TITLE FORM: InspectorViewModel._open (graph_inspector.dart:102) keeps a change's describe form open all session; only Cancel/Esc/Save clear it, runComposer drops the draft but not the open state. Repros (form opened by a click, nothing typed): close and reopen the inspector on the same change -> still a text field; click Commit in the composer, select the original change again -> still a text field. DECIDED (Ralph): when the selection leaves a change (another change, or select(null) = inspector closed) its form stays open only while its draft is dirty (the Esc rule, dirty/_unchanged); a click without typing makes no draft; a typed-and-reverted draft is not dirty. Check in _graphChanged before _entry/_key change. (2) PARENT IDS in the meta line (_Meta, _CopyId prefix 0, :1843): jj's unique prefix bold in --text like the header change id, no jj subscript; a parent outside the loaded graph keeps today's look; click still copies. (3) JUMP TO PARENT: an icon button after each parent id, tooltip "Select parent <id>", selects (and so reveals) the parent; disabled with reason when not in the shown graph; check a parent inside a collapsed stack; glyph from the DS (design-artifacts). (4) SPLIT: on a change other than @ with every file and hunk picked, Split is disabled, tooltip: describe the change with its title; jj's "...will become empty" note goes; @ unchanged (jj commit). DECIDED (Ralph): jj commit has no -r, describing is the title's job, a Split of everything leaves an empty change. (5) COMMAND LINE (:2764): the ellipsis moves into the middle of the -m message(s) so `jj split -r <id>` and the paths stay visible; tooltip keeps the full command.