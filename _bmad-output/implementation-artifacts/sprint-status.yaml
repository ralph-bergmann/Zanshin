  10-46-ref-names-and-move-picker: backlog  # [UI] Added 2026-11-15 (Ralph, console session; same design round, design/Refs Study.html sections 6-7). SCOPE: (1) name field for create/rename of bookmarks and tags (GraphNameSheet, graph_card_menu.dart ~:855-925, every sheet using it): characters git refuses (space, ~ ^ : ? * [ \, control chars) become "_" while typing and on paste, with a quiet note; whole-name rules show an inline error and disable Create (leading/trailing "/" or ".", "..", "@{", "//", ".lock" ending, a lone "@") — replacing them while typing would fight the user; Ralph 2026-11-15, stricter than the CLI (which fails later at git export). (2) "Move existing here…" picks from a list instead of the free-text field (graph_card_menu.dart ~:415-427): autocomplete field, rows like the top search (name with match highlighted, "now on <id> <subject>", "backwards"/"sideways" pill), switch "Allow moving backwards or sideways" (--allow-backwards), blocked move says why, command line jj bookmark move <name> --to <id> [--allow-backwards]. (3) the same picker for tags from the tag popover (10.45): jj tag set <name> -r <id> --allow-move; a tag on a remote shows "<name> is on origin — moving it changes a published tag. Anyone who fetched it keeps the old one; your next push of the tag moves it on origin too." (Ralph 2026-11-15: warn, don't forbid; jj has no tag move, set --allow-move is it). (4) DS: name field note/error, move picker; DESIGN-SYSTEM-SYNC entry, publish by the console session. DESIGN QUESTION: "@" inside a name — default keep it allowed (only "@{" and a lone "@" are errors), or replace with "_". WITNESSES: "feature/my new:idea?" -> "feature/my_new_idea_"; pasted "fix/login ~ crash" -> "fix/login___crash"; "release/1.5." -> "Must not end with “.”", Create disabled; picker "feat" lists matches with their change; backwards move needs the switch, then --allow-backwards; moving v1.5.0-rc1 (on origin) warns and runs jj tag set … --allow-move; Marionette by the console session. Depends on 9.59, 10.45. See epics.md Story 10.46.
