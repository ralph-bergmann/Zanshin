  11-7-settings-window: done  # DONE 2026-11-02 (bmad-build-auto; spec-11-7-settings-window.md, commit 9522ef8): content-sized Settings window via openSettings (tab shown last; targets project / immutableCommits), General + Project tabs over SettingsStore and 9-28's config verbs, Immutable commits page, immutable reasons in peek + inspector; deferred I1-I10 fixed; 4 low deferrals (Edit… for list remotes, heads list/hints, Nami mark on the tab, running-app check). HISTORY: [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). One 620 px glass sheet with tabs General | <project>; ⌘, toggles it (a no-op over the Projects dialog), also opened from the Project menu and View options; the scope lines show 9-28's configPath paths (never hardcoded); every jj row shows its config key and the effective value + source. GENERAL: Theme (the existing appearance.themeMode), Density (new; scales the base size; open: keep it -- recommended), Hide controls (new, default on; gates 11-3's calm), Diff layout (new, Unified by default; 10-24), Identity user.name/user.email at the user scope via 9-28 (shows the working-copy-author fact; the target of 9-27's identity_missing). PROJECT: git.fetch / git.push selects of remotes() (open: list/pattern values since jj 0.46 -> read-only TOML text + Edit… -- recommended), "Check for remote changes" Off/5/15 min (default 15; drives 11-8's 9-24 poll; the export's "Fetch automatically" promises a real fetch), Trunk = revset-aliases."trunk()" written as <name>@<remote> like the CLI's own writer (+ Custom…), Immutable heads = revset-aliases."immutable_heads()" (a broken value -> 10-5's revset error + the previous value offered back), a repo-scope user.email switch (set/unset). Writes of trunk()/immutable_heads()/revsets.log feed 10-5 item 16 (one re-request under the anchor). Witnesses on a fake config port. Depends on 11-2, 11-3, 11-5, 11-8; 9-27/9-28 done. See epics.md Story 11.7. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Settings becomes a window of its own on 11-12 (key settings, 620 wide, shrink-wrapped height, title = the tab label; decisions 16.13, 16.42 d); ⌘, opens or activates it on the tab shown last and never toggles (16.14); General gains 'Accent colour: Follow macOS · Zanshin' (16.2) and Theme Paper · Night (16.11); Zs controls (16.1). Depends on 11-12, 11-11, 11-13. DESIGN UPDATE 2026-10-26 (console session, DS #12/#13): Settings gets PAGES (SettingsRow onOpen navigation row -> SettingsPage with '‹ <project>', ⌘[, the window title = the page name; a page belongs to its tab); History's 'Immutable heads' text field becomes the page 'Immutable commits' (ImmutablePage: Built in = the 4 builtin_immutable_heads() switches, Also immutable = others (trunk().. & ~mine()) / bookmark chips / custom revset, Result well with the TOML + count + heads, Reset). Claude's proposals: chips written as present(<name>); custom revset written on ↩/blur only once revsetCounts(cap 0) resolves it; Reset = configUnset at repo scope; the effective alias is read back and mapped onto the controls; count = revsetCounts('::immutable_heads() ~ root()', cap 10000). Card menu's 'Immutable commits…' (10-15) opens it. Depends also on 10-3 (HatchSwatch) and 9-25.
  11-8-sync-fetch-push-poll-badge: done  # DONE 2026-11-03 (bmad-build-auto; spec-11-8-sync-fetch-push-poll-badge.md, commit 3516be5): sync island Reload · Fetch (default remotes, progress, syncing dot, toast + Retry, badge) · Push… sheet from dry-run plans (skipped/refused rows, Allow flags, bulk, change row, per-remote results, Undo); read-only poll at the interval + on app resume (silent failures, no overlap, none while stale); Change › Fetch / Push… ⇧⌘P; ProjectStatus.syncing; clone form progress + Cancel, destination rules in the verb; I1–I5 settled; deferred: running-app Marionette poll witness + DS comparison. [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). The ACTION group's Fetch and Push (36 px icon buttons; the tooltips name the jj command + the resolved remotes). FETCH until 9-30: one remote -> fetch it, several -> a menu to pick one, none -> disabled; with 9-30: no remote passed (the CLI's defaults), enabled while remotes() is not empty; progress from 6-4a's ProgressEvents, the project dot reads "syncing", the result or the error in 10-23's toast with Retry; the graph reloads via op-heads. PUSH disabled until 9-20 (then the CLI's defaults, git.push + revsets.git-push passed through; open: no confirmation -- recommended, as in the CLI; undo warns per 9-39). POLL (decision (g)): 9-24's read-only remote-change check at 11-7's interval and on window activation -- no operation, nothing moves; BADGE = the number of remote bookmarks that moved/appeared/vanished, the tooltip names them, no commit count, a fetch clears it; nothing before 9-24. Depends on 11-3, 11-5, 11-7, 10-23; 6-4a/2-9 shipped; 9-30, 9-24, 9-20 backlog. See epics.md Story 11.8. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Push opens a selection sheet with a --dry-run preview (⇧⌘P) per DS PushDialog, with jj v0.46.0's per-mode semantics (decisions 16.8, 16.25); this supersedes the push with the CLI's defaults and no confirmation, design question (b) and the non-goal 'pushing single bookmarks'; Fetch has no shortcut (16.42 m); both buttons are Zs controls. Depends on 9-20, 11-11, 11-13. NOTE 2026-10-21 (Ralph, after the story loop 9.24/9.30/9.31; epics.md 11.8 dated note): witness RepoHandle.remoteChanges('origin') once in the running app (Marionette), since dart test reaps the git child; the timed poll gets NO special auth handling (1Password/credential dialogs may appear, as in SourceTree) -- an unconfirmed tick fails quietly, no toast, next tick retries, ticks never overlap. DESIGN UPDATE 2026-10-26 (console session, DS #10): the Push sheet's change row with exactly one allowable reason shows a short 'Allow' at the end of its label line and the reason right under it ('Refused — <id> has no description' -> 'Allowed — … · pushed with --allow-empty-description', the flag joins the command once ticked); several reasons keep the chip row; the name field stays below.
  11-18-settings-remote-management: backlog  # [UI/bridge] DESIGN DONE 2026-11-06 (DESIGN-SYSTEM-SYNC #20, with Ralph): RemotesGroup in the DS (list, ••• Rename/Set URL/Remove, Add remote…, the row as a form with the command and jj's refusal verbatim, Remove via ConfirmDialog sheet on the Settings window, credentials hidden), prototype remotes.jsx; card "Settings — Remotes and config file". Was NEEDS DESIGN, added 2026-11-03 (Ralph, console session: "eine Design-Runde, dann eine Story"; deferred-work "Remote management has no surface"). DESIGN ROUND FIRST: a Remotes group in Settings > Project -- list (name, fetch URL, push URL if different), add, rename, set URL, remove with confirmation, jj refusals. Rows call 9.5's jj git remote add/rename/remove/set-url via the bridge (exact CLI behaviour, commands shown in full, shell-quoted); no credential in a URL ever shows (gix to_bstring). Fetch/push selects, the 11.8 poll and the Push sheet re-read remotes after a change. Non-goals: remote branch management beyond 10.14, forges. Witnesses: each verb on a fake port issues the CLI command and shows jj's refusal verbatim; real-worker add/rename/remove in a temp repo; Marionette vs the new DS card. Depends on 9-5, 11-7, 11-8. See epics.md Story 11.18.
  11-19-settings-config-file-editor: backlog  # [UI/bridge] DESIGN DONE 2026-11-06 (DESIGN-SYSTEM-SYNC #20, with Ralph): a page in each Settings tab via "Edit…" in the scope line (ConfigFilePage: mono, line numbers, no wrap, Save ⌘S / Revert, parse error marked from jj's span, Discard-edits ConfirmDialog, changed-on-disk notice with Reload); Ralph decided the Settings window becomes RESIZABLE (min 620 × 420, zoom) — this story builds that too. Was NEEDS DESIGN, added 2026-11-03 (Ralph, console session: "eine Design-Runde, dann eine Story"; deferred-work "Raw config editing has no surface"). The GUI split of `jj config edit` over 9.28's configFileRead/configFileWrite (done, no consumer yet). DESIGN ROUND FIRST: where it lives (an "Edit config file..." link per Settings tab for user/repo scope, or a page), the monospaced TOML editor, Save/Revert, jj's parse error (line + message). A write jj rejects leaves the file unchanged and shows jj's message; Settings rows and open windows re-read after a save (11.7 configWrites). Non-goals: highlighting beyond monospaced text (unless the design asks), a key catalogue. Witnesses: open shows the scope's file; save writes; invalid TOML keeps the file + shows jj's message; a saved alias appears on the Immutable page. Depends on 9-28, 11-7. See epics.md Story 11.19.
  11-20-density-spacing-tokens: backlog  # [UI] DESIGN DONE 2026-11-06 (DESIGN-SYSTEM-SYNC #21, with Ralph): DENSITY = air only — every row +0/+3/+6 px (fixed heights add it, padded rows half above/below, settings rows both), graph cards 40/62 · 44/68 · 48/74, gaps 56x48 · 62x54 · 68x60; text, controls, chrome, radii and window sizes stay; the 12.5/13/13.5 text scale goes. NEW ZOOM (scope grown, Ralph): Settings > General > Zoom pop-up 90/100/110/125/150 % (default 100) + View > Zoom In Cmd+ / Zoom Out Cmd- / Actual Size Cmd0; scales everything in every window (live, remembered, app-wide, multiplies with density); traffic lights stay, every window minimum scales (a smaller window grows); reason: Flutter macOS reports textScaleFactor 1.0, so the system text size never arrives. DS: components/density.css (sets on data-density + row rules; OUTSIDE tokens/ until this story gives ZsMetrics the sets and css_token_reader learns data-density, then the token block moves to tokens/spacing.css), cards Density + Settings, readme 'Density and zoom'. Needs a zanshin_settings field appearance.zoom. HISTORY: NEEDS DESIGN, added 2026-11-03 (Ralph, console session: "eine Design-Runde, dann eine Story"; deferred-work "Density has no tokens", 11.7 design question (a)). 11.7 built Settings > Density (Compact/Balanced/Comfy) as a text scale only (12.5/13/13.5 px); no DS component reads it. DESIGN ROUND FIRST: which tokens change per density (row heights, paddings, graph card size, island heights, gaps) and by how much; the DS gets three token sets and its cards show all three. zanshin_ui carries the sets; the app switches them live in every window; the graph's card metrics follow (router geometry stage only). Non-goals: per-window density, a custom scale. Witnesses: each density changes the named tokens (widget test); graph card size follows; Marionette per density vs the DS cards. Depends on 11-7, 11-14. See epics.md Story 11.20.
  11-22-push-help-for-git-switchers: done  # DONE 2026-11-05 (story loop; spec-11-22-push-help-for-git-switchers.md, commit 58509d30): items 1-6 done -- DS/prototype round (sync #19), refusal + reason kinds over FlatBuffers with plain explanations and fix-its (Track, Fetch, --deleted), explicit refusals in every mode, change ids before commit ids, conversion's trackable remote bookmarks + Opened toast Track/Track all (per-bookmark Track stays in the Bookmarks panel/Push sheet, sync #19). Deferred: no fix-it for a new remote tag (no tag-track verb); Marionette check owed. HISTORY: [UI/bridge] NEEDS DESIGN, added 2026-11-04 (Ralph, console session: his first push of this repo from Zanshin after `jj git init --colocate` skipped `main` with "Non-tracking remote bookmark main@origin exists"; "eine Hilfe an die Hand geben ... auch git-Umsteiger"; deferred-work "Surfaced 2026-11-04 in Ralph's first push from Zanshin"). jj imports origin/main untracked (remotes.<name>.auto-track-bookmarks defaults to ~*), so push skips main; the Push sheet shows jj's hint `jj bookmark track main@origin` verbatim but cannot run it and explains nothing. DESIGN ROUND FIRST (DS + prototype in place, a DESIGN-SYSTEM-SYNC entry), then: (1) a Track X@R fix-it on the non-tracking refusal, running 9.11's verb (command shown in full) and re-running the dry-run; (2) a plain one-or-two-sentence explanation per refusal/warning for Git switchers, keyed by a refusal KIND the bridge adds over FlatBuffers (PushRefusal carries message + hint only today) -- non-tracking, conflicted, the commit checks incl. "@ is your empty working copy, your work is in its parent", private, allow-new, deletions, sign-on-push; jj's text stays verbatim; (3) conversion parity: the CLI's post-init hint (print_trackable_remote_bookmarks, cli/src/commands/git/init.rs:376-412 @ v0.46.0) -- the conversion outcome lists local bookmarks with an untracked remote counterpart, the UI offers Track each/all. Non-goals: a jj tutorial, changing auto-track, explanations outside the Push sheet and conversion. Witnesses: Track issues `jj bookmark track main@origin` on a fake port and the re-run lists `main [move forward ...]`; one test per refusal kind; Rust: converting a repo with main + origin/main reports main@origin untracked, parity oracle compares; Marionette on a freshly colocated repo vs the DS cards. Depends on 11-8, 9-11, 9-57, 10-14 (all done). EXTENDED 2026-11-04 (Ralph, console session, screenshot of a real repo): (5) show a row's explicit refusal (what -b would get) in EVERY mode, the mode's skip as its own quieter line saying when ticking still pushes it -- today push_sheet.dart:364 hides it outside custom, so the warning seems to jump rows when one is ticked; (6) change id first, commit id dimmed in the rows' action texts ("add to 2d0dbb65bad8"), PushRef gains before/after change ids over FlatBuffers. See epics.md Story 11.22.
