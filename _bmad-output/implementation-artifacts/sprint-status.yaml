##
## Hier der eine Feinschliff: „weiter mit Epic 2" heißt nicht „erst ganz Epic 2 in Rust, Wrapper später". Sondern jedes fertige Noun bekommt sofort seinen dünnen 3-4b-Wrapper, damit du es direkt aus Flutter ausprobieren kannst:
