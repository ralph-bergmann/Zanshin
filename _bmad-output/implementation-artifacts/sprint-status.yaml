  10-6-selection-hover-keyboard: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. Controllers GraphSelection/GraphHover (Listenables, per key, no setState, no per-build closures). FINAL from the design: click selects + opens the panel AFTER the double-click window (prototype 220 ms), no scroll; double-click on a MUTABLE card = jj edit via 10-5's GraphActions port (fake until 10-9; no confirm); hover focus path (default on) = hovered + all ancestors + all descendants, others painted at .4 by the viewport (hover = 0 card builds), edges .28; Esc leaves describe mode first, then clears the selection -- scoped to the graph's focus (the prototype's Esc is a window keydown listener GV:541-548, so the Esc closing the Projects dialog APP:2034 also clears the graph selection: defect 11); "@ Working copy" = reveal(@, centre, animated), an explicit reveal in 10-5's precedence; tooltip texts "Click: details · Double-click: jj edit" / "Working copy (@)". Empty-canvas press = 10-1's pan (the prototype never clears the selection there, GV:563-569 -- a behaviour to decide, not a defect). Focus-set cost measured at 100k. GO-TO-CHANGE MECHANICS (item 11; the spike viewer, 2026-09-26): RECOMMENDED an instant jump = reveal(key, centre, animate: false) = jumpTo on both axes; animate or not + select or not = (d) (the viewer: instant, centred vertically, horizontal scroll only as far as needed to clear the gutter, selects + pulses 3x); 10-1's reveal takes ONE alignment for both axes -> a per-axis alignment or centre both; an explicit reveal in 10-5's precedence. The frame after a jump is a pure function of the offset (binary search for the first card, only the visible cards built) -> viewer, 200 random jumps on the real 1.4k repo AND synth-100k (up to 5.4 M px): on screen in the first frame after the key, frame work median 3.8/3.4, p95 6.7/5.7, max 7.4/7.0 ms (real/synth; a later rerun median 3.95-4.3, p95 6.5-7.1, max 8.1-10.8) vs idle 0.5-0.7 ms, a median of 8-13 cards created (max 18), |r(distance, work)| <= 0.08; an animated scroll would build ~2,000 viewports over 1.6 M px. Budget: at most the visible cards + cache extent built, within one frame at 100k. Target: a full id via 4-12's lookups (a named consumer); a prefix/bookmark/revset/description = a backend path resolved as the CLI does (ambiguous prefix refused; deferred-work). Witness: a far jump on a 100k recording builds no card in between; work recorded at 3 distances (not gated). NOT designed: keyboard navigation for a layout with several cards per row, go-to-change, context menu (design uses quick actions + popover), multi-select. Open: immutable double-click (nothing vs CLI refusal), empty-canvas click clears selection?, key map, go-to-change affordance (candidate: the viewer's ⌘F box -- change/commit-id prefix else description substring, <= 50 hits + total, Enter/Shift+Enter walk, Esc keeps the query; open: instant vs animated (and locate @ over long distances), select or only reveal, jj prefix semantics, revset input, hits outside the revset, where a description search runs), context menu, multi-select, @ shortcut. Depends on 10-1, 10-3, 10-4 (10-5 for reload survival + the port, 10-9 for the real edit). See epics.md Story 10.6. DECIDED 2026-09-27 (Ralph): the spike viewer's found-commit PULSE ships (item 12): after a go-to-change the target card pulses 3 x 650 ms ease-out -- a #3B82F6 ring growing 2 -> 22 px while fading 80 % -> 0 %, the card raised above all others, painted in the overlay layer; restart on a repeated jump; paint-only (one ticker, 0 other card builds); reduce motion -> no pulse, just the selection ring (recommended). Intended deviation (e) from the design. Scope decided 2026-09-27 (Ralph): go-to-change only for now -- locate @, bookmark pick and minimap click do not pulse; other use cases can add it later. 2026-09-28 (design update): item 7's tooltips become the COMMIT CALLOUT (GV:461-484 @a399daf: full subject, full description from 4-10, change id + commit id, full author, date, hint "Click: details · Double-click: jj edit" / on @ "Working copy (@) · Click for details" / none on the root; NO stats row), after 450 ms beside the card; ONE hover-callout controller for it, 10-17's stack popover (380 ms) + row callouts (180 ms) and 10-15's bookmark popover (no delay): hoverable + nested, the gap bridged, closes when the pointer leaves the chain, stays closed over bookmark control/"..."/"+", flips to stay inside the canvas (above cards + gutter), card-anchored widgets with the card pinned, 0 card builds on hover, none while panning/dragging; VoiceOver gets the description as the card's hint (proposal accepted); the focus path passes through stacks.
  10-7-graph-toolbar: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design (the old free-text revset field + Apply/Save to revsets.log is NOT in the design). 46 px bar: revset select = "$" button + 320 px listbox with exactly two presets, "jj log" (the EFFECTIVE revsets.log via logDefaults, re-read while selected; never a baked builtin_log()) and "jj log -r 'all()'", with the design's descriptions; Layout segmented Compact ("Rows = dependency depth") | Time ("Rows = rounded commit time"), default Compact, switch re-centres @, a Free segment only if 10-13 decides so; switch labelled "Detailed cards"/"Compact cards" (default on); Card width range 160-400 step 10 with "240px" readout (default 240); right: "{shown} / {total} commits" (total = |all()|) + "@ Working copy". Prefs app-global in zanshin_settings (GV:504-507). material_ui controls. Thin: the dropdown is a popup, not final. Open: two presets final or free text + Apply/Save (9-25 / 9-28 configSet) back, default tracking, revset error surface (design has none), counter before total is known, advanced params (prioritize/short-prefixes/anchors; synthetic-elided is no longer sent), which tweaks become settings (Bookmark labels, Lane order, Crossings, Hover focus), shortcuts, Free segment. Depends on 10-2, 10-3, 10-5, 10-6. DECIDED 2026-09-27 (Ralph): Layout = Free (DEFAULT; the design's default is Compact, GV:507) | Compact, Time dropped; Free's label/hint and the segment order are open; Crossings is no longer an option (always on); Lane order = compact (default) | greedy, its label open ("Compact" collides with the Compact layout). 2026-09-28: a "Group stacks" switch (GV:336-339 @a399daf; default on, app-global like Detailed) -> 10-5's stacks flag, anchored relayout, never re-centres @. See epics.md Story 10.7.
