cies, covers Rust and Dart only, parses that file in 7-19 ms per side. RustRover uses no parser either (IntelliJ ByWordRt.kt / ChunkOptimizer.kt: words first, shift the borders, then punctuation); its words-only step would keep `GitResetHeadError::from_git` of jj 671e4eaca's old line 2454 as unchanged text on new line 2459 (what 5-11 was made to avoid), so its steps are not ported. DECIDED (Ralph): no tree-sitter; finer tokens; RustRover's marks on his example are the target; similar stays the comparison. ALSO DECIDED (Ralph, same day): a block of one old and one new line shows as ONE line, as the jj style's inline lines do (the jj style reads better on his example because it shows `.map_err(...)` red inside one line). RULE per changed block with lines on both sides: (1) tokens = a run of blanks, a run of word characters (char::is_alphanumeric or `_`), or any other character alone; (2) similar's Myers over the two token lists (capture_diff_slices), equal = same text; (3) shift right: a run of changed tokens moves right while its first non-blank token equals the token right after the run (of two equal tokens around a change the later one counts as changed; blanks at the run's start stay); (4) marks: a changed non-blank token is marked; a run of blanks and unchanged punctuation without a line break is marked exactly between two marked non-blank tokens (5-11's blank rule is the case of one blank); (5) WORD_MARKS_LIMIT measured again (two to three times as many tokens per block; same method and ~50 ms target as 5-11); (6) one line for one line: in a block of exactly one old and one new line each word token stands twice in the comparison (keeping a word beats keeping one punctuation character; only here, in multi-line blocks that weight pairs equal words across lines); the changed parts are counted as jj's count_diff_alternation counts them (one removed part = 1, removed + added = 2); the block becomes one `changed` line with both numbers when it is within the size limit, the two lines have equal indentation and trailing blanks, and the count is within diff.color-words.max-inline-alternation (-1 always, 0 never, default 3); its segments are exact (old tokens Equal or Removed, new tokens Equal or Added, blanks too, removed before added), so each side's text can be rebuilt; otherwise old line then new line by (3) and (4). MEASURED for (6): 13 of the 32 blocks are one old and one new line; 12 become one line at the default limit, one has 5 runs and stays two lines. SCOPE: crates/zanshin-jj/src/hunks.rs (word_runs, side_runs, docs, 5-11's mark tests; lines, hunks, numbers, counts, fingerprints, the wire and the jj style untouched; the similar features in Cargo.toml follow); wording wherever the style is called "whole words" (schemas/envelope.fbs + codegen, zanshin-ffi diff.rs, zanshin_core ffi/diff.dart, zanshin_settings general_settings.dart, docs/ffi-abi.md, project-context.md); app hint settingsDiffMarksZanshinHint = "Marks the changed part of each line, using the similar library. Removed lines come first."; Settings > General: the "Inline changes" row shows in both styles (5-12: jj only), with a Zanshin hint ("How often a line may switch between removed and added parts before it shows as an old and a new line. Applies where one line replaces one line. Experimental in jj."); inspector_diff.dart already draws a `changed` line by its kind in both styles, the run checks a merged line in both layouts; catalogue "Inspector diff / Word marks" shows the new marks and gains Ralph's new example; DS prompts, readme and Content card, republished; parity oracle unchanged. NON-GOALS: tree-sitter or any parser, language-aware tokens, a port of IntelliJ's algorithm, a third style or a fineness setting, changes to the jj style, lines, hunks or colours, one line for a block with several lines on a side (stays removed lines then added lines), a limit of Zanshin's own (it reads jj's key). KNOWN LIMITS (accepted): a merged line is longer than either of