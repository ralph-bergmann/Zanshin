ly x contrast x reduce motion x reduce transparency); a smoke test pumps every use case. Marionette: marionette_flutter ^0.6.0 -> ^0.7.0, install marionette_mcp first, one shared MarionetteConfiguration for app and catalogue, Semantics identifiers on every Zs control, window roots keyed, a catalogue-navigation extension, the tooling rules in project-context.md. Non-goals: Widgetbook 4/Cloud, goldens, Patrol, a separate widgetbook package. Order: after 11-1 and 11-2 (and 11-14 since 2026-10-17), before 11-3, 10-7 and every later story that draws a control. Witnesses: paints/matchesSemantics/meetsGuideline per control and state, cursors (replaces 11-1's Material-cursor witness), key maps, disabled-with-reason, disableAnimations, the catalogue smoke test, dart analyze --fatal-infos --fatal-warnings clean. See epics.md Story 11.11.
  11-12-window-foundation-dialog-windows: done  # DONE 2026-10-19 (bmad-build-auto; spec-11-12-window-foundation-dialog-windows.md, code commit 0dbd2fb; review pass patched 13 entries -- 4 medium: a new project window is not activated before its first focus and Projects comes forward with a report only after it, start() builds the content before its handlers, the _startApp composition is a tested function, the lifeline on its way is tested; follow-up review recommended: an open from Projects in the running app; ledger I1, I3-I6, I8 fixed, I2 partly (the Yaru git dependency stays with Ralph/11.10), I7 partly (10.23 toast)): AppWindows opens parentless dialog windows by key (DialogWindowSpec: own constraints, optional size = content-sized with no minimum, resizable, frame full|position, level normal|floatingWhileActive, keepsAppAlive), per-key close handlers, close guards (addCloseGuard/mayClose, also asked by Cmd-Q through WorkerLifecycleModule(mayQuit:)), the exit rule (the project window and Projects keep the app alive); RememberedDialogWindowController; the runner's restore {chrome: main|secondary, frame, level} with isRestorable=false on every window (splash too), the secondary chrome on the WindowFillBase colour set, position-only frames that keep the top edge, dialogs first centred over the project window, the floating level while active, a DEBUG zanshin.window log line; applicationShouldHandleReopen forwards reopen to Dart; zanshin_shell restyles every app window and drags the event's window; ActiveWindowTracker drives the inactive delta; ZanshinWindowRoot (window:<key>) is every app window's root; AppWindowCoordinator owns the launch window (Projects when nothing reopens), Projects <-> project window, the red button, the Dock reopen and AppWindowActionsScope (All Projects... enabled); Projects re-reads the identity when it becomes key; ZsWindowScaffold; the catalogue's Windows > Window scaffold (Resizable, Content-sized, Floating) and dialog-window Window fill / Projects window. Six deferrals mirrored in deferred-work.md (Surfaced in Story 11.12). [UI/native] added 2026-10-16 (Ralph, console session on the design-system rounds 1-3; Claude builds it under 11-0's scope change; decisions 16.13-16.21, 16.38). Settings, Projects and jj log Configurations become parentless windows; today AppWindows knows only the main window. AppWindows dialog support (RememberedDialogWindowController on DialogWindowControllerMacOS(constraints:), Titled | Closable [| Resizable], no Miniaturizable, FullScreenAuxiliary; factory/openOrActivate generalised to BaseWindowController; DialogWindowControllerDelegate close intercept); one instance per key (settings, projects, revset-configs, one key for the one project window); each dialog passes its own minimum, never the project window's. Chrome kinds main | secondary (MainWindowChrome parameterised; secondary = engine mask, fullSizeContentView, transparent titlebar, hidden title, NSToolbar, per-theme --tl-ring rings, drag area, no forced minimum, no vibrancy); isRestorable = false for every window. Frame store zanshin/window_frames reused per key, a position-only mode for Settings with the top edge held, first placement centred over the project window after the first frame. zanshin_shell appearance for every window; per-window app roots over the shared DI with an active-window tracker (inactive look, no hover in a non-key window) and keyed roots for Marionette. Configurations at .floating while Zanshin is active, .normal on resign. Boot: openProjects beside openMain (Projects the first window when no project), applicationShouldHandleReopen, the exit rule becomes 'Projects closes while no project window is open', terminate/close hooks for a dirty Configurations window. Header 52 pt, controls on y 26, window.css wins over prose. Known side effect: blur-triggered writes fire on every window switch. Non-goals: several project windows, satellite windows, native sheets, raised levels for Settings/Projects