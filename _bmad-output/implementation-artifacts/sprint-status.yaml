  10-16-graph-minimap: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph's idea while reviewing the spike viewer: a minimap for big repos -- and how does it perform?; the viewer then built one to measure it; the design has none). At 100k one scrollbar px spans ~170 rows -> a strip with a raster of the whole graph, the viewport as an overlay, click/drag to jump. RASTER once per layout (and per strip resize / card size / VerticalLayout / theme change, debounced), OFF the UI isolate: a pure-Dart function (no dart:ui) over the columns, the VerticalLayout tops (UniformRows and PerNodeTops alike), the card size, 10-4's edge runs, the marker nodes, colours as ints and the strip's device size: card rectangles into a 2-D difference array (4 corner updates), edge runs into 1-D difference arrays, one prefix-sum pass, a log LUT counts -> alpha; O(n + E + pixels), exactness below a strip px not required; operation-bound markers baked in (viewer: @ gold line, bookmarked cards blue); RGBA Uint8List (~1.4 MB at 222x1546). WHERE it runs = (f): RECOMMENDED option A, an app-side Isolate.run over the materialized layout arrays + VerticalLayout tops (no 4-11 change -- its Non-goals exclude pixel geometry and 10-5's request carries no card size --, the one worker isolate stays free, works on recorded layouts from the start; inputs copied in once, pixels back via Isolate.exit); option B, a separate worker command with zanshin_core geometry params, needs dated amendments to 4-11 (item 9, Non-goals, Related), 10-5 item 2 and 10-12, occupies the worker and cannot serve PerNodeTops. UI: decodeImageFromPixels once per raster in its own RepaintBoundary; the viewport rectangle (+ full-width band?) is a CustomPainter repainting from Listenable.merge(scroll controllers) -> scrolling = 0 rasters, 0 card builds; click/drag = 10-6 item 11's jump mechanics (a drag is instant; a click animates only if 10-6 (d) says so), a user scroll that selects nothing. PROPOSED, not built in the viewer and not in its budget: the selection + go-to-change hits painted by the overlay. VIEWER BUDGET (Chromium, DPR 2, 222x1546 device px, raster on the page's main thread): raster median 1.4-3.9 ms from 22 to 99k nodes (a rerun later the same evening ~2x slower: medians up to 5.0 ms, one synth-100k series 5.7-7.9 ms, single renders up to 11 ms, 18 ms right after a strip resize; ~6.6 MB typed arrays per render), scrolling with the minimap <= ~0.4 ms more main thread per frame (within noise), overlay update 1-3 us, no dropped frame. Open (NEEDS DESIGN): placement/size/default/toggle (10-7?) and the right edge shared with 10-8's panel, scale (whole graph fitted vs a fixed scale that scrolls), markers + colours in both themes (built: @, bookmarks; proposed: selection, hits; @ lineage? hover? Free's days?; baked colours vs tinted alpha planes), rectangle vs band, click selects? hover tooltip?, the raster path (A vs B), VoiceOver. Depends on 10-1, 10-4, 10-5, 10-6 (10-7 for a toolbar toggle); no backend story on option A. 2026-09-28: rasters the GROUPED layout (a collapsed stack = one card, 10-17); a stack toggle = a new layout -> re-raster via item 6. See epics.md Story 10.16. DESIGN UPDATE 2026-10-14 (export e74ced3): the design now has a minimap, FINAL as the direction. It is a 134 px glass card on the right, always on, hidden while the inspector is open and back during calm scrolling; it draws the whole graph fitted, in dots and dotted lines, brighter inside the viewport band, with @ and selection dots, calendar-day labels, a current-day pill at the viewport centre (it replaces 10-2's pinned label) and a hover pill. A click or drag is an instant vertical jump that selects nothing, and the wheel scrolls the graph; (a)–(e) and (g) are answered, (f) keeps option A recommended, and Compact's row labels need a day key per node from the engine. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): View › Show Minimap (11-13) is an app-global switch, default on, superseding 'always on, no toggle' (decision 16.42 n); the selection takes the accent role's line, the day pill --at-chrome, the top is 60, and hide/show fades only under reduce motion (16.4).
  10-17-commit-stacks-view: backlog  # [UI] added 2026-09-28 (Ralph, design update, export a399daf; the engine half is 4-13; runs on the spike's stack recordings until 10-12). STACK CARD (GV:536-555, GC:228-232 @a399daf): a card's size, slotted RenderBox (10-3's pattern), stacked look (two offset layers); detailed = count badge + NEWEST member's subject / id range newest..oldest (2 bold + 3 dim each) + authors' first names + date range + conflict flag if a member conflicts; compact = one line; a CLICK EXPANDS (respects the drag slop); no selection/double-click/bookmark control/"..."/"+"; the focus path passes through it. POPOVER (GV:556-568, GC:233-239) via 10-6's hover-callout controller: 380 ms, below the card (above if no room), rows newest first (id, subject, date) + "Click to expand N changes", each row opens 10-6's commit callout after 180 ms beside it; LARGE stacks: capped height + scrolling + rows loaded as visible (proposal accepted; the design is unbounded = defect 19). BRACKET (GV:661-665, :800-806, GC:240-245): 7 px, 16 px left of the column along an expanded run; a collapse button (stack-collapse icon) on hover of the bracket or a member; painted by the viewport, the button hit-testable, the pan skips it. TOGGLE = a new layout request (10-5), 4-13 keeps every column; ANCHOR, not centre (proposal accepted; the design centres the middle member): the toggled stack keeps its screen position, members unfold upwards / fold back; expand fades the members in over 260 ms (opacity 0, -6 px, scale .98), paint-only, no animation under reduce motion. DEFAULTS: all runs collapsed except runs of mutable ancestors of @ (proposal accepted); "Group stacks" = 10-7's app-global switch (default on); user toggles persisted PER REPO keyed by the oldest member (the design persists one global list = defect 18); a changed oldest member -> the default. INTERPLAY: go-to-change into a collapsed stack expands it in the same relayout (keepOpenKeys); bookmark pick / locate @ never target a member; a run holding the selection never collapses by itself, a user collapse clears the selection (defect 20); the counter counts collapsed members as shown; the minimap rasters the grouped layout; content for all members of a visible stack (10-11). GraphLayout accessors: stack nodes (key, member range), membership, expanded runs for the bracket. Witnesses: card texts from the members; one request per toggle, the stack keeps its viewport position, no column change (I7); popover/row-callout delays + the nested hover chain; a 500-member popover capped/scrolling/visible rows only; the 260 ms fade, none under disableAnimations; defaults + per-repo persistence; go-to-change expands; a user collapse clears the selection; the counter. Depends on 10-1, 10-3, 10-5, 10-6 (10-7 for the switch; 4-13's spike step for the recordings); real data via 10-12 + 4-13. 2026-09-30 (design update): the 260 ms FADE IS DROPPED -- 10-20 brings the slide Ralph tuned (the members slide out of the stack's layers, 250 ms, no stagger); a toggle is instant until then (the fade witness goes); the export now keeps the columns while its frozen columns stay valid (defect 17; 4-13's I7 keeps them always); its groupStacks agrees with 4-13 at gaps; 10-19's "Show in all()" opens the hidden parent's stack via keepOpenKeys. See epics.md Story 10.17. DESIGN UPDATE 2026-10-14 (export e74ced3): decision (b) keeps 4-13's columns and the expanded runs of mutable ancestors of @; the export's collapsed-graph column freeze and its all-collapsed default are not copied. The 260 ms member fade returns (decision (c)), a collapse stays instant, and the anchor keeps the stack in place. Group stacks lives in 10-7's View options; stacks are neither drag sources nor targets; the roving focus includes stack cards (Enter expands; Claude's proposal); the bracket lights on member hover and never dims. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Reduce motion by property keeps the member fade (the 6 px rise and the .98 scale go to 0; decision 16.4); the popover takes the one menu material and the stack list the generic exit (16.40); ids follow jj's prefix (16.35).
  10-18-ai-stack-titles: backlog  # [UI] IDEA, NOT DECIDED -- added 2026-09-28 (Ralph, console session; backlog only, Ralph wants to think it over, so no ACs). WHAT: name a collapsed stack card by its contents (an AI title from the members' subjects) instead of 10-17's newest-member subject. That subject is the one right below the next visible card (a tip is never a member: a candidate needs exactly one child, 4-13 item 1), often housekeeping ("fix tests", "format code"); an anonymous branch has no other name. ENGINE: only Apple's on-device model (Foundation Models) fits: free, offline, no download, no API key; macOS 26+ on Apple silicon with Apple Intelligence on; context 4,096 tokens on 26, 8,192 on 27; Swift-only -> a small Swift bridge in the runner, not the worker/FFI (the pub.dev wrappers are all 0.x). Deployment target 12.0 -> every other Mac needs the fallback. RULED OUT: cloud models (Claude, Gemini) and Private Cloud Compute send the commit messages off the Mac (PRD 5.3, no phone-home); a bundled llama.cpp/Gemma model = 0.5-2 GB download + RAM for one label. SPIKE 2026-09-28 (spikes/stack-titles/, real 1.4k-commit client repo, M4 Pro, macOS 27, title + summary per stack): the default jj log view (12 commits) formed NO stack; all() gave 103 (all immutable, 2/6/119 members); median 1.06 s per stack, p90 1.81, max 3.74, cold start 1.0 s, 132 s for all 103, no errors; the AI title was clearly better than the newest subject in about half the stacks (mostly >= 5 members, often the feature commit at the bottom), the rest about equal, 1 misleading (named the one feature commit of a stack of tests/refactorings), no invented facts; "<= 6 words" often ignored, casing varied; the summaries mostly re-list the subjects and cost most of the time; a non-AI ticket-key/scope label names the ticket, not the content. CLAUDE'S RECOMMENDATION if built: title only, stacks of ~4-5+ members, visible collapsed stacks only, lazy, one request at a time after 10-11's content, cached by a hash of the members' descriptions (a rebase keeps it), marked as generated, truncated/normalised by the view, newest subject as fallback + in the semantics, opt-in switch next to "Group stacks" (10-7). OPEN (Ralph): build it at all?; card label vs popover head; opt-in vs default; minimum size; own Swift bridge vs a pub.dev wrapper. Depends on 10-17, 10-11. See epics.md Story 10.18.
  10-19-hidden-history-gaps: backlog  # [UI/bridge] added 2026-09-30 (Ralph, console session on the design update, export e243dd2; the gaps study "Graph Gaps Study.html" + graph-gaps.jsx; Ralph picked variant B). Takes over 10-4 item 5 (the elided marker) and answers 10-4's design questions (a)-(c). jj reports gaps as edge kinds (4-10): INDIRECT (to the nearest visible ancestor, drawn dashed by 10-4) and MISSING (no visible ancestor). MARKER "//" (two slanted strokes 10 px wide, 6 px apart, 1.5 px, round caps, --text-faint) on every Indirect edge, the dashed edge cut 8 x 12 px beneath it as split subpaths (like 10-4's hops, never a mask). HIDDEN MERGE (proposal accepted) = a node with exactly ONE real parent (4-10 parent_count) and >= 2 Indirect edges: one marker PER EDGE (the design's shared marker 10 px under the card on a 19.2 px stem fits no spacing rule); hover on any = the whole group + the group callout; multi-parent nodes never group (jj does not report the "via" parent; the design's via has no jj source, defect 4). PLACEMENT = THE 24 PX RULE (Ralph): the marker's CENTRE keeps >= 24 px from every card rect (ANY card, incl. the bookmark pill), every bend/crossing/junction of any edge, every other marker/stub/label; never on a stretch shared with another edge; the scan follows the design (verticals before horizontals, from the child end, first admissible point: a straight edge between adjacent rows -> the middle of the 48 px row gap; a short child vertical -> its bus above a column gap); fallback = the point with the largest minimum distance (nearest the child on a tie), never shared; placed once per layout + card size against whole-layout indexes (10-1's card index, 10-4's run indexes), stubs first, then markers in edge-index order -> deterministic + window-independent (the design: O(D x E) all-pairs, its own two cards only, fallback 11 px = defects 21-23). GraphTheme gapClearance = 24, tunable in the demo host. END STUB (Missing): a dashed lead to a // whose centre sits 24 px under the card + "~ elided" (11 px mono, NO count); centred without another parent edge, else the first of the design's side slots +0.28 W / -0.28 W / +0.14 W that passes the rule (else the best); label right, else left, else omitted; bottomExtra 44 stays. STATES: markers follow their edge (hover --text, lineage --co, dim .28), stubs their node (gold lead 2.25 px + glow in @'s lineage); painted in the edge layer after the edges, below the cards; GraphTheme tokens. GAP CALLOUT via 10-6's hover-callout controller: targets = a 12 px band along each dashed edge (10-4's hit lookup), a 26x26 box around a marker, the stub; opens after 380 ms (proposal accepted; the design opens at once = behaviour iv), closes 180 ms after leaving, hoverable, 18 px right of the target, flips left near the right edge, yields to pans/drags; content without counts: a title per kind ("Commits hidden between these changes" / "A hidden merge sits below this change" / "History continues outside this revset"), the chain child row -> glyph + "Hidden commits"/"Older history not shown" -> ancestor rows (Missing: the hidden parent's id + "parent, not in revset", its change id via show by commit id), the design's description, the button "Show in all()"; a press on a band STILL PANS (proposal accepted; the design blocks it = behaviour v). "SHOW IN ALL()": one show of the child (9-6; via GraphSource's show from 10-8, or added here with ShowEntry/Change exported) -> ONE layout request: revset all() + keepOpenKeys = the child's real parents the old layout lacks (the hidden parent's stack opens in the same relayout, 10-17 item 6) + an explicit reveal (rank 1) resolved on the new layout (the hidden parent leading to the target; a Missing edge's target; inside a collapsed stack -> that stack card, GV:737); FLASH of every commit the gap hid (the design's accent ring 2 + 6 px, held for 35 % of 2.4 s, then faded; paint-only on 10-6 item 12's ticker + overlay; static under reduce motion; a collapsed stack flashes as one card), the set derived WITHOUT a backend call from the new layout + the old keys (the nodes the old layout lacked on a path child -> target through such nodes; a hidden merge: all its targets; Missing: all such ancestors, capped at 10,000). TOOLBAR LEGEND after the revset select: a chip "N gaps" (hidden at 0; N = Indirect edges, a hidden merge once, + Missing edges), a popover after 200 ms with Solid/Dashed/End rows + counts, "Stacks never span a gap. Hover a marker for details." and "Show all()" = a plain switch (re-centres @); semantics: a button, markers/stubs add no nodes. Accessors: edge kind, parentCountOf, Missing edges with their target commit ids. RECORDINGS: the e243dd2 sample (52 commits, both revsets, the design's flags = a stand-in for a narrower revset like mine(), defect 24) with every gap case incl. @'s lineage through a gap (@ = mxnztwqp). Non-goals: counts/Count link/count toggle, Dots/Pill, a gap-details backend call, edge editing/drop zones (10-10), animating the reveal beyond the flash. Witnesses: paints per kind; the 24 px rule on every recording + 1,000 random windows (or the recorded fallback), no shared stretches, window-independent; placement cases; stub slots; states; callout timing/texts/flip/pan; Show in all() = one show + exactly one layout request, centres, opens the stack, flashes exactly the gap's commits, nothing animates under disableAnimations; legend count/hidden at 0/popover/re-centre; a hover builds 0 cards. Depends on 10-4, 10-5, 10-6, 10-7 (10-11 for the rows' content, 10-8's show or its own); real data via 10-12 (4-10's edge kinds + parent_count). See epics.md Story 10.19. DESIGN UPDATE 2026-10-14 (export e74ced3): decision (a3) replaces the 24 px centre rule with the export's 12 px of visible line to every card/bend/crossing/marker/stub (fallback = the middle of the longest free run) and gives a hidden merge ONE shared marker on its shared stem (16-22 px under the card if the stem >= 32 px, else mid-stem); stub slots +-0.28/+-0.14/+-0.4 W, each >= 14 px from every entry, the stub's // after a 12 px lead (Claude's proposal); family B, no counts, the 380 ms callout delay and pans on bands stay; the flash is moon. The legend moves into the View capsule after 10-21's field (AF:161-162), and Show all() / Show in all() switch 10-21's state to the built-in all() (the field reads $ all(); an active typed filter is replaced but stays in Recent). Depends on 10-21 instead of 10-7, and on 4-15's run indexes and ports. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The flash under reduce motion is a colour fade over 2.4 s with the spread held (decision 16.4) and reads the accent role's live copies; the legend gets the one menu material, the callout delays the right way round and the <= 1040 px breakpoint (16.37).
  10-20-graph-animations: backlog  # [UI] added 2026-09-30 (Ralph, console session on the design update, export e243dd2; Ralph tuned both animations in "Animation Show Case.html" and picked the values). A LATER story: earlier stories only keep the doors open via dated notes (10-1 overlay/union/per-key y, 10-3 borderless paint + content opacity/text offset, 10-4 partial strokes + the (child key, parent key) identity, 10-5 the old + new layout per reload/toggle, 10-17 drops its fade). STACK UNFOLD/FOLD: 250 ms, NO stagger (showcase defaults 280 ms/off), easing cubic-bezier(.2,.8,.2,1); the members slide from the stack's layers (the 1st from the card, the 2nd from the 1st offset layer, the rest from the 2nd) to their rows, every other card slides from its old to its new position with its edges; the stack card fades out in 150 ms, the bracket fades in over 180 ms after 150 ms (scaleY .9 -> 1); folding = the reverse (the stack card fades in ~113 ms at the end, the bracket out in 100 ms); direction from the layouts + the anchor: free = the newest stays and the older slide DOWN (as the showcase), compact = the oldest stays and the newer slide UP (mirrored); vertical only (columns fixed, deviation (f)). TREE CHANGE after every reload with a NEW OPERATION (proposal accepted: an own verb via 10-9 or an external jj; revset/mode/card-size/Detailed switches never animate): identity = key + column + row + parent keys (else leave + arrive; a describe animates nothing), an edge is kept when both ends are; LEAVING parts on an overlay layer fade to 0 over 600 ms with a 16 px blur and a 16 px rise (cubic-bezier(.4,0,.2,1)); ARRIVING parts from t0 = 300 ms (0 if nothing leaves): new edges drawn from the parent at 1.8 px/ms (linear) once the parent is ready (kept at t0, new when its trace ends); a new card starts when its first incoming edge arrives: its outline traced from the bottom centre along both sides to the TOP CENTRE (every edge leaves there, decision 5) at the same speed (1 px --border-strong, 1.25 px --co on @; the card's own border hidden meanwhile), its content fades in over max(0.8 td, 120 ms) from 0.3 td with a 3 px text rise, the trace strokes fade out in 160 ms at +80 ms; @ moving to a kept card pops its badge at t0 (200 ms from scale .4, overshoot), kept edges switch lineage at t0. LIMITS (proposals accepted): only the viewport (+ cache extent) animates; a duration cap (proposal 1.5 s; longer chains draw faster; > ~30 arriving cards in view fade in together without tracing); a new transition finishes the running one; reduce motion = no animation; scrolling/panning continue, callouts wait. Paint-only on tickers, kept cards build 0 times. Demo host: a "slow motion x5" switch (timeDilation). Non-goals: animated revset/mode/size/Detailed switches, sliding moved nodes in a tree change, animated scrolling. Witnesses: stack layers/timings/no sideways motion/direction per mode; a rebase, an abandon and a jj new between recordings (the showcase's steps) change exactly the changed nodes, in edge order, with the timings; a describe-like change animates nothing; the cap + count limit, reduce motion, a second transition finishes the first; 0 builds for kept cards. Depends on 10-1, 10-3, 10-4, 10-5, 10-17 (10-9 + 10-12 for real triggers). See epics.md Story 10.20. DESIGN UPDATE 2026-10-14 (export e74ced3): the Animation Show Case model is superseded by the client's FLIP model. After every operation, undo included, moved cards glide 460 ms on cubic-bezier(.32,.72,0,1) around a still anchor; a born change grows out of its anchor in 540 ms; other new cards fade in and removed ones vanish; edges hide and fade back in over 260 ms, and born edges draw in over 520 ms after 140 ms; changed cards flash a moon ring for 2.4 s; an off-screen born card is revealed, and a dropped change flies from the ghost. 10-9 hands the view the anchor, flash, born and drop-origin keys; stack toggles are 10-17's fade; reduce motion means no motion with a static flash; the cap and the count limit are moot. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Reduce motion by property: glide, growth and draw-in go to 0, fades keep their tokens, so new cards, the edge layer and the flash still fade (decision 16.4; supersedes 'no motion with a static flash' above); motion values come from DS tokens/motion.css; slow motion is Widgetbook TimeDilation (16.30).
  10-21-graph-search: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; built to the design per the Epic 10 header's design update 2026-10-14, decision (d); Claude's defaults adopted, decision (g)). REPLACES 10-7's revset select (the DS retires it as CommandField). The View capsule opens with ONE field [menu ▾ | query | ✕] (AF:159-171; SR = graph-search.jsx, SRC = search.css). VIEW STATE = the one owner of what the graph shows: default search | variant (jj log = the EFFECTIVE revsets.log via logDefaults, re-read per reload + on window focus, never builtin_log() as the mock bakes it RC:58; all(); a 10-22 configuration) | typed search {scope, mode, value, ci}; GraphRequest.revset derives from it; 10-19's Show in all() and 10-14's pick switch through it (the field then reads "$ all()"); the shown view persists PER REPOSITORY (the design: global, GV:545); a vanished configuration -> the default search. FIELD: default (empty, calm pill, ⌘F hint, no ✕) / typed (scope icon + label, value, ✕ = back to the default) / variant ("$" + its name as a value); moon tint for anything but the default; ⌘F or / focuses (not behind a modal dialog); prefixes c: b: a: f: d:; Backspace -> Any; Esc/blur restore; widths 320 / 250 (<=1180) / 170 (<=980), pill icon-only <=1100. ONE MENU (420 px): the default search tagged Default, the other variants ($, name, expression), Go to (Change c:, Bookmark b: -- select, graph stays), Filter by (Author a:, File f:, Description d: -- redraw), Edit Configurations... (-> 10-22). SUGGESTIONS: Any = Changes 3 / Bookmarks 2 / Authors 2 / Files 3 / Descriptions 1 + "N more in ...", a scope <= 8 rows, fallback note, empty text; match underline, dimmed folders, "not in view", "you · mine()"; FOOTER = what Enter does (the full jj log -r '...' + Filter ↵, or "Selects the change — the graph stays as it is" + Select ↵ / "Not in this view — switches to all() and selects it" + Show ↵). CANDIDATES: the shown topology first (ids/prefixes/refs/in-view via 4-12's lookups), 10-11's content cache (subjects, authors), bookmarks() (9-29 for untracked), fileList() at @ once per op (as the CLI's jj log completion, complete.rs:1143-1152; the design indexes every commit's paths), 9-25's find_changes over all() for descriptions + id prefixes (jj's ambiguous-prefix refusal as a row). COUNTS from 9-25 (op-pinned, batched per typing pause, cached per (op, expression), capped "10,000+"), async; a zero count DIMS its row (the design removes it, SR:160). SEMANTICS: Filter ↵ = the view = the builder's text run in all() = the footer's command, one request, @ re-centres; go-to = 10-6's reveal (rank 1) + the moon PULSE (decision (b): also Bookmark go-tos + recents), a hidden target -> all() in the same request, a collapsed member -> keepOpenKeys; reveal animation = 10-6's (smooth <= ~3 viewports, instant beyond). RECENT: go-tos + filters (count + expression), per scope, Clear, 10 stored / 6 shown, hidden when a configuration has the same expression or the change is gone, PER REPOSITORY (the design: global), a bookmark go-to keeps its name. BUILDER (bridge): one pure zanshin_core function, explicit pattern kinds (substring:/exact:/glob:/regex: + -i; cwd:/file:/glob: for paths -- at jj 0.46 a bare string is glob: in revsets and prefix-glob: in filesets), jj string quoting, "you" = author email == user.email (9-28 configGet; mine() = author_email(exact-i:)); the UI shows + passes its text verbatim (supersedes deferred-work's "the UI never composes the revset itself" for structured filters only). ERRORS: jj's message + 9-25's span in the popover footer, the last layout kept; a broken revsets.log marks the jj log row (answers 10-7 (c)). NEEDS DESIGN (defaults adopted, decision (g)): view + Recent per repo; the builder; async capped counts with dimmed zeros; go-to reach (view first, then find_changes). Non-goals: free-text revset, Save, variant segment, walking hits, minimap hits, writing revsets.log, the capsule/calm scrolling (11-3), the counter (10-7), the legend (10-19). Depends on 10-5, 10-6, 10-11, 10-22, 11-1..11-3; backend 4-9, 4-10..4-12 (+10-12), 2-8 (9-29), 9-4, 9-28, 9-25. Witnesses: field states/keys/✕ (no ⌘F behind a modal), menu order + exact expressions (jj log = the fake logDefaults().log), one request per filter, go-to select/reveal/pulse/all()/keepOpenKeys with no later jump to @, suggestion limits/fallback/one count per (op, expression)/dimmed zero, Recent rules, widths, builder goldens + a real-cdylib parse/select check via graphTopology (opt. 9-47's oracle). See epics.md Story 10.21. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The field follows the DS pill rule A2 and the field-attached list model, with the secondary text rung (16.41); ⌘F and / belong to the project window; Edit Configurations… opens 10-22's window (⌥⌘L); a stale working copy disables search; no <name>@ go-to (decision 16.27).
  10-22-jj-log-configurations-dialog: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; built to the design per the Epic 10 header's design update 2026-10-14, decision (d); Claude's defaults adopted, decision (g)). The ONLY place jj log variants are made, edited and made the default search (DS RevsetDialog; RC = revset-config.jsx). STORE: configurations {id, name, op & | |, rules [{fn author|committer|mine|subject|description|files, mode, value, ci, not}]} -- no base (dead since SYNC #6) -- + the default search (jj log | all() | a configuration), GLOBAL as designed in zanshin_settings (decision (g)); jj log = the locked fallback (removing the default falls back to it); list order = menu order. SHELL: 11-2's glass dialog sheet + scrim, 880 x 580, title "jj log Configurations"; Esc/scrim/close discard. LIST: Built-in (jj log, all(): selectable, read-only) + Custom (name + mono expression), Default tag, moon selection, add/remove/duplicate/move, empty state. EDITOR: Name; Default search switch row (hints; locked on jj log while it is the default; off -> jj log); rule rows is/~ not, function, mode (contains/is exactly/matches glob/matches regex; files: path or folder/exact file/glob), mono value, Aa (not files), remove; Match all & / Match any | from 2 rules; dashed add chips; "No filters — shows every commit (all())"; mine() shows the user's user.email (9-28 configGet; the design shows the name). PREVIEW: ❯ jj log -r '<10-21's builder text>', "N of M changes match" (9-25 count, M = allCount), Copy (shell-quoted; the design's is not), a failing rule marked via 9-25's span, the error in place of the count. FOOTER: Revset reference ↗ (pinned jj docs), Cancel, Apply (only when dirty, the default included), OK = the gold primary: apply + show the selected entry + close. Never writes jj config. NEEDS DESIGN (defaults adopted, decision (g)): (a) storage = Zanshin prefs, global (not [revset-aliases], not per repo); (b) a raw revset rule = DEFERRED (DS RevsetConfig.expr keeps the door open); (c) the default search is not revsets.log (jj log = the effective revsets.log; this UI never writes it; 9-28's configSet stays available). Depends on 10-21, 11-1, 11-2; backend 9-25, 9-28, 4-9, 4-10..4-12. Witnesses: list ops + menu order, the default rules, Apply/OK (one layout request)/Cancel/Esc/scrim, golden expressions per function x mode x not x -i and &/|, N of M from a fake count port, an error marks its rule, mine() shows user.email, global persistence. See epics.md Story 10.22. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): jj log Configurations becomes a window of its own on 11-12 (key revset-configs, default 880 x 580, minimum 820 x 460, floating while Zanshin is active, closes with the project window; decisions 16.19-16.21, 16.42 b): Esc, ⌘W and the red button cancel and ask 'Discard changes?' first when dirty, ↩ outside the fields = OK, OK switches the view and Apply saves and redraws the shown one (16.42 c); no scrim. Depends on 11-12, 11-11, and 11-2 only for the 'Discard changes?' sheet.
  10-23-operation-toast: backlog  # [UI] added 2026-10-14 (Ralph, console session on the design update, export e74ced3; 10-9's one feedback surface, split off as a reviewable piece, decision (g); answers 10-9's (b) and (c)). The design's OpToast (DND:135-146, DNC:44-54): a 38 px glass pill at the bottom centre of the visible graph (11-3's slot; 10-6's @ pill hides while it shows, AF:213), past-tense text with 8-char mono ids ("Moved S onto T", "Inserted S after T", "Squashed S into T", "Merged S and T in a new change", "Duplicated S onto T", "Moved N to T", "Abandoned X", "Split X — the rest is now Y", "Committed X · “msg”") for drops, squash, split, commit and abandon -- none for new/edit/describe/undo; Undo = 10-9's guarded jj undo (gone once the op head moved), × dismisses, 6.5 s, one at a time (a new outcome replaces it), ⌘Z while visible and not in a text field (GV:757-762). Claude's proposals: a warn variant for refusals (CLI text verbatim, no Undo, stays until × or the next outcome) and 9-32 warnings (an extra warn clause); toasts for the popover's bookmark verbs; a polite live region; reduce motion = no rise. Composer refusals stay in the composer (10-25). Depends on 10-9, 11-3, 10-6. See epics.md Story 10.23. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The toast follows DS Toast (36/26, warn and error tones, rise-and-fade motion from the tokens, hold 6.5 s paused on hover; fade only under reduce motion, decision 16.4); ⌘Z follows the three-place rule (16.7) and moves to 11-13, every undo ends in 'Undid <action> · Redo' (16.46; supersedes 'no toast after an undo'), the Redo tooltip is jj redo, F6 reaches the toast; supersedes '⌘Z while visible' and 'reduce motion = no rise' above.
  10-24-inspector-diff-view: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; the inspector is built to the design, decision (d); takes over the review workflow 10-8 parked, deferred-work "Epic 10's thin detail panel drops the design's review workflow"). Data via Epic 5's line-level path (5-6's note): one summary request per selection (kind, from_path, counts and fingerprint per file; jj diff -r semantics) + one diff request for the FOCUSED file, pinned to (operation, commit id), re-requested after each reload and selection change, nothing computed in Dart. Changes header "N files +a −r" + from the first viewed file "n/N viewed" / "✓ all viewed" with Mark all/Reset (IN:276-286; no meter bar, auto-advance or V shortcut); file rows gain ± and a viewed ✓ (dimmed path), a click focuses, the first file starts focused. Diff block = the focused file (IN:303-322; FC:222-228): path, Unified/Side-by-side icons, Viewed toggle; viewed folds to "Viewed — diff folded away. Click to show it again.". Hunk header 30 px on --accent-soft: @@ −old,n +new,m @@ in moon --hunk + 5-1's source symbol (jj's; none for Dart) + ±; lines unified (sigil + fills) or side by side (removed/added runs paired row by row, empty cells; 5-2's pairing AC), mono 11, long lines scroll in their hunk, no line numbers. Layout = one app preference shared with the Settings Diffs row (default Unified). VIEWED: NEEDS DESIGN, default adopted (decision (g)) = per repository, keyed by (change id, path, fingerprint of that file's changed lines): survives a rebase that leaves the file's changes alone, resets when they change (the design: localStorage per change id + path, SH:56-76). Placeholders (proposal): binary = "Binary file", conflicted = jj's materialized text. Tokens (decision (f)): hunk headers, M status, focus in moon. Non-goals: checkboxes (10-25/10-26), drags (10-27), word/syntax marks (5-2..5-4 later), line numbers, editing, a conflict view. Witnesses: totals = sum of counts; one diff request per focus, none for other files, none computed in Dart; side-by-side pairing (3 removed + 2 added -> 3 rows, 1 empty cell); a Rust symbol shows, a Dart one does not; Viewed folds/unfolds, survives a rebase that leaves the file's changes alone, resets on change, per repository; Mark all/Reset + counter; the layout persists and the Settings row changes it; the focused path survives a reload. Depends on 10-8, Epic 5 line-level (5-1, 5-5 without segments, 5-6 + its summary mode, 5-8), 11-1. See epics.md Story 10.24. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The hunk band (--hunk-bg, --hunk) and the M status are fixed data colours that never follow the accent (decision 16.43), hunk stats step up the secondary text rung (16.41), and read-only selection paints the highlight only (16.10).
  10-25-commit-split-composer-file-level: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; ships BEFORE Epic 5 and 10-26: file level = the CLI's filesets arm, decision (g)). File checkboxes on mutable changes (two states; mixed comes with 10-26) + select-all; @ starts all selected, others none (IN:166). Composer (IN:117-157) at the panel's bottom when @ has files / once a file is selected elsewhere, rises 12 px in 260 ms (none under reduce motion); 10-8's Summary/Details ("Summary of what you did" / "Summary of the selected changes"); result preview drawn like the graph, child on top ("@ New working copy · … · stays here to keep working" / "Rest · … · keeps “<subject>”"; below "Selected · … · “<first line>”" / "nothing yet" / "no description yet"; ± once 10-24 lands, file counts until then). Command preview = what runs: @ `jj commit -m … [<paths>]` (no paths when everything is selected), else `jj split -r <id> -m … <paths>`; the two -m paragraphs; an empty summary sends -m "" (the design drops -m, prototype defect 39). Buttons: Cancel (split only; clears the selection, keeps the draft), gold Commit/Split (⌘↩, Enter in Summary); validity per CLI (proposal): Commit needs a selected file; Split with EVERYTHING selected stays allowed with the CLI warning "All changes have been selected, so the original revision will become empty." as its hint (the design blocks it, prototype defect 39). Runs via 10-9 (commit -> 9-49 with paths, split -> 9-15 with paths); success clears, the selection follows MutationResult (commit -> the new @, split -> stays), 10-23 shows "Committed <id> · “…”" / "Split <id> — the rest is now <id>" + Undo, 10-20 flashes; a refusal keeps draft + selection. Drafts kept per change for the session, Esc on a non-empty draft only leaves the field (decision (g); the design drops them, prototype defect 38). SQUASH INTO PARENT enabled via 9-15 (squash -r): when 9-15's plan reports a combined description, 10-8's form opens pre-filled, Save runs with -m, Esc cancels (proposal; 10-9 open (e)); one non-empty description -> runs at once; -u/-k pass through; disabled reason = the backend's refusal (prototype defect 33); toast "Squashed <id> into <id>". Non-goals: hunk selection/tree arm (10-26), drags (10-27), --parallel and -o/-A/-B from the composer, a composer on an empty @. Witnesses: initial selection + select-all; commit all = no paths, a subset = exactly those paths, both "S\n\nD\n"; split -r + paths + -m, preview = call; Commit disabled with nothing selected, split-everything warns and runs; success/refusal rules; drafts survive a selection change and a reload, Esc leaves the field; squash with two descriptions -> pre-filled form + -m, with one -> at once; real cdylib: committing one of two changed files leaves the other in the new @. Depends on 10-8, 10-9, 10-23, 9-49 and 9-15 (paths); 10-24 for ± only. See epics.md Story 10.25. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The composer's motion comes from DS tokens/motion.css (fade only under reduce motion, 16.4), it takes the generic exit (16.40) and 11-11's Checkbox, and its command preview is complete and quoted (16.39).
  10-26-hunk-selection-gui-tree: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; the contract is 9-50's, decision (g)). Hunk checkboxes in 10-24's headers on mutable changes; file and select-all checkboxes become three-state (none/mixed/all); a selected hunk = 24 % moon header + 2 px moon bar on every line (decision (f)); @ starts with every hunk selected. A selection = a set of 9-50 keys (path + changed line ranges), re-mapped after every reload (surviving keys stay selected, others drop) — @ changes with every snapshot (9-26). Running: all selected files whole -> paths (10-25); any file partial -> select_tree (9-50), then the verb with the tree id (commit 9-49, split 9-15); the preview shows -i for a partial selection (as the design), no call carries an interactive flag. A stale refusal -> 10-23 shows it, the selection is re-mapped, the draft stays. Esc clears a non-@ change's selection before the panel closes. Non-goals: lines inside a hunk, diffedit (9-17), drags (10-27). Witnesses: three-state math; partial -> one select_tree + the verb with that id, whole -> no select_tree + paths; -i in the preview, never in a call; surviving keys stay selected after a reload that rewrote @; a stale refusal keeps the draft and re-maps; real cdylib: committing hunks 1 and 3 of a three-hunk file leaves hunk 2 in the new @. Depends on 10-24, 10-25, 9-50; 9-15/9-49 taking a tree id. See epics.md Story 10.26. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): A selected hunk is drawn in the accent role's tokens (header --accent-soft-hi, bar --accent-line; decision 16.43), kept apart from the hunk band, which is data.
  10-27-drag-files-and-hunks: backlog  # [UI] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; the engine is 10-10's, decision (a4); this story owns the diff payload, decision (g)). Sources on a mutable change: a file row (all its hunks) or a hunk header (grip on hover); inside a multi-selection (10-25/10-26) the whole selection travels; a click still focuses (10-10's slop). Payload diff = source change + selection (paths or 9-50 keys) + whole? + ± + label ("a hunk of x" / "N hunks of x" / x / "N files" / "N hunks from M files"). Ghost: status letter + file name or the hunk's symbol (or the label) + ±, "Drop on the change it belongs to" until a target, then the default row's command (a4). Lifted rows .38 + dashed moon outline; the source card's "from" state. Targets: any card except the source, immutable changes and the root; stacks inert; no edge targets (a4). Rows from 9-31's diff source (the UI never composes them), only applicable ones listed: "Move into this change" `jj squash --from A --into T <paths|tree>` (default), "Into a new change after" `jj split -r A -A T …` (only when T's children are all mutable), "Into a new change before" `jj split -r A -B T …`. Runs via 10-9: whole files pass paths, a partial selection passes 9-50's tree id, never -i; a combined description (9-15's plan) opens 10-25's form on the target first (proposal); 10-23 shows "Moved <what> into <T>" / "…into a new change after/before <T>" + Undo. Escape cancels without a call. Non-goals: change and bookmark drags (10-10), edge targets, a split -o row, hunks between files. Witnesses: a file row carries its hunks, a hunk in a multi-selection carries the selection, labels per case; source/immutable/root not targets, stacks inert; only the fake result's applicable rows, "after" absent with an immutable child; a plain drop runs "Move into this change"; paths vs tree id, never -i; lifted state during the drag, cleared after; Escape = no call; toast texts. Depends on