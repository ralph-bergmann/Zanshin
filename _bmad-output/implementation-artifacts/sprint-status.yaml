  11-14-zanshin-ui-package: done  # DONE 2026-10-17 (bmad-build-auto; spec-11-14-zanshin-ui-package.md): packages/zanshin_ui (pub workspace member) holds the tokens (lib/src/design/), the materials (lib/src/materials/), ZanshinIcon/ZI/IconRegistry/IconRegistryScope (lib/src/icons/), the Inter/JetBrainsMono/ShipporiMincho fonts and assets/icons/svg/ with its vector_graphics_compiler transformer (proved first for package assets: debug build + app and package tests); the app imports only package:zanshin_ui/zanshin_ui.dart (exports = the 14 names the app uses; the generated main.inject.dart is the one src/ import); ZsType families carry packages/zanshin_ui/ and an app test pins them against the bundle's FontManifest.json; IconRegistry loads with packageName 'zanshin_ui'; IconModule stays in app/lib/src/features/bootstrap/icon_module.dart; splash/main2 family literals -> ZsType; the app drops vector_graphics and vector_graphics_compiler (the transformer resolves through the workspace); tests moved to packages/zanshin_ui/test/{design,materials,icons,assets,helpers}; gate: Makefile test-ui/-analyze/-format + gate wrappers, gate_plan.rs UI group (zanshin_ui -> UI+APP, settings/shell* gain UI, design_system/ -> UI only). Splash/main-window renders identical before/after (inspector screenshots). Deferred: deferred-work.md "Surfaced in Story 11.14" (gate rules not checked against pubspecs; OFL notices, unverified). [UI] added 2026-10-17 (Ralph, console session after 11-1 and 11-2 landed; Claude builds it under 11-0's scope change). MOVES the DS layer out of app/: packages/zanshin_ui (pub workspace member, include ../../linter/flutter.yaml) takes app/lib/src/shared/design/ -> lib/src/design/, shared/materials/ -> lib/src/materials/, ZanshinIcon/ZI/IconRegistry/IconRegistryScope -> lib/src/icons/; the app imports only package:zanshin_ui/zanshin_ui.dart (implementation_imports enforces it). Moved, not rewritten: no change of behaviour or visuals. ASSETS move too (proposal): Inter/JetBrainsMono/ShipporiMincho and assets/icons/svg/ with its vector_graphics_compiler transformer; the ZsType family constants carry the packages/zanshin_ui/ prefix (fallbacks and the == monoFamily check keep working); IconRegistry loads AssetBytesLoader(..., packageName: 'zanshin_ui'). FIRST STEP proves the transformer for package assets (flutter_tools parses a dependency's assets through the same _parseAssets as the app's; a debug build + the package's flutter test load the registry); fallback: the SVGs stay in the app. Lottie and the Zanshin.ttf icon font stay in the app (11-10 deletes the font). DEPS: flutter, material_ui, vector_graphics, zanshin_settings (AccentSource), zanshin_shell (ShellTheme); never zanshin_core, inject_* or the app; IconModule (DI) stays in the app. TESTS move with their code (design/, materials/, zanshin_icon_test, shippori_subset_test, helpers zs_host + material_paints; setUpIconRegistry is copied because the app's bootstrap test keeps it); the DS parity test's paths follow. GATE: Makefile test-ui/-analyze/-format + gate-* wrappers; gate_plan.rs gets a UI group, packages/zanshin_ui/ -> UI+APP, the settings/shell/shell_macos/shell_pi rules gain UI, design_system/ -> UI only; the inline tests follow. WHY (Ralph 2026-10-17; supersedes 11-1 design question (a), "a package only once a second consumer outside the app appears"): the package enforces the dependency direction (it cannot import features/), the change-aware gate (d81ebd9) skips the DS tests on feature-only changes, and the move is cheapest before 11-11 adds the controls. Non-goals: several packages, moving app/widgetbook/ (needs the app's windows and features), shared/theme + commit_tags + mock_data (the mock UI, 11-10), moving AccentSource or ShellTheme. Depends on 11-1 and 11-2 (done); BLOCKS 11-11 (its controls go to packages/zanshin_ui/lib/src/controls/) and precedes 10-1. See epics.md Story 11.14.
