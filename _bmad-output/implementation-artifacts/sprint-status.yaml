  10-38-inspector-rebuild-split-layout: done  # DONE 2026-11-14 (build-auto; spec-10-38-inspector-rebuild-split-layout.md; commit ce0b31de; top part <= 48 % over a files/diff split, beside from 780 / above below 740, ZsSplitDivider with shares per layout in LayoutSettings, no max width for inspector and pinned panel, 3-line description clamp, Finder keys (arrows show the diff, 80 ms repeat pause, Space, V), one sideways scroll per file with pinned numbers and hunk headers (settles deferred I1), part checkboxes per hunk section; DS SplitDivider + DiffHunk parts + kit split; DS republish, Marionette check and a large-diff scroll measurement deferred, see deferred-work.md "Surfaced in Story 10.38"). ORIGINAL: [UI] Added 2026-11-14 (Ralph, console session; the rebuild planned 2026-11-12). DESIGN ROUND DONE 2026-11-14 (Ralph approved the mock-up design/Inspector Study.html, DESIGN-SYSTEM-SYNC #25; shared with 10-39): threshold 780/740 with hysteresis, divider 12 px with minimums files 110/220 and diff 140/320, defaults 0.38/0.34, description clamped to 3 lines, line numbers PINNED in the unified diff (settles deferred-work.md "Surfaced after the story loop 5.10") -- every line of a file as wide as its widest line and the hunk header as wide as the visible area, so numbers and part checkboxes stay at the left edge of short lines when scrolled fully right (Ralph found it in the study 2026-11-14; today each hunk scrolls on its own in inspector_diff.dart, the rule holds for whatever scroll unit the story builds); the #25 DS parts for 10-38 are this story's. WHY: with many files the list sits above the diff (scrolling up and down); the inspector stops at 720, the pinned panel at 440; arrow keys only move a highlight, return loads the diff. SCOPE (DECIDED, Ralph): (1) layout by inspector width -- narrow: files above, diff below; wide: files left, diff right; one threshold with hysteresis (proposal ~760); top part (header, title, meta, chips, actions) at natural height, the split fills the rest with two scroll areas, the composer stays at the bottom (today one scroll view, graph_inspector.dart:1043). (2) a draggable divider in both layouts (ZsResizeEdge), minimums, the ratio per layout remembered as a setting for all projects. (3) the description clamped to a few lines with Show more/less. (4) no fixed maximum width: inspector and pinned panel lose 720/440 (ZsMetrics.inspectorWMax/panelWMax, DS --inspector-w-max); 320 points of graph stay (shell_layout.dart); minimums stay. (5) Finder keys: up/down select a file and show its diff at once (_onKey :2105), a short pause while a key repeats (proposal ~80 ms; _focusSerial drops stale replies); Space toggles the pick on a mutable change, V toggles Viewed. (6) PARTS OF A HUNK (DESIGN-SYSTEM-SYNC #26): a hunk's parts = jj's builtin diff editor sections (Hunk.sections, selectTree keys; context 3 joins runs <= 6 lines apart); a hunk with more than one says "N parts", each part a checkbox in a gutter before the line numbers on its first changed line, the hunk checkbox three-state, picked lines with the accent edge; never single lines (DECIDED, Ralph: lines can break code); both layouts. NON-GOALS: the file rows and menus (10-39), a full-screen inspector. WITNESSES: one layout switch across the threshold, ratios survive a restart; 40 files: the diff stays in view while walking the list; drag past 720 until 320 of graph remain; Space and V work; picking the second of three parts commits only its lines, the hunk checkbox shows mixed; scrolled fully right, a line shorter than its neighbours keeps its numbers and part checkbox at the left edge; Marionette of both layouts vs the mock-up. Depends on 10.8, 10.24, 10.25, 10.26, 11.3 (done). See epics.md Story 10.38.
  10-39-inspector-rebuild-file-rows-copy-open: done  # DONE 2026-11-14 (build-auto; spec-10-39-inspector-rebuild-file-rows-copy-open.md; name-first file rows with a middle-cut folder (InspectorPathLabel), tree or flat (GeneralSettings.diffFileList, Changes header switch + Settings › Diffs row; joined one-child folders, folder rows with three-state checkbox and count, collapse for the session), ← → ↩ Space V ⌘C in the list, context menus on file rows, folders, diff lines (both layouts) and bookmark chips, copyable diff header path (also in the operation view), Open in Editor via Settings › General › Editor (idea / code / zed on the login-shell PATH or a custom command with {file} {line}; adoptedLoginShellEnvironment in zanshin_core), Reveal in Finder (open -R), disk checks and the @ note; settles the rest of deferred I1; DS FileRow + glyphs list-flat / list-tree + kit inspector, not published; IntelliJ checks, Marionette check and the adoption test deferred, see deferred-work.md "Surfaced in Story 10.39"). ORIGINAL: [UI] Added 2026-11-14 (Ralph, console session). DESIGN ROUND DONE 2026-11-14 with 10-38 (design/Inspector Study.html, DESIGN-SYSTEM-SYNC #25: rows, tree rows, switch, menus with hint and note); the #25 DS parts for 10-39 are this story's. USE CASE: Ralph changed code in IntelliJ, reviews it in Zanshin before the push, finds a mistake, wants to jump to that place in IntelliJ. SCOPE (DECIDED, Ralph): (1) file row: the name first and never cut, then the folder dimmed and cut in the middle; tooltip full path; a rename shows the new name, tooltip old -> new (today one path cut at its end, graph_inspector.dart:2412). (2) tree or flat: a two-icon switch in the Changes header, default in Settings > Diffs (GeneralSettings); tree joins one-child folder chains, folders collapse for the session only, left/right collapse/expand, up/down walk visible rows; on a mutable change a folder has a three-state checkbox picking its files. (3) copy: the diff header path copies the absolute path on a click like the ids (_CopyId, 10.30), also in the operation view; Cmd-C on the selected file row copies its absolute path; "Copy path" = absolute, as in Sourcetree. (4) context menus: file row = Open in Editor, Reveal in Finder, Copy path (Cmd-C), Copy relative path; folder = Reveal in Finder, Copy path, Copy relative path; diff line = Open in Editor at line, Copy path:line, Copy path (new-side number; a removed line takes the next new line); bookmark chip = Copy name. (5) Open in Editor only with a chosen editor: Settings > General > Editor = a detected launcher (idea, code, zed on the login-shell PATH, 9.36) or a custom command with {file} and {line} (IntelliJ: idea --line {line} {file}); without one the row reads "Choose editor..." and opens the setting; never the macOS default app; a failed start shows a toast. (6) Reveal in Finder: open -R <absolute path>. (7) these act on the working-copy file on disk: for a change other than @ that is @'s version and the line can be off (tooltip says so); a file missing on disk disables Open and Reveal with the reason. TO CHECK: IntelliJ Go to File with an absolute path:line; idea --line opens in the running IntelliJ. NON-GOALS: opening the change's own version, an editor per project, the layout (10-38). WITNESSES: automation_overview_page.dart shows whole in a 460-point inspector; tree and flat list the same files, the default survives a restart, a folder checkbox picks its files; each copy puts the expected text on the clipboard; a fake launcher sees idea --line <n> <path>; Reveal runs open -R. Depends on 10.38; 9.36, 10.24, 10.30 (done). See epics.md Story 10.39.
  10-40-inspector-follow-ups-first-use: done  # DONE 2026-11-15 (build-auto; spec-10-40-inspector-follow-ups-first-use.md; opaque pinned backings in the unified diff (codeBg over flBgSolid); ZsMenuAnchor draws RawMenuAnchor over an empty box, so every click outside a menu panel closes it and is consumed (a ZsMenuButton toggles, a click in the anchor area refocuses the opener) — for all menus; empty contextMenuBuilder instead of null; Split with everything picked shows only the hint and Cancel, draft kept; ProjectFiles.lineCount: a line past the file's end opens it at its start with a note, a removed last line opens at the last line; the diff options menu (inspector and operation view) checks the workspace's effective diff.color-words.context with a note when repo/workspace config sets it, picks still write --user; DS MenuButton flips above, DS kit composer matches the Split rule, not published; nothing deferred; Marionette check left to the console session). ORIGINAL: [UI] Added 2026-11-15 (Ralph, console session after his first use of 10.33-10.39 on real repos; Claude checked each finding against code, app log and jj CLI; Ralph accepted the proposals). SCOPE: (1) pinned line numbers / part gutter / fold-row numbers / pinned hunk header see-through: the backing is codeBg (42 % alpha) -> opaque base codeBg over flBgSolid, both themes (inspector_diff.dart _unified row()). (2) a click beside a context menu always closes it: RawMenuAnchor counts the anchor's child (the whole file list / the whole diff) as inside -> ZsMenuAnchor closes a position-opened menu on any click outside its panel, consumed; ZsMenuButton still toggles. (3) a right-click without a line handler (hunk header, gaps, fold rows, no-newline, conflict headers) crashes: SelectionArea contextMenuBuilder null -> selectable_region.dart:1397 null check, full-window error panel; the builder returns an empty widget; DECIDED (Ralph): such a right-click opens nothing. (4) splitsEverything: the composer fields, Re