  10-31-long-history-time-axis-minimap: done  # DONE 2026-11-06 (bmad-build-auto; spec-10-31-long-history-time-axis-minimap.md): Free cuts card-free stretches > 8 pitches to 1.5 in BackendGraphLayout's rows + GraphBreak strip/label; year-free day labels (cards keep the year), canvas + minimap years with sticky header; minimap width by columns, >= 2 px/pitch, scrolls with the canvas (windowed raster); shell column follows the card. Deferred (Low, deferred-work.md "Surfaced in Story 10.31"): home-page width wiring test, catalogue long-history use case, Marionette witness. HISTORY: [UI] DESIGN DONE 2026-11-06 (DESIGN-SYSTEM-SYNC #22, with Ralph): CAUSE measured on dart-intellij-third-party = collapsed stacks keep their hidden members' time below them (largest: 486 changes, ~64 screens), NOT commit-free gaps (Free damps them, max seen 227 px). Approach A (Ralph): any card-free stretch > 8 pitches shrinks to 1.5 pitches card to card = DS GraphBreak (torn strip over the lines, span label "6 years · Sep 2019 – May 2025", layout units, expanding the stack removes it, no 'show gap'). Day labels never carry a year; DayAxis years (canvas: above the day label where a year begins, not inside a break, not for one-year histories); minimap years top-down as section headers + sticky top header. Minimap width = 58 px labels + ~12 px per column (60–160), min density 2 px per pitch then scrolls in proportion (VS Code), measures the layout extent; break zigzags; day pill stays inside (item 6 dropped). Every minimap edge dotted alike on one grid, running into the dots (already FIXED in the app 2026-11-06: minimap_raster.dart / graph_minimap.dart). Stack list capped at 420 px, scrolls. Card 'Long history'; prototype ?history=long. HISTORY: NEEDS DESIGN, added 2026-11-03 (Ralph, console session: findings 3-5 of his look at the running app on dart-intellij-third-party, 4674 changes 2013-2025, after the story loop 10.16/11.7/11.8). DESIGN ROUND FIRST (DS + prototype in place, a DESIGN-SYSTEM-SYNC entry), then: (1) Free shortens a commit-free stretch taller than a threshold (proposal: one viewport) to a fixed height (~48 px) with a torn-paper edge and its length ("14 months"); lines run through; canvas, day axis, gap markers, go-to math and minimap share the one shortened y mapping (open: expandable?). (2) The minimap's width follows its content (more columns -> wider, up to a design-set maximum) instead of the fixed 118 px strip / 58 px label split, whose "Dec 16, 2015" labels are clipped today. (3) Day labels stay short; the year is its own label at each year boundary and sticks as a header while the minimap scrolls. (4) The minimap keeps a minimum density (~2 px per row/day) and scrolls beyond it, the band dragging it along (VS Code style). (5) OPTIONAL (Ralph): the day pill may reach left out of the glass card (OverlayPortal) only if simple and free of measurable frame cost. Non-goals: Compact's y mapping. Witnesses: gap at fixed height with marker + length and every view agreeing on y; minimap widens to its max; no clipped label, year labels at boundaries; long history scrolls the minimap; Marionette on dart-intellij-third-party vs the DS cards. Depends on 10-16, 10-3. See epics.md Story 10.31.
