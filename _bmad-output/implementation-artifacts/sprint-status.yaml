  10-1-graph-viewport-2d-virtualized: backlog  # [UI] added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. The production viewport every Epic 10 story plugs into, promoted from the POC and adapted to SEVERAL cards per row and per-node y. TwoDimensionalScrollView + custom RenderTwoDimensionalViewport overriding ONLY layoutChildSequence; both extents from DATA before any card is built -> exact scrollbars at 100k. Owns the abstract GraphLayout contract (accessors only; the spike's output fields mode/unit U/rows/colCount; node key = changeId, or commitId when hidden/divergent; col; row in 1/U pitch units with row 0 = oldest at the bottom; view facts incl. an app-side GraphRef for bookmarks (never a wire type) and parentCountOf (real parents incl. Missing -> merge glyph/tag, GD:56); lazy content; edges child/parent/kind direct|indirect/shape straight|merge|branch-off; buckets, elided (Missing parents from 4-10's topology; optional N only via a follow-up count call, never the layout or the topology), @, counts, op id) -- the view NEVER computes rows/columns/shapes/buckets/elided counts/free y. GraphMetrics maps columns to x (W 160-400 default 240, H 62/40, gaps 56/48, pad 56, radius 10, gutter 88 in Time, and in Free with 10-2's day axis if Free ships). VerticalLayout maps nodes to y: UniformRows top = pad + (rows - U - row) x pitch / U (U = 1 = the design GV:202; the engine's free output at U = 16 = the same mapping, no view-side y; a NEW HEAD SHIFTS EVERY CARD) + PerNodeTops for 10-13's gap variant and hand-made fixtures; visible set via a y-sorted index + binary search, NOT row arithmetic; ChildVicinity(col, node index). Research section 5 pitfalls: two axis-filtered material_ui Scrollbars (flutter#122348), weightedEvent, dx+dy wheel, Shift flip, scrollCacheExtent, own paint + ClipRectLayer with hooks background -> edges -> cards (z-order base < @ < selected < hovered/pinned, GC:73-77; dim via opacity at paint) -> overlay; CUSTOM delegate (key outermost, KeepAlive(pinned) always, real shouldRebuild, no per-build closures); anchor = node key + viewport offset on BOTH axes, re-applied on reloads, card-size changes and side panels (10-8 right, 10-14 left); a relayout may instead carry a reveal key (@ after a revset/mode switch, a picked bookmark; precedence per 10-5), consumed once and never re-armed, anchor = fallback; + reveal(centre|minimal); hit testing in reverse paint order; semantics clips; GraphTheme dark+light (demo host only). Pan-by-drag = a canvas-only recognizer for primary-mouse drags off cards/affordances (dragDevices unchanged, so card drags stay free for 10-10). Fake data = RECORDED layouts from the A/B spike's reference impl (design inputs incl. a CLI-faithful wq variant; fixture dumps medium-1k all() + a narrowed revset with indirect/Missing edges and large-10k all(); synthetic 10k/50k/100k incl. 100+ lanes + non-monotonic timestamps; free outputs; Missing parents from the input, N only for the design sample; small records committed, 10k-100k generated locally/in-test) + a layout invariant checker whose HARD invariants gate every fixture (unique keys, no dangling/duplicate edges, child >= one pitch above parent, no overlap in a column -- defects 3/6, SPEC I1/I2); 10-4's route invariant is only a counted report. Demo host exposes every view option. Open: scrollbar style (overlay vs the design's always-visible 10 px), demo host file. Optional split 10-1a / 10-1b (delegate + anchor). Depends on 10-0 + the spike's stages 2-3 (recordings). 2026-09-27: mode enum = free (default) | compact; recordings = compact + free x greedy + the compact order (the compact order from the spike's Dart binary); PerNodeTops for fixtures only (the gap variant is dropped); "Min. crossings" (optimized) is dropped, and the compact order moves columns only locally (SPEC 11.6). 2026-09-28 (design update): GraphLayout gains stack accessors (10-17); stack recordings from the spike's Dart (4-13) on the 36-commit sample + scale inputs; the checker gains 4-13's column invariant I7; a stack toggle = an anchored relayout (anchor = the toggled stack); callouts (10-6) are card-anchored widgets, the card pinned while open. See epics.md Story 10.1.
  10-2-canvas-background-time-gutter: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph named "Hintergrund" as its own piece), re-authored 2026-09-26 from the HTML design. Canvas #12162a/#f0ece7; dot grid 1 px every 24 px offset 4, anchored to the content, covering max(content, viewport), ONE draw call per frame. Time (and Free, see FREE DAY AXIS): sticky 88 px gutter painted above the cards with a canvas-base->transparent gradient; hits PASS THROUGH to cards (pointer-events:none -- replaces the old "absorb hits"); one mono pill per bucket centred on the bucket's OLDEST node; dotted guides (dash 2 6) in the gap below each bucket except the oldest, no height; content offX 88. Labels formatted by the view from the layout's bucket kind + value: ladder 10m/20m/40m/1h/2h/4h/8h/12h, then "Yesterday"/"Sep 23" from the bucket value with the engine's fixed offset (spike D7), so labels never disagree with buckets. The BUCKETING (rows) is 4-11's and needs every timestamp + "now" before layout; the clock's relayout is 10-5's. All y from VerticalLayout, so 10-13's gap variant reuses it. Not copied: prototype defect 3 (child older than parent). FREE DAY AXIS (Ralph's request 2026-09-26 while reviewing the spike viewer, built there the same day; item 9, if Free ships): the same sticky gutter in Free, one label per local day: "Today", "Yesterday", "Sep 24". The day is the local day of the CLAMPED time T (SPEC 4.2 free step 2), never the raw ts (raw ts put 418 of 2,951 labels out of order on synth-100k); it comes from the layout (4-11 OQ 9: free day buckets proposed, else sorted (row, day) pairs), never computed in the view. Label centred on the day's TOP card, dotted guide mid-gap above it, labels < 22 px apart pushed down; the day at the viewport top stays PINNED until the next label pushes it out (not in the design); free never relayouts on a tick: passing midnight re-formats the labels (a repaint), a new UTC offset is a relayout. Open: clock policy (freeze "now" per reload v