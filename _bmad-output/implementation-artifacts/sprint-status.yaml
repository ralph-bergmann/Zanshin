  9-4-file-reads-list-show-annotate-search: done  # DONE 2026-09-03 (commits 5159c1b + f77ecbf + 4c7f2b4): the four `jj file` read verbs, each through the FULL surfacing chain 9.3 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. All four mirror the CLI @v0.44.0's observable behavior: list is entries_matching projected into the CLI's own TreeEntry keyword set (path/file_type/executable/conflict_side_count) with NO refusals at all; show reproduces the two-branch shape exactly -- with exactly ONE path, path_value first (absent => PathNotFound), otherwise the entries_matching walk where an absent path simply contributes nothing (that asymmetry is the CLI's); annotate runs the two guards BEFORE FileAnnotator because jj-lib returns an EMPTY annotation for a missing file rather than an error; search splits `kind:pattern` on the FIRST colon (bare => regex) and re-splits each file with split_inclusive(b'\n') because jj-lib's match_lines yields no indices -- which is why the CLI re-splits too. SHARED RESOLVERS LIFTED, NOT COPIED: build_matcher + resolve_commit + resolve_or_wc moved from mutate.rs into op_support.rs behind a crate-internal ResolveError (resolve_commit generalized &MutableRepo -> &dyn Repo), thin mapping wrappers left in mutate.rs so the mutation verbs are byte-identical -- the alternative was a second copy of the empty-id panic guard, the divergence rule and the empty-string-is-root rule, which would drift on first touch. READS FOLLOW resolve_single_rev, NOT get_change: divergent => ChangeNotFound (the CLI's -r refuses ambiguity), which is exactly why resolve_commit was the one to lift. file show is the ONE verb that reads config (ui.conflict-marker-style, builtin default "diff" from cli/src/config/misc.toml, re-read per call, never cached) and therefore the only one that can answer jj.config_error -- a malformed style is the USER's config being wrong, not the repository. Annotate is PROJECTED not transcribed: origin_found keeps the Ok/Err "stopped outside the domain" distinction the CLI collapses to the root commit, and commit->change-id resolution is deduplicated per DISTINCT commit instead of the CLI's per-LINE get_commit_async. Schema gains its first [ubyte] fields (a tracked file is not guaranteed UTF-8), enum FileType, Payload slots 15-18, and AbsorbSkippedPath renamed to SkippedPath (WIP in-place edit, all callers updated in the same change). Error taxonomy: exactly ONE new row (jj.not_a_file -- "you selected a directory" needs a different remedy than "you mistyped the path"); everything else is "also emitted" clauses. test-helpers gains add_commit_with_entries over a File/Executable/Symlink spec -- the committed fixtures hold no executable, symlink or multi-file commit and regenerating them is forbidden, so file_type/executable/skip coverage was otherwise unconstructible. NOT DONE (deferred, 7 items): no working-copy snapshot (D2 -- an omitted revision is the LAST-SNAPSHOTTED @, Story 9.22 owns LockedWorkingCopy), missing-@ still reports jj.jj_lib_error not the registered jj.no_working_copy (shared verbatim with the mutation verbs, whose behavior an AC requires to stay byte-identical -- needs a crate-wide fix), FileSearch has no skipped channel so a GUI cannot tell "no match" from "blob unreadable" (the CLI warns there), docs/ffi-abi.md still stale since 4.9 (9.1/9.3 did not update it either), nameOnly reaches Rust unwitnessed by any Dart assertion (proving it needs committed file content no shipped verb can write from Dart), isolate.dart's dozen copies of the synthesized ffi.invalid_handle envelope, and annotate's missing root-commit fallback for an origin absent from the store (unreachable by any fixture). cargo make test green x3, verify-codegen clean, coverage 99.07%. Review: 11 patched (6 medium, 5 low) across two passes, 7 deferred, 14 rejected; followup_review_recommended=true. WAS ADDED: [R]