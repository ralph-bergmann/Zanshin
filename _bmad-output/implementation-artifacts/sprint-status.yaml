  10-10-graph-drag-and-drop: backlog  # [UI] PLACEHOLDER + NEEDS DESIGN, added 2026-09-26 (Ralph; not in the design -- refine once 9-31 is scheduled). Drag-and-drop per 9-31's decided UI shape; the design's canvas drag PANS (10-1's canvas-only recognizer), which leaves card drags free. Drag a card (ghost, reverse-paint-order hit testing, source KeepAlive-pinned), auto-scroll both axes; drop ON a commit (-o T) or an EDGE T->C (-A T -B C) via 10-4's point -> edge-SET lookup (a shared bus returns several edges: design); no gap zones. drop_actions(source, location) on hover-settle: debounced, one in flight, cached per (source, location) keyed by the layout's op id (10-12) or invalidated on every OpHeadsChangedEvent; each query snapshots -> 10-5 HOLDS reloads during a drag. Drop menu Available / NoOp / Refused-with-CLI-reason; runs via 10-9 (the verb's refusal stays authoritative). Alt = duplicate, Esc cancels. Blocked on 9-31 + 9-16 (+ 9-15/9-9/9-18). Open: ghost/highlight looks, which edge a shared bus targets, menu order, interdiff drop, multi-card drags. Depends on 10-1, 10-3, 10-4, 10-6, 10-9. 2026-09-28 (Ralph: cards AND bookmarks will be draggable later): BOOKMARK DRAGS join (legend pill, button, popover rows; a drop on a card = bookmark move/set via 9-19; --allow-backwards = a visible drop-menu choice, never a hidden default) -> the "no bookmark drops" non-goal is lifted. Already required now: click/double-click/drag start separated by the slop on cards, stack cards and bookmark controls; callouts close on drag start; the focus path pauses; the dragged card pinned. New open: a stack as source (-r over the run vs -s from the oldest) and as target (newest member vs expand on hover-hold), dragging a member out of the popover, a bookmark dropped on a stack splits the run. See epics.md Story 10.10.
