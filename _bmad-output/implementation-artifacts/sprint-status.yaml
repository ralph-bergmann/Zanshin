he pinned current day (deviation (c)). The canvas is the window-fixed --canvas behind the viewport; each day's label sits on the dashed divider below the day's oldest commit (the oldest day's below its first commit), >= 22 px apart pushed up, horizontally sticky right of the rail/pinned panel, a year outside the current year, placed from the engine's day buckets (GL:586-603). The minimap's pill (10-16) names the day at the viewport centre; (e) answered, (a)/(d) Claude's proposals, (f)/(g) engine questions. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The day axis's sticky label column follows 10-5's live left inset: 76 with no pinned panel or a collapsed one, else 76 + the panel's effective width (240-440, default 300) + 12 (decisions 16.22, 16.23).
