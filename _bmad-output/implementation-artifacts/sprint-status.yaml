  # --- Tier A (cheap) ---
  9-3-content-ops-restore-absorb: done  # DONE 2026-09-03 (commits 8a8eaed + 78b1054 + 9157be1 + 7076e0f): Epic 9's FIRST verb story, so the first to run the FULL surfacing chain (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty (zanshin-mcp is a 5-line stub, Epic 7 owns the tool surface -- the epic says "optional"). restore mirrors jj restore @v0.44.0 exactly: two-branch default resolution (the absent one of from/into becomes @; with NEITHER, the target is restored from its own parent tree), changes_in conflicts with from/into, check_rewritable BEFORE any tree work, reparent_descendants vs rebase_descendants, and the tree-id-equality no-op guard that runs BEFORE a transaction opens. absorb mirrors the non-interactive path over split_hunks_to_trees + absorb_hunks and KEEPS jj-lib's per-path skip reasons. Both refuse -- and both no-op -- WITHOUT writing an operation (no-op returns the pre-call head op id); restore needs the tree-id compare because a rewrite would mint a commit anyway, absorb uses the CLI's own !tx.repo().has_changes() guard. PARAMETER CURRENCY SPLITS BY KIND: single revision = ChangeId (house currency, epics.md 6.1), but absorb's --into is a REVSET STRING -- its CLI default mutable() is a dynamic alias and materializing the set into ids would destroy that (FR-JJ-17); the default resolves through the effective config layer (pinned: the immutable-destination test must widen `into` past mutable() before a tagged commit is reachable). restore reuses MutationResult; absorb gets a NESTED AbsorbResult (rewritten_change_ids / source_change_id / num_rebased / skipped_paths) because a silently unabsorbed file is a CLI warning the UI must be able to show. Error taxonomy REUSED not extended: 2 new MutateError variants map onto the already-registered jj.revset_parse_error / jj.revset_resolution_error, so docs/rust-error-codes.md gains only "also emitted" clauses and NO new row. Story 9.1's SelectedTree::from_paths is now live (it IS the restore primitive). NOT DONE (deferred, 6 items): no working-copy snapshot (D2 -- @ is the LAST-SNAPSHOTTED commit, which bites absorb hardest; Story 9.22 owns LockedWorkingCopy), paths are PrefixMatcher prefixes not filesets (9.4 can settle it for both), no interactive/hunk selection, no MCP, docs/ffi-abi.md still documents no mutation wrapper (predates 9.3 -- 6.5's six are missing too), missing-@ reports jj.jj_lib_error not the registered jj.no_working_copy (matches shipped sync_working_copy precedent; unreachable until workspace forget). cargo make test green x3, verify-codegen clean x2, coverage 99.05%. Review: 14 patched (5 medium, 9 low), 2 deferred, 12 rejected; followup_review_recommended=true. WAS ADDED: [M] restore (rewrite::restore_tree, whole-file) + absorb (lib/src/absorb.rs split_hunks_to_trees+absorb_hunks)
  9-4-file-reads-list-show-annotate-search: done  # DONE 2026-09-03 (commits 5159c1b + f77ecbf + 4c7f2b4): the four `jj file` read verbs, each through the FULL surfacing chain 9.3 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. All four mirror the CLI @v0.44.0's observable behavior: list is entries_matching projected into the CLI's own TreeEntry keyword set (path/file_type/executable/conflict_side_count) with NO refusals at all; show reproduces the two-branch shape exactly -- with exactly ONE path, path_value first (absent => PathNotFound), otherwise the entries_matching walk where an absent path simply contributes nothing (that asymmetry is the CLI's); annotate runs the two guards BEFORE FileAnnotator because jj-lib returns an EMPTY annotation for a missing file rather than an error; search splits `kind:pattern` on the FIRST colon (bare => regex) and re-splits each file with split_inclusive(b'\n') because jj-lib's match_lines yields no indices -- which is why the CLI re-splits too. SHARED RESOLVERS LIFTED, NOT COPIED: build_matcher + resolve_commit + resolve_or_wc moved from mutate.rs into op_support.rs behind a crate-internal ResolveError (resolve_commit generalized &MutableRepo -> &dyn Repo), thin mapping wrappers left in mutate.rs so the mutation verbs are byte-identical -- the alternative was a second copy of the empty-id panic guard, the divergence rule and the empty-string-is-root rule, which would drift on first touch. READS FOLLOW resolve_single_rev, NOT get_change: divergent => ChangeNotFound (the CLI's -r refuses ambiguity), which is exactly why resolve_commit was the one to lift. file show is the ONE verb that reads config (ui.conflict-marker-style, builtin default "diff" from cli/src/config/misc.toml, re-read per call, never cached) and therefore the only one that can answer jj.config_error -- a malformed style is the USER's config being wrong, not the repository. Annotate is PROJECTED not transcribed: origin_found keeps the Ok/Err "stopped outside the domain" distinction the CLI collapses to the root commit, and commit->change-id resolution is deduplicated per DISTINCT commit instead of the CLI's per-LINE get_commit_async. Schema gains its first [ubyte] fields (a tracked file is not guaranteed UTF-8), enum FileType, Payload slots 15-18, and AbsorbSkippedPath renamed to SkippedPath (WIP in-place edit, all callers updated in the same change). Error taxonomy: exactly ONE new row (jj.not_a_file -- "you selected a directory" needs a different remedy than "you mistyped the path"); everything else is "also emitted" clauses. test-helpers gains add_commit_with_entries over a File/Executable/Symlink spec -- the committed fixtures hold no executable, symlink or multi-file commit and regenerating them is forbidden, so file_type/executable/skip coverage was otherwise unconstructible. NOT DONE (deferred, 7 items): no working-copy snapshot (D2 -- an omitted revision is the LAST-SNAPSHOTTED @, Story 9.22 owns LockedWorkingCopy), missing-@ still reports jj.jj_lib_error not the registered jj.no_working_copy (shared verbatim with the mutation verbs, whose behavior an AC requires to stay byte-identical -- needs a crate-wide fix), FileSearch has no skipped channel so a GUI cannot tell "no match" from "blob unreadable" (the CLI warns there), docs/ffi-abi.md still stale since 4.9 (9.1/9.3 did not update it either), nameOnly reaches Rust unwitnessed by any Dart assertion (proving it needs committed file content no shipped verb can write from Dart), isolate.dart's dozen copies of the synthesized ffi.invalid_handle envelope, and annotate's missing root-commit fallback for an origin absent from the store (unreachable by any fixture). cargo make test green x3, verify-codegen clean, coverage 99.07%. Review: 11 patched (6 medium, 5 low) across two passes, 7 deferred, 14 rejected; followup_review_recommended=true. WAS ADDED: [R] MergedTree::entries_matching/path_value + conflicts::materialize_tree_value; blame via annotate::FileAnnotator
  9-5-git-local-sync-remote-config: done  # DONE 2026-09-03 (commits d624b82 + 2ff631b): the six `jj git` sync + remote-config verbs through the FULL chain 9.3/9.4 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. All six live in ONE new noun module per side (zanshin-jj/src/git.rs, zanshin-ffi/src/git.rs) -- the CLI groups them under cli/src/commands/git/, and splitting `git remote add` from `git remote list` would have cut the family in half; remotes.rs (list + fetch, 100.00%) is untouched. TWO STRUCTURAL FACTS DROVE THE DESIGN: (1) jj-lib's four remote mutators call save_git_config() which writes the git config to DISK immediately but leaves the loaded GitBackend's gix config cache stale -- so every one of them RELOADS the workspace afterwards (clone_into steps 2-3 + remotes_write.rs::register_remote already documented this), on the FAILURE path too, because the config is written before the git-ref edits that can still fail; without it `list_remotes()` on the SAME handle would not see the change, which is an AC not a note. (2) import_refs calls record_abandoned_commit, so git_import resolves the immutable expression against tx.base_repo() and rebases descendants BEFORE committing (the CLI's own tx.finish step) or Transaction::write panics on outstanding rewrites. CLI PARITY @v0.44.0: the has_changes() guard applies to all five tx verbs (the CLI's tx.finish has it; add's lack of an EXTRA guard is not its absence), set-url opens NO transaction at all, the reserved remote `git` is removable/renamable but writes NO operation, rename validates the NEW name BEFORE reporting the OLD one missing, and set-url with both URLs absent succeeds even for a missing remote (jj-lib's own early return). THE COLOCATED SKIP IS DELIBERATELY NOT PORTED: the CLI refuses import/export there because its own workspace_helper already imported and its finish_transaction already exported -- premises Zanshin structurally lacks (D2; export_refs was called NOWHERE in the crate before this story), so porting the guard would make both verbs useless in exactly the repos that need them; pinned by both_sync_verbs_do_real_work_in_a_colocated_workspace. FAILED REFS ARE PAYLOAD, NOT ERRORS: import carries failed_ref_names and export carries per-ref reasons as the FLATTENED source() chain (jj-lib hides gix's real cause behind #[source]), because the CLI warns and exits 0 and nothing in repository state lets a caller re-derive them; GitRefUpdate reproduces cli/src/git_util.rs:404-460's own derivation, with `tracked` read from the POST-import view. Error taxonomy: TWO new codes (jj.remote_exists -- the remedy is "use set-url"; jj.remote_nonstandard_config -- jj-lib's own save_remote writes `pushurl`, which its own remove_remote then refuses, so add-with-push-url-then-remove is a plausible FIRST GUI session) plus MutateError::NotAGitRepo reusing the registered jj.not_a_git_repo, widened from "this PATH" to "this WORKSPACE has no git backend". config.rs gains git_import_options: git.abandon-unreachable-commits / .record-synthetic-predecessors come from the EFFECTIVE config (both already resolve through jj-lib's builtin misc.toml, so no BUILTIN_CONFIG_TOML entry) -- hardcoding them would decide for the user (FR-JJ-17). NOT DONE (deferred, 8 items): no jj repo-config rewrite on remove/rename (the CLI edits .jj/repo/config.toml's [remotes.<name>] + trunk() alias; config.rs is deliberately read-only -- a trunk() alias pinned to a renamed remote keeps naming the old one, pinned by a test), no remotes.<name>.auto-track-bookmarks (same empty map git_fetch/clone_into already pass), no duplicate-URL warning, no absolute_git_url CWD resolution, push_url is WRITE-ONLY (zanshin_jj::Remote carries only the fetch url -- widening it changes the shipped Remotes payload), "no git backend" maps to jj.remote_not_found for git_fetch but jj.not_a_git_repo for these six, and git_fetch/clone_into still hardcode the two import-option booleans git_import now reads from config. cargo make test green x2, verify-codegen clean x2, coverage 99.11%. Review: 13 patched (5 medium, 8 low), 4 deferred, 14 rejected; followup_review_recommended=true. WAS ADDED: [M] git import/export + remote add/remove/rename/set-url (git::import_refs/import_head/export_refs/add_remote/remove_remote/rename_remote/set_remote_urls); remove/rename also rewrite repo config (Story 2.9 pattern)
  9-6-read-views-show-evolog-interdiff: done  # DONE 2026-09-04 (commits 45cb285 + f387632 + c908c86 + afcc540): the three commit READ views through the FULL chain 9.3/9.4/9.5 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. One new noun module per side (zanshin-jj/src/commit_views.rs, zanshin-ffi/src/commit_views.rs) -- `ViewError` was already taken by view.rs, hence CommitViewError. THE DIFF HALF IS A PER-PATH CHANGE LIST, NOT HUNKS: epics.md names exactly Commit::parent_tree + MergedTree::diff_stream for this story, and those produce (path, before, after), which the CLI classifies into A/M/D/C/R (diff_util.rs:1871-1896); line/word-level diffing is Epic 5 (zanshin-diff, all backlog) and will EXTEND these payloads, not replace them. The shipped FileChange/ChangeKind vocabulary and the shipped Change table are REUSED, never re-spelled: change.rs::change_offset and status.rs::file_changes_vector were extracted (the build_mutation_result move 9.5 made) so `ShowEntry.change` is byte-identical to what zanshin_change returns, and Dart got matching mapChangeTable/mapFileChangeTable so a future Change field cannot reach one decoder only. PARAMETER CURRENCY SPLITS BY KIND (9.3's rule): show/evolog take a revset STRING because their CLI form is a SET whose aliases must survive config resolution (FR-JJ-17, parsed per call, never cached); interdiff takes two owned ChangeIds -- which inherit resolve_single_rev's ambiguity REFUSAL but NOT its address space: a commit hex, a revset expression and a HIDDEN commit are all unaddressable through a change id, where the CLI accepts all three. CLI PARITY @v0.44.0: show unions its revsets and defaults to @, has NO path argument (EverythingMatcher is hardcoded) and accumulates copy records over EVERY parent -- so a git-backend rename is ONE Renamed entry; interdiff refuses when BOTH --from/--to are absent (the ArgGroup ... required(true)) and passes CopyRecords::default(), so it NEVER reports a Renamed/Copied for the same pair show does -- that asymmetry is the CLI's and is pinned by a test; evolog applies -n/--limit as take(n) in WALK order (the CLI limits before reversing) and drops --reversed + the TopoGroupedGraph re-ordering as rendering the GUI does itself; evolog --patch is not ported because it IS an interdiff of each entry's predecessors -- but note the review found that composition is NOT expressible today, since those predecessors are hidden and interdiff's change-id currency cannot address them (deferred). evolog rows carry COMMIT ids (every predecessor shares the change id, and predecessors are hidden by construction) plus an operation_id that is null-for-absence exactly for the walk's FLUSH TAIL -- the only signal an evolution may be truncated, which the CLI leaves silent. Error taxonomy: ZERO new codes, only "also emitted" clauses on nine rows. TWO SPEC ROWS WERE WRONG AND ARE CORRECTED IN THE SPEC'S CHANGE LOG: (1) a bare DIVERGENT change-id symbol is RevsetResolutionError::DivergentChangeId inside jj-lib's SymbolResolver (revset.rs:2827), so `jj show <divergent-id>` refuses in the CLI too -- parity means refusing it as jj.revset_resolution_error, still a different refusal from interdiff's jj.change_not_found, and both commits stay addressable by their commit hexes; (2) a commit created by new_commit still carries an EMPTY predecessor record, so the flush tail is reached via the ROOT commit, not via the oldest version of a rewrite chain. NOT DONE (deferred, 11 items): no textual/line diff, no --stat/--git/--color-words (Epic 5), no evolog graph mode or --reversed (the GUI's own graph), no MCP tool (Epic 7), no working-copy snapshot (D2 -- an omitted revision is the LAST-SNAPSHOTTED @, Story 9.22), docs/ffi-abi.md still stale since 4.9 (9.1/9.3/9.4/9.5 did not update it either), and 6 review findings: interdiff cannot address a hidden predecessor so evolog+interdiff do not compose, show is unbounded (one envelope, per-parent copy-record stream + full tree diff per entry), InterdiffView carries no signal that rebase_to_dest_parent left conflicts in the computed base tree, a missing @ still reports jj.jj_lib_error not jj.no_working_copy (shared with 9.4, crate-wide), request tables are structurally interchangeable (no file_identifier, house-wide since 9.3), and evolog's start set is unbounded with no per-start grouping. cargo make test green x3, verify-codegen clean x2, coverage 99.13% overall: zanshin-ffi/src/commit_views.rs 100.00, zanshin-jj/src/commit_views.rs 95.63 -> 98.13, repo.rs 95.74 -> 95.97; no baseline lowered, no exclude_prefix added. WAS ADDED: [R] show (Commit::parent_tree+MergedTree::diff_stream), evolog (evolution::walk_predecessors), interdiff (rewrite::rebase_to_dest_parent) Review: 9 patched (2 medium, 7 low), 6 deferred, 14 rejected; followup_review_recommended=true. The patches: interdiff's address space corrected at every layer (the docs claimed resolve_single_rev parity on WHAT is addressable, not just on the ambiguity refusal); EvologEntry.change's divergent + is_anonymous documented as CURRENT-view derivations, not that version's; evolog's negative-limit guard moved to the CALLING side (in the worker isolate it came back as internal.dispatch_error, not the documented ArgumentError); and four verification gaps closed -- interdiff's two symmetric map_err closures were only exercised on the from side (a copy-paste slip to res(e, from) passed the whole suite), the absent-vs-explicitly-empty revset distinction had no witness, the uint saturation clamp was documented in four places and asserted in none, and jj.config_error was registered for evolog but only witnessed through show.
  9-7-workspace-reads-list-root: done  # DONE 2026-09-04 (commits 006b56c + 9aee860): the two workspace READ verbs through the FULL chain 9.3-9.6 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. One new noun module per side (zanshin-jj/src/workspace.rs, zanshin-ffi/src/workspace.rs) -- view.rs's own doc drew the line this story crosses ("the path lives in the WorkspaceStore, not the View"), so list_workspaces COMPOSES on top of the shipped view::list_working_copies rather than widening WorkingCopy; the two shapes stay distinct (WorkingCopy = raw View row, WorkspaceEntry = the jj workspace list row). THE STORY IS THE CLI'S OWN ASYMMETRY, REPRODUCED NOT SMOOTHED OVER: `workspace list` DEGRADES (every path-side failure -- store load, store read, absent entry, canonicalize -- collapses to root: None so a broken path can never fail the listing, commit_templater.rs:1787's dunce::canonicalize(..).ok()) while `workspace root --name` REFUSES with three distinct user_errors (root.rs:50-72), each minted as its own code because the remedies differ (jj.workspace_not_found = pick another; jj.workspace_no_recorded_path = predates jj 0.38, nothing to do; jj.workspace_path_unresolved = the directory moved, offer to forget it in 9.13) -- collapsing the last two would force a GUI to string-match `context`, which AR-P-4 forbids. resolve_root(None) reads the LOADER alone (no repo load, no store read, root.rs:78) and is the one path that cannot fail; resolve_root(Some(<the current workspace's OWN name>)) can still refuse, because the named path never shortcuts to the loader -- pinned by a test on both the jj and FFI layers. NAMED resolve_workspace_root, not workspace_root: the infallible &Path accessor has a production call site that cannot absorb a Result (zanshin-ffi/src/repo.rs arms the watcher with it); api_stability pins both signatures side by side. ARGUMENT ARITY IS THE CLI'S: `list` takes NOTHING (-T is rendering) so zanshin_workspace_list is HANDLE-ONLY -- the first read verb since remotes with no request buffer, which is why workspace_ffi.rs needs a second fn-pointer alias for the shared guard table; `root` takes one OPTIONAL long-only --name, so it gets a WorkspaceRootRequest buffer (absent = current workspace; a present EMPTY string is a VALUE and refuses as not_found). std::fs::canonicalize replaces the CLI's dunce:: (identical off Windows, no new dep) -- consequence: every path assertion canonicalizes BOTH sides (/var -> /private/var). TRAPS PINNED BY TESTS: SimpleWorkspaceStore::load is NOT a pure read (it CREATES workspace_store/ and writes an empty store on a legacy repo, workspace_store.rs:117-125) but writes NO operation; a missing/corrupt index is an Err, never Ok(None), so the two map to different codes in `root` while `list` flattens both; stored paths are relative to .jj/repo, not the workspace root. FIXTURE STALENESS IS A TEST ASSET: tiny-3-commits records `default` -> the GENERATOR's temp dir, so the shipped fixture is a free witness for BOTH halves of the asymmetry -- regeneration is forbidden and would destroy it. NOT DONE (deferred, 8 items): no workspace MUTATION (add/forget/rename/update-stale are 9.13/9.23), no MCP tool (Epic 7), no templates/-T/root.relative()/CWD-relative shortening (the GUI formats), `list` is widened past the CLI on a store-READ failure (the CLI's template property would propagate it; here it degrades like every other path failure, so a corrupt store cannot make a GUI unable to enumerate workspaces at all), a repo initialised through a path containing a symlink (macOS /var temp dirs) records a store entry relative to the NON-canonical .jj/repo while every read joins onto the canonical one, so its own root reports as absent -- a jj-lib/init-path interaction, out of this story's read-only scope, worked around in the tests with a documented canonicalize; plus three carried forward: request tables are structurally interchangeable (no file_identifier, house-wide since 9.3, and WorkspaceRootRequest makes the collision with ShowRequest exact), docs/ffi-abi.md still stale since 4.9 (9.1/9.3/9.4/9.5/9.6 did not update it either) and no working-copy snapshot (D2) -- which now affects a shipped payload COLUMN, since wc_commit_id is the LAST-SNAPSHOTTED @ where the CLI's `workspace list` snapshots first. cargo make test green x2, verify-codegen clean, coverage 99.15% overall with BOTH new files at 100.00%; no baseline lowered, no exclude_prefix added. WAS ADDED: [R] View::wc_commit_ids + WorkspaceStore::get_workspace_path Review: 9 patched (1 medium, 8 low), 4 deferred, 13 rejected; followup_review_recommended=true. The patches: no test opened the SECONDARY workspace, where .jj/repo is a FILE and Workspace::repo_path() resolving that indirection is the join base for every store lookup (deriving it locally left the whole suite green while every root went absent from that side); workspaceRoot's interior-NUL guard moved to the CALLING side (in the worker isolate it came back as internal.dispatch_error, not the documented ArgumentError -- the same fix 9.6 made for evolog's limit); and six verification gaps closed -- both store-LOAD failure branches shipped unpinned because `load` never reads the index (a dangling symlink at the store path makes it fail deterministically via EEXIST), jj.jj_lib_error had no witness at the FFI layer, the BTreeMap-order assertion was satisfied by insertion order too (a workspace named `aaa` added LAST now pins it), the "ABSOLUTE and canonicalized" promise was unverified because every assertion canonicalized both sides, the null-root decode and jj.workspace_no_recorded_path had no end-to-end cdylib witness, and WorkspaceEntry.wcCommitId's Dart doc referenced a WorkingCopy type that exists only in Rust.
  9-8-bookmark-crud-create-delete: done  # DONE 2026-09-04 (commits 93a1504 + 2bb36ac): the two cheapest bookmark MUTATIONS through the FULL chain 9.3-9.7 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. Supersedes part of deferred 6-9. One new noun module per side (zanshin-jj/src/bookmark_ops.rs, zanshin-ffi/src/bookmark_ops.rs) -- the shipped bookmarks.rs stays the pure READ with its own minimal BookmarkError, exactly as remotes.rs reads and git.rs mutates; one module per error taxonomy. ZERO new payload tables and NO union Payload change: both verbs return the shipped MutationResult, because which bookmarks are gone is answered by re-reading zanshin_bookmarks (ADR-0002) and the one fact a re-read cannot supply -- "did anything happen at all" -- is already the contract's pre-call-head new_op_id. THE SHARED TRANSACTION SKELETON MOVED: `struct Finished<T>` + `finish_or_no_op` went from git.rs to mutate.rs as pub(crate) (it was never a git concern -- it is the shape EVERY verb that may legitimately write nothing takes), git.rs's four call sites re-pointed; a second copy beside the bookmark verbs would have been a second, desyncable spelling of the no-op arm. PARAMETER CURRENCY SPLITS BY MEANING (9.3/9.6's rule): create's -r is resolve_single_rev, so it is an owned ChangeId that inherits the ambiguity REFUSAL but not the address space (no commit hex, no revset, no hidden commit), while delete's patterns are pass-through STRINGS because the pattern KIND is the parameter's meaning (FR-JJ-17). Create NAMES are DECODED values, not CLI argument text -- revset quoting ('foo bar', 'foo@bar') is terminal input syntax the GUI replaces (ADR-0003); the one behavioural residue kept is parse_symbol's empty-name refusal, which no CLI spelling avoids. OP-LOG PARITY IS BYTE-LEVEL (NFR-R-2): `create bookmark {names} pointing to commit {full hex}` with names in ARGUMENT order, `delete bookmark {matched names}` in VIEW (lexicographic) order, both rendered with RefName::as_symbol() -- the ONE place as_symbol is right, since the description is a rendering; every payload name still crosses as as_str. TWO NEW ERROR CODES, kept apart because the REMEDIES differ (the jj.remote_exists precedent): jj.bookmark_exists (the bookmark is there -- MOVE it with `bookmark set`) vs jj.bookmark_tracked_remote_exists (deleted-but-not-yet-pushed -- recreate with `bookmark set` or disassociate with `bookmark untrack`); collapsing them would force a GUI to string-match context, which AR-P-4 forbids. TRAPS PINNED BY TESTS: a BARE delete pattern is a GLOB, not an exact name (a bookmark literally named `foo*` AND one named `foo1` both match `foo*`; only the literal matches exact:"foo*"); a delete matching NOTHING is a SUCCESS that writes no operation and returns the PRE-CALL head (the machine-readable form of "No bookmarks to delete."), never a refusal; create's per-name loop is FAIL-FAST, so a run whose second name already exists creates nothing -- not even the first -- which the intuitive "create what you can" behavior would also have passed a naive suite; has_tracked_remote_bookmarks skips the default-ignored remote `git`, so a colocated foo@git does NOT block create while an untracked foo@origin does not either and a TRACKED one does; deleting a local bookmark prunes only remote rows that are themselves ABSENT, so a tracked name@origin SURVIVES and list_bookmarks keeps reporting it -- jj's "deleted, propagates on the next push" state, not a leak (`bookmark forget` is 9.11's); a CONFLICTED local bookmark deletes like any other; create on the ROOT commit succeeds, as in the CLI. NO manual rebase/normalize pass: set_local_bookmark_target calls View::add_head (clearing the head-normalized bit) but records no rewrite, and MutableRepo::consume() normalizes inside Transaction::write. Remote-tracking state is built IN-TEST with test_helpers::set_remote_bookmark -- fixture regeneration stays forbidden (tiny-3-commits has zero bookmarks, medium-1k-commits 29 local ones). NOT DONE (deferred, 7 items): no AUTO-TRACKING on create -- the CLI honours remotes.<r>.auto-track-bookmarks / auto-track-created-bookmarks by calling track_remote_bookmark, the verb Story 9.11 owns (deliberately deferred, not dropped); no other bookmark verb (set/forget/track/untrack are 9.11, move/advance/rename and `bookmark list` filters are 9.19); no MCP tool (Epic 7); no terminal UX (the CLI's "Target revision is empty.", "Created N bookmarks pointing to ...", "Deleted N bookmarks.", "No bookmarks to delete." and warn_unmatched_local_bookmarks are all stdout chatter the GUI replaces); plus three carried forward: docs/ffi-abi.md still stale since 4.9 (9.1/9.3-9.7 did not update it either), no working-copy snapshot (D2 -- an omitted revision is the LAST-SNAPSHOTTED @, Story 9.22), and request tables are structurally interchangeable (no file_identifier, house-wide since 9.3 -- BookmarkDeleteRequest is now a single-vector table like several others). cargo make test green x2, verify-codegen clean x2, coverage 99.21% overall with BOTH new files at 100.00%; mutate.rs 97.32 -> 97.91 (the skeleton move carried git.rs's two uncovered sync/no-op error branches into it, so abandon's previously unwitnessed PLURAL description -- `abandon commit <first> and <n-1> more`, argument order -- got the test it had always lacked), git.rs 98.87 -> 99.55, repo.rs 95.97 -> 96.13; no baseline lowered, no exclude_prefix added. WAS ADDED: [M] bookmark create + bookmark delete (MutableRepo::set_local_bookmark_target with RefTarget::normal/absent, View::local_bookmarks_matching, revset::parse_string_expression) Review: 12 patched (4 medium, 8 low), 7 deferred, 14 rejected; followup_review_recommended=true. The patches: BOTH verbs loaded the head TWICE -- each read it to build its op-log description (create for the target's commit hex, delete for the matched names), dropped it, and finish_or_no_op then loaded again and ran the guards and the writes against that SECOND view, a window the CLI does not have (it has one load per invocation) and one that matters because FR-MCP-9 has an external jj CLI or MCP process mutating the same repo: a delete could commit a description naming bookmarks it never touched, which is exactly the byte-level parity this story rests on -- finish_or_no_op now splits into a thin loading wrapper plus finish_or_no_op_at(workspace, readonly, ..), git.rs's four call sites untouched; a malformed delete pattern shipped only the wrapper prefix plus e.kind(), which is the same "Invalid string pattern" for EVERY bad pattern, while the error registry already promised jj-lib's own reason -- the reason is now kind + the FLATTENED source() chain, deliberately not a flatten of the whole error (its Display is a pest caret diagram, terminal rendering the GUI replaces), with the exact strings asserted at both levels and a negative assertion that the diagram never appears; and four tests asserted less than their names claimed -- the bare-glob test passed a QUOTED pattern so the trap was unproven at verb level, `revision` never crossed the Dart worker seam in a PASSING test (every create either omitted it or carried an interior NUL the calling-side guard rejects first, so deleting `revision:` from the dispatch arm, the command or the ObjectBuilder left the whole gate green while `bookmark create -r <commit>` would silently target @), the create reader's absent-names path and the documented "an explicitly empty revision is a VALUE, not an absence" claim had no witness at all, and two FFI refusals did not assert the unchanged head op id the contract promises. Plus six doc/comment fixes: the tracked binding's comment explained it by a borrow that does not exist, the `# Errors` bullet said `revision` refuses when "absent" in a paragraph where ABSENT applies the -r default, Finished's field docs still described git-only callers after the move, the dropped RevsetDiagnostics had no rationale, and the advertised ~/&/| pattern operators had no witness. Deferred from review (7): the two request tables verify interchangeably and this is the FIRST story where the colliding `names` vectors mean OPPOSITE things (exact names vs glob patterns), session_from_handle is now a fourth verbatim copy in zanshin-ffi, six copies of the Dart request-buffer helpers, the non-git arm of has_tracked_remote_bookmarks runs unasserted (a tracked name@git DOES block create on a native backend), MutationResult's other three fields are asserted nowhere for either verb, the same "absent revision" doc ambiguity survives on the 9.3/9.4/9.6 surfaces, and docs/ffi-abi.md.
