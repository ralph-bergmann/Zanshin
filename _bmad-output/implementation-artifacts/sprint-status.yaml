  10-16-graph-minimap: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph's idea while reviewing the spike viewer: a minimap for big repos -- and how does it perform?; the viewer then built one to measure it; the design has none). At 100k one scrollbar px spans ~170 rows -> a strip with a raster of the whole graph, the viewport as an overlay, click/drag to jump. RASTER once per layout (and per strip resize / card size / VerticalLayout / theme change, debounced), OFF the UI isolate: a pure-Dart function (no dart:ui) over the columns, the VerticalLayout tops (UniformRows and PerNodeTops alike), the card size, 10-4's edge runs, the marker nodes, colours as ints and the strip's device size: card rectangles into a 2-D difference array (4 corner updates), edge runs into 1-D difference arrays, one prefix-sum pass, a log LUT counts -> alpha; O(n + E + pixels), exactness below a strip px not required; operation-bound markers baked in (viewer: @ gold line, bookmarked cards blue); RGBA Uint8List (~1.4 MB at 222x1546). WHERE it runs = (f): RECOMMENDED option A, an app-side Isolate.run over the materialized layout arrays + VerticalLayout tops (no 4-11 change -- its Non-goals exclude pixel geometry and 10-5's request carries no card size --, the one worker isolate stays free, works on recorded layouts from the start; inputs copied in once, pixels back via Isolate.exit); option B, a separate worker command with zanshin_core geometry params, needs dated amendments to 4-11 (item 9, Non-goals, Related), 10-5 item 2 and 10-12, occupies the worker and cannot serve PerNodeTops. UI: decodeImageFromPixels once per raster in its own RepaintBoundary; the viewport rectangle (+ full-width band?) is a CustomPainter repainting from Listenable.merge(scroll controllers) -> scrolling = 0 rasters, 0 card builds; click/drag = 10-6 item 11's jump mechanics (a drag is instant; a click animates only if 10-6 (d) says so), a user scroll that selects nothing. PROPOSED, not built in the viewer and not in its budget: the selection + go-to-change hits painted by the overlay. VIEWER BUDGET (Chromium, DPR 2, 222x1546 device px, raster on the page's main thread): raster median 1.4-3.9 ms from 22 to 99k nodes (a rerun later the same evening ~2x slower: medians up to 5.0 ms, one synth-100k series 5.7-7.9 ms, single renders up to 11 ms, 18 ms right after a strip resize; ~6.6 MB typed arrays per render), scrolling with the minimap <= ~0.4 ms more main thread per frame (within noise), overlay update 1-3 us, no dropped frame. Open (NEEDS DESIGN): placement/size/default/toggle (10-7?) and the right edge shared with 10-8's panel, scale (whole graph fitted vs a fixed scale that scrolls), markers + colours in both themes (built: @, bookmarks; proposed: selection, hits; @ lineage? hover? Free's days?; baked colours vs tinted alpha planes), rectangle vs band, click selects? hover tooltip?, the raster path (A vs B), VoiceOver. Depends on 10-1, 10-4, 10-5, 10-6 (10-7 for a toolbar toggle); no backend story on option A. 2026-09-28: rasters the GROUPED layout (a collapsed stack = one card, 10-17); a stack toggle = a new layout -> re-raster via item 6. See epics.md Story 10.16.
  10-17-commit-stacks-view: backlog  # [UI] added 2026-09-28 (Ralph, design update, export a399daf; the engine half is 4-13; runs on the spike's stack recordings until 10-12). STACK CARD (GV:536-555, GC:228-232 @a399daf): a card's size, slotted RenderBox (10-3's pattern), stacked look (two offset layers); detailed = count badge + NEWEST member's subject / id range newest..oldest (2 bold + 3 dim each) + authors' first names + date range + conflict flag if a member conflicts; compact = one line; a CLICK EXPANDS (respects the drag slop); no selection/double-click/bookmark control/"..."/"+"; the focus path passes through it. POPOVER (GV:556-568, GC:233-239) via 10-6's hover-callout controller: 380 ms, below the card (above if no room), rows newest first (id, subject, date) + "Click to expand N changes", each row opens 10-6's commit callout after 180 ms beside it; LARGE stacks: capped height + scrolling + rows loaded as visible (proposal accepted; the design is unbounded = defect 19). BRACKET (GV:661-665, :800-806, GC:240-245): 7 px, 16 px left of the column along an expanded run; a collapse button (stack-collapse icon) on hover of the bracket or a member; painted by the viewport, the button hit-testable, the pan skips it. TOGGLE = a new layout request (10-5), 4-13 keeps every column; ANCHOR, not centre (proposal accepted; the design centres the middle member): the toggled stack keeps its screen position, members unfold upwards / fold back; expand fades the members in over 260 ms (opacity 0, -6 px, scale .98), paint-only, no animation under reduce motion. DEFAULTS: all runs collapsed except runs of mutable ancestors of @ (proposal accepted); "Group stacks" = 10-7's app-global switch (default on); user toggles persisted PER REPO keyed by the oldest member (the design persists one global list = defect 18); a changed oldest member -> the default. INTERPLAY: go-to-change into a collapsed stack expands it in the same relayout (keepOpenKeys); bookmark pick / locate @ never target a member; a run holding the selection never collapses by itself, a user collapse clears the selection (defect 20); the counter counts collapsed members as shown; the minimap rasters the grouped layout; content for all members of a visible stack (10-11). GraphLayout accessors: stack nodes (key, member range), membership, expanded runs for the bracket. Witnesses: card texts from the members; one request per toggle, the stack keeps its viewport position, no column change (I7); popover/row-callout delays + the nested hover chain; a 500-member popover capped/scrolling/visible rows only; the 260 ms fade, none under disableAnimations; defaults + per-repo persistence; go-to-change expands; a user collapse clears the selection; the counter. Depends on 10-1, 10-3, 10-5, 10-6 (10-7 for the switch; 4-13's spike step for the recordings); real data via 10-12 + 4-13. See epics.md Story 10.17.
