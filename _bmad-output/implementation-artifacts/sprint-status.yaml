er collapsed layout. Depends on 4-11 + 4-10 (its spike step needs only the spike). 2026-09-30 (design update, e243dd2): the export's 52-commit sample adds the gap cases, and its groupStacks now counts a child behind a gap and requires a Direct parent (GV:264-276), as the run rule does -> the oracle can move to that sample and then reaches gaps (check at build time that the design's gap walk, which keeps transitive indirect edges, yields jj's edges there; the hand-built gap cases stay); the animation is 10-20's now. See epics.md Story 4.13. DESIGN UPDATE 2026-10-14 (export e74ced3): the export now freezes the all-collapsed graph's columns (members take their stack's column) and still re-packs when the freeze is invalid in either layout or on the Group-stacks switch. Decision (b) keeps this story's columns (ungrouped base, a toggle never moves a column, I7 unchanged); with 4-14 the ungrouped columns become the joint Free+Compact packing. The run rule, Free's stack rows (gap carry-over = §4.8 (F)) and the @-ancestor default are kept.
