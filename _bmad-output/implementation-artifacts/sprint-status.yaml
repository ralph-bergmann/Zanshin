  11-7-settings-window: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). One 620 px glass sheet with tabs General | <project>; ⌘, toggles it (a no-op over the Projects dialog), also opened from the Project menu and View options; the scope lines show 9-28's configPath paths (never hardcoded); every jj row shows its config key and the effective value + source. GENERAL: Theme (the existing appearance.themeMode), Density (new; scales the base size; open: keep it -- recommended), Hide controls (new, default on; gates 11-3's calm), Diff layout (new, Unified by default; 10-24), Identity user.name/user.email at the user scope via 9-28 (shows the working-copy-author fact; the target of 9-27's identity_missing). PROJECT: git.fetch / git.push selects of remotes() (open: list/pattern values since jj 0.46 -> read-only TOML text + Edit… -- recommended), "Check for remote changes" Off/5/15 min (default 15; drives 11-8's 9-24 poll; the export's "Fetch automatically" promises a real fetch), Trunk = revset-aliases."trunk()" written as <name>@<remote> like the CLI's own writer (+ Custom…), Immutable heads = revset-aliases."immutable_heads()" (a broken value -> 10-5's revset error + the previous value offered back), a repo-scope user.email switch (set/unset). Writes of trunk()/immutable_heads()/revsets.log feed 10-5 item 16 (one re-request under the anchor). Witnesses on a fake config port. Depends on 11-2, 11-3, 11-5, 11-8; 9-27/9-28 done. See epics.md Story 11.7. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Settings becomes a window of its own on 11-12 (key settings, 620 wide, shrink-wrapped height, title = the tab label; decisions 16.13, 16.42 d); ⌘, opens or activates it on the tab shown last and never toggles (16.14); General gains 'Accent colour: Follow macOS · Zanshin' (16.2) and Theme Paper · Night (16.11); Zs controls (16.1). Depends on 11-12, 11-11, 11-13.
