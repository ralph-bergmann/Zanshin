  10-14-bookmark-list-panel: backlog  # [UI/bridge] PLACEHOLDER + NEEDS DESIGN, added 2026-09-26 (Ralph, re-plan from the HTML design): THIN by default, because the design extraction lists the left side panels among the not-final dialogs/popups (open: exempt or not). The design's 290 px left "Bookmarks" panel (GV:481-497): rows from RepoHandle.bookmarks() (FR-JJ-8), which today returns only local + TRACKED remote entries with a target change id -- no synced/conflicted flag, untracked remotes dropped (bookmarks.dart:26-67). Until 9-29: states local/remote only, and NEVER a "synced" derived by pairing entries (a local rewrite keeps the change id but moves the commit); the design's own hidden example release/1.5.x@origin (GD:21) is an UNTRACKED remote and cannot be listed before 9-29. Cards/detail chips still show synced from the graph's view facts. Row: glyph, name(@remote), "id(2 bold+6) · subject", state; rows whose target is outside the current layout dimmed to .55; a pick selects + centres the commit and, if hidden, switches the revset to all() and reveals it (not @) in the relayout the switch produces -- an explicit reveal beats the @ re-centre (10-5) -- and no later relayout jumps to @ (the prototype re-arms the @ re-centre at GV:538, defect 1). Exports Bookmark/BookmarkKind/LocalBookmark/RemoteBookmark. Mount point (nav rail = Ralph's shell) is Ralph's call; the demo host shows it. Not copied: a hidden-bookmark pick PERMANENTLY rewrites the persisted revset (prototype defect 10 -> open). Open: switch persistence, subjects of hidden targets (content call vs show), conflicted bookmarks, sort order, mount point, a divergent target (keyed by commit id, so indexOfKey(changeId) misses), thin vs exempt. Depends on 10-5, 10-6, 10-7; 9-29 for untracked-remote rows, synced/conflicted and ahead/behind. See epics.md Story 10.14. DESIGN UPDATE 2026-10-14 (export e74ced3): renamed 'Bookmarks in the floating rail' and built to the design (decision (d); PLACEHOLDER and NEEDS DESIGN dropped): a hover preview in 11-3's callout (the count, the first 5 rows, '+N more' pins, a row click picks) and a pinned 300 px glass panel over the graph (left inset 388, no card moves); rows, the .55 dimming and the pick are unchanged, rows drag bookmarks (10-10), and 'diverged' + distances come with 9-29. (a) answered: the switch to all() is visible and reversible in the search field ('$ all()', ✕ back to the default search) and persists per repository (Claude's proposal); (b)-(f) get Claude's proposals (the content call for hidden subjects, a conflict mark + the first target, sort by name, divergent = the first commit in the layout), and (g) is answered by decision (d). The rail's mechanics, Workstreams/Reviews (hidden) and the Undo Timeline belong to 11-3 and 11-9. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The pinned panel is drag-resizable 240-440 (default 300) with the collapse and flyout rule (decisions 16.22, 16.23); Workstreams are DROPPED, not hidden (16.26; Reviews stays hidden); rows show jj's prefix (16.35), the empty state uses the DS copy (16.44), the list is built from Zs controls and follows the stale and inactive states.
  10-15-action-popups-placeholder: backlog  # [UI] PLACEHOLDER, added 2026-09-26 (Ralph, re-plan: the design's dialogs/popups are NOT final and will look different -> build thin, invest nothing in polish). Wires the design's popups to 10-9's runner with minimal material_ui overlays anchored to the (pinned) card: quick-action fan from "..." (Edit / Describe... / Squash into parent (disabled until 9-15) / Abandon; static list, "later from user settings"); "+" chips (top = newChange([this]); bottom = new --insert-before DISABLED "no backend verb yet"); bookmark popover (list with state -- synced from view facts, ahead/behind/untracked need 9-29; Create + Delete via 9-8; Rename / Move / Move existing disabled until 9-19); describe editor in the panel (subject + body, Enter done / Esc discard, dirty indicator, Discard / Done editing -> describe ONLY when changed; the prototype persists nothing + leftover "jj edit ... Working copy moved here" hint, defect 13). Fan and popover open on click here (the prototype: hover or keyboard focus, GC:116-117, :143-144). Open (later redesign): all visuals, hover/focus vs click for fan + popover, subject/body composition, unsaved describe edits on a selection change (the prototype silently discards them, GV:540) or on a reload that rewrites the commit. Depends on 10-3, 10-8, 10-9. 2026-09-28 (design update): the bookmark popover opens on HOVER + keyboard focus, no delay (GC:118 @a399daf), via 10-6's hover-callout controller, to the RIGHT of the card at the control's height (above the control near the right edge, GC:116-117); the quick-action fan opens on hover too (proposal accepted) -> open (b) answered for both; the rest stays placeholder. See epics.md Story 10.15. DESIGN UPDATE 2026-10-14 (export e74ced3): retitled "Card action menu (••• and right-click) and the thin bookmark popover": the fan and the "+" chips are retired, and one menu (••• toggles it, a right-click opens it at the pointer; New change on top / Insert after / Insert 