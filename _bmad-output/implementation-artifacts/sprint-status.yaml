  10-9-action-runner: backlog  # [UI/bridge] NEEDS DESIGN, added 2026-09-26 (Ralph) as 10-9-action-dialogs; renamed in the 2026-09-26 re-plan: the design has NO dialogs, it triggers verbs from double-click, panel header/row, quick-action fan, "+" chips and the bookmark popover and shows no feedback. Implements 10-5's GraphActions port = ONE runner every affordance calls. Shipped verbs: edit, describe, newChange([id]) (new on top), abandon, bookmarkCreate/Delete, undo; backlog -> affordance disabled with reason: squash 9-15, rebase 9-16, bookmark rename/move 9-19, new --insert-before/-A (NO backend story; 9-31 previews it). Offers every param the shipped verb exposes, pre-filled with CLI defaults (missing flags = deferred backend gaps). Pending state on affected cards (serial worker); anchored reload via 10-5; MutationResult + FinishFacts facts; ONE surface for CLI-worded refusals, 9-32 warnings and 9-35 precondition/warnings; Undo only while opLog head == newOpId (else dropped; real fix 9-12); abandon never confirms (CLI parity). Exports MutationResult/FinishFacts. Open: reveal new @ after new/edit, feedback surface, undo affordance, shortcuts, and once 9-15/9-16 land: Squash's combined description (the CLI's $EDITOR case; 9-15 must surface jj-lib's combined message) + Rebase...'s target picking (click a card/edge via 10-4's lookup, or 10-10). Depends on 10-3, 10-5. See epics.md Story 10.9. DESIGN UPDATE 2026-10-14 (export e74ced3): the triggers are now double-click, the top bar's New change, the card menu (10-15), the inspector's action row, title-as-describe and composer (10-8, 10-25), drops (10-10, 10-27) and the toast's Undo (10-23); new verbs are commit (9-49), split with paths or a GUI tree and -A/-B, squash -r and --from/--into (9-15), duplicate (9-9), bookmark move/rename (9-19) and new -A/-B (9-48). Answered: (a) after new the new card is revealed only if off-screen, edit reveals nothing; (b)/(c) by 10-23's toast; (e) the squash message = 10-8's Summary/Det