  11-20-density-spacing-tokens: backlog  # [UI] NEEDS DESIGN, added 2026-11-03 (Ralph, console session: "eine Design-Runde, dann eine Story"; deferred-work "Density has no tokens", 11.7 design question (a)). 11.7 built Settings > Density (Compact/Balanced/Comfy) as a text scale only (12.5/13/13.5 px); no DS component reads it. DESIGN ROUND FIRST: which tokens change per density (row heights, paddings, graph card size, island heights, gaps) and by how much; the DS gets three token sets and its cards show all three. zanshin_ui carries the sets; the app switches them live in every window; the graph's card metrics follow (router geometry stage only). Non-goals: per-window density, a custom scale. Witnesses: each density changes the named tokens (widget test); graph card size follows; Marionette per density vs the DS cards. Depends on 11-7, 11-14. See epics.md Story 11.20.
  11-21-immutable-untracked-remote-refs: done  # DONE 2026-11-03 (bmad-build-auto; spec-11-21-immutable-untracked-remote-refs.md, commit 50685c0): CommitRef/TopologyRef carry the CLI's `tracked` keyword (remote: RemoteRef::is_tracked, local: false) over FlatBuffers; the Immutable page's untracked_remote_*() hints filter on !tracked; deferred I1 fixed; nothing deferred. HISTORY: [UI/bridge] added 2026-11-03 (Ralph, console session: "Tracking-Info lesen"; deferred-work "Surfaced in the closing run of Story 11.7"). The Immutable page's untracked-remote hints infer "untracked" from TopologyRef.synced ("tracked and agrees"), so a tracked remote ref that moved away from its local target is named untracked (immutable_heads.dart _untrackedRemote). The bridge reports each remote ref's tracking state (an `untracked` flag on TopologyRef or a read of its own) from jj's view (RemoteRefState), bookmarks and tags; schema + codegen; the page filters on it. Witnesses: Rust test -- a moved tracked remote bookmark reads tracked, an untracked one untracked; the page names only the untracked one; parity oracle unchanged. Depends on 11-7. See epics.md Story 11.21.
