  4-12-graph-topology-wire-lazy-dart-view: done  # [R/bridge] added 2026-09-26 (Ralph), RE-PLANNED 2026-09-26: the layout runs in Dart (4-11), so the wire carries 4-10's TOPOLOGY instead of lane rows; landing lanes, pass-through segments and segment identity belonged to the lane model and are dropped. Today zanshin_graph_slice = a table per row, per edge (hex target string) and per pass-through lane (~175 B/node, 1.75 MB at 10k per spikes/ffi-payload-bench), decoded eagerly (graph.dart:373-433) and copied twice (readToken's Uint8List.fromList + the SendPort copy; ffi-abi.md:951-954 wrongly says once). (1) A GraphTopology payload (in GraphSlice's Payload union slot iff the slice is removed, else appended): operation_id, all_count; per node the ids + a flags byte (working_copy/immutable/hidden/divergent/root/change_offset presence) + change_offset + both prefix lengths + parent_count; edges as CSR (edge_start, edge_target = node index, edge_kind; the target is defined iff kind != Missing, null in Dart; the Missing target id is DROPPED); timestamps [long] present iff requested (the root's slot is 0 and ignored, null in Dart); sparse TopologyRef tables {node, bookmark|tag, name, remote absent = local, synced, conflicted} (not GraphRef: 10-1 reserves that name app-side) + working copies; anchors CSR. The spike's ~22 B/node estimate included priority + ts -> re-measured. Ids: Rust display strings vs fixed-stride bytes + stride + Dart hex/reverse-hex pinned by a test vs Rust -- decided by MEASUREMENT (payload bytes, Rust build, Dart first access; large-10k loose + packed, one local real repo's all(), 100k synthetic exploratory). Benches: crates/zanshin-ffi/benches/graph_wire.rs + a Dart script outside test/. (2) New extern zanshin_graph_topology(handle, GraphTopologyRequest {kind, revset, prioritize, short_prefixes, anchors, with_timestamps}; RequestKind GraphTopology appended; envelope.fbs:62's count 27 -> 28), precondition + warnings on its envelope. (3) Lazy Dart GraphT