tory 11.7. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): Settings becomes a window of its own on 11-12 (key settings, 620 wide, shrink-wrapped height, title = the tab label; decisions 16.13, 16.42 d); ⌘, opens or activates it on the tab shown last and never toggles (16.14); General gains 'Accent colour: Follow macOS · Zanshin' (16.2) and Theme Paper · Night (16.11); Zs controls (16.1). Depends on 11-12, 11-11, 11-13. DESIGN UPDATE 2026-10-26 (console session, DS #12/#13): Settings gets PAGES (SettingsRow onOpen navigation row -> SettingsPage with '‹ <project>', ⌘[, the window title = the page name; a page belongs to its tab); History's 'Immutable heads' text field becomes the page 'Immutable commits' (ImmutablePage: Built in = the 4 builtin_immutable_heads() switches, Also immutable = others (trunk().. & ~mine()) / bookmark chips / custom revset, Result well with the TOML + count + heads, Reset). Claude's proposals: chips written as present(<name>); custom revset written on ↩/blur only once revsetCounts(cap 0) resolves it; Reset = configUnset at repo scope; the effective alias is read back and mapped onto the controls; count = revsetCounts('::immutable_heads() ~ root()', cap 10000). Card menu's 'Immutable commits…' (10-15) opens it. Depends also on 10-3 (HatchSwatch) and 9-25.
