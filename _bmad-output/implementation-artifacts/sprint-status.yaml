  4-13-commit-stacks-layout-engine: done  # [bridge] added 2026-09-28 (Ralph, console session on the design update, export a399daf). The updated design collapses LINEAR RUNS of commits into one stack card (GV:227-264 @a399daf) and re-runs the whole layout on every toggle (GV:651-652) -> the lanes re-pack and branches jump sideways (measured, default revset, all collapsed: settings col 5 -> 3, iOS 3 -> 1 under Min. crossings; riverpod 5 -> 1 under greedy). DECIDED (Ralph 2026-09-28): a toggle -- and switching "Group stacks" -- NEVER changes a column (intended deviation (f)); the graph MAY compact vertically. The view never computes rows, so grouping is engine work. RUN RULE (in the worker): candidate = not root, not any workspace's working copy, no bookmark (local/remote) and no tag, real parent_count 1 with a Direct edge (parent in the revset), exactly one child layout edge (Direct or Indirect); run = maximal chain, each member the only child of the previous; breaks where immutable changes; >= 2 members = a stack, keyed by its OLDEST member's key; conflicts do NOT break a run (the card shows the conflict flag). Tags, other workspaces' @ and conflicts-don't-break = Claude's proposals, accepted. REQUEST (4-11's layout command): stacks flag (off = 4-11's output byte for byte), expandedKeys/collapsedKeys (user toggles, persisted per repo by 10-17), keepOpenKeys (selection, pending go-to-change target); default = collapsed EXCEPT runs of mutable ancestors of @ (walked from @ over the layout edges); explicit > default, keepOpen > both, unknown keys ignored. COLUMNS from the UNGROUPED layout (4-11's rows + packing + compact/greedy order); a stack takes its NEWEST member's column (members normally share one; one known split: the oldest member continues its parent's lane beside the parent's merge reservation). ROWS from the GROUPED graph (SPEC 4.2 per mode) + per-column ordering constraints (segments keep their ungrouped order + the one-row buffer) -> vertical moves only, no