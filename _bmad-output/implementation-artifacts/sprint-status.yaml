  10-1-graph-viewport-2d-virtualized: backlog  # [UI] added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. The production viewport every Epic 10 story plugs into, promoted from the POC and adapted to SEVERAL cards per row and per-node y. TwoDimensionalScrollView + custom RenderTwoDimensionalViewport overriding ONLY layoutChildSequence; both extents from DATA before any card is built -> exact scrollbars at 100k. Owns the abstract GraphLayout contract (accessors only; the spike's output fields mode/unit U/rows/colCount; node key = changeId, or commitId when hidden/divergent; col; row in 1/U pitch units with row 0 = oldest at the bottom; view facts incl. an app-side GraphRef for bookmarks (never a wire type) and parentCountOf (real parents incl. Missing -> merge glyph/tag, GD:56); lazy content; edges child/parent/kind direct|indirect/shape straight|merge|branch-off; buckets, elided (Missing parents from 4-10's topology; optional N only via a follow-up count call, never the layout or the topology), @, counts, op id) -- the view NEVER computes rows/columns/shapes/buckets/elided counts/free y. GraphMetrics maps columns to x (W 160-400 default 240, H 62/40, gaps 56/48, pad 56, radius 10, gutter 88 in Time, and in Free with 10-2's day axis if Free ships). VerticalLayout maps nodes to y: UniformRows top = pad + (rows - U - row) x pitch / U (U = 1 = the design GV:202; the engine's free output at U = 16 = the same mapping, no view-side y; a NEW HEAD SHIFTS EVERY CARD) + PerNodeTops for 10-13's gap variant and hand-made fixtures; visible set via a y-sorted index + binary search, NOT row arithmetic; ChildVicinity(col, node index). Research section 5 pitfalls: two axis-filtered material_ui Scrollbars (flutter#122348), weightedEvent, dx+dy wheel, Shift flip, scrollCacheExtent, own paint + ClipRectLayer with hooks background -> edges -> cards (z-order base < @ < selected < hovered/pinned, GC:73-77; dim via opacity at paint) -> overlay; CUSTOM delegate (key outermo