  10-3-commit-cards: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph), re-authored 2026-09-26 from the HTML design. Slotted RenderBox card (splash_card_render.dart pattern), fixed W x H, ellipsis. Detailed H 62: subject 13/500; meta line @ badge (gold, wc only), id (◆ if immutable non-root, 2 bold + dim rest to 8 chars, 5 on @), author FIRST name, relative committer date (minute tick, 0 builds), italic "empty", amber conflict, merge glyph (parentCountOf >= 2, Missing parents included, GD:56 -- not the layout edge count). Compact H 40: one line. States per GC:72-94: hover, selected (accent + 3 px ring), working copy (gold border/tint/rings/glow; + selected = blue outer ring, no drop glow, GC:76), immutable (muted subject), root (mono; no bookmark control/"..."/bottom "+", keeps top "+"); DIM (.4) is painted by the viewport from 10-6's focus set. Bookmark control on the TOP border: button mode or legend pill (Always|On hover option) showing shortBookmark(first): JIRA key bold / prefix + bold last segment, @remote, +N, order prefix-main-@remote-rest-+N (GV:326-330); bookmarks arrive as the app-side GraphRef view fact, never a wire type. "..." always visible bottom-right; "+" chips (jj new / jj new --insert-before) only on hover; child box = card + overhang (>= 11 px top and bottom, >= 13 px + shadow at the bottom if 10-15's fan is drawn in-card, GC:142), but ONLY the card rect + affordance slots hit (the empty margin reaches the canvas pan / edges, as GV:564); HOVER IS PAINT-ONLY (RenderBox listens + markNeedsPaint: 0 builds); selection via per-key Listenables (select A then B = 2 builds); W 160-400 step 10 default 240 + Detailed default on = pixel remap + anchor. Not copied: dimming on empty CHANGE (defect 14), legend covering rightward branch-off exits (defect 8), no-op `hov` class. Open: placeholder vs empty-change style, legend placement, fixed 2 bold vs CLI shortest prefix, author fallback, undesigned states (divergent/hidden/conflicted+unsynced bookmarks/other workspaces/pending), tags, lead bookmark, relative-date format (GD pre-formats now/40m/1h/20h/1d/3d/Sep 19 with no rule). Depends on 10-1. 2026-09-27: defect 8 (the legend over rightward branch-off exits) disappears with 10-4's top-centre exit -> open (b) answered by moving the exit point. 2026-09-28 (design update): "..." and the EMPTY bookmark button appear ONLY ON HOVER (GC:135-136 @a399daf; filled buttons + legend pills stay visible), hit only while hovered; the card's tooltip is gone (its text = 10-6's callout hint line); glyphs from the export's icons/ui (8 SVGs missing in app/assets/icons/svg -> copy + map; Ralph's icon font); the stack card is 10-17. See epics.md Story 10.3.
  10-4-graph-edges-rounded-routes: backlog  # [UI] NEEDS DESIGN, added 2026-09-26 (Ralph) as 10-4-graph-lines-edges-elbows; renamed in the 2026-09-26 re-plan because the per-row lane-line model + colorIdx colour pass are OBSOLETE (research section 5's colour pitfall is moot). One orthogonal polyline per parent edge, shape from the layout source (4-11 = the spike's route/blocked): straight (same column), merge (up the parent's column to 0.4 gapY BELOW the child, across, up), branch-off (out of the parent's top at +-0.28 W, up to 0.4 gapY ABOVE the parent, across, up; siblings share the bus); corners r=10 clamped; 1.5 px --edge; indirect dashed 3 5. Crossing hops (Bridge gap default | Plain): 12x10 gap cut into the HORIZONTAL at strict-interior crossings, computed PER VISIBLE WINDOW against a whole-layout index of vertical runs (no O(E^2) all-pairs). Elided marker: dashed 38 px stub + "~ N elided" label (gold on @'s lineage), bottomExtra 44; Missing edges come from 4-10's topology, N (if kept) from a follow-up count call (the layout outputs neither, SPEC section 0/3). @ lineage = ALL ancestors of @ (bitset per layout), gold 2.25 px + glow, painted last; hover/dim from 10-6 (hov --edge-hov, dim .28 fading 160 ms). Virtualized (research section 5): interval index over edge y-extents, horizontal culling, one Path per style, all y from VerticalLayout (engine free mode + 10-13's gaps work unchanged); point -> SET of edges lookup for 10-6/10-10; edge identity = index (defect 6). Route invariant (no segment behind a non-endpoint card, no collinear overlap except shared buses) added to 10-1's checker as a COUNTED REPORT, not a gate: the spike keeps blocked-merge routing (defect 2, D9, open SPEC 11.4; e.g. 229 blocked merges on synth-10k compact/greedy) and free-mode buses may pass behind cards (D8) -> counted per kind/mode for 10-13, fails only hand-built unit cases; a gate for the row modes once 4-11 fixes D9. Open: "~ N elided" vs jj's bare "~" (+ ui.log-synthetic-elided-no