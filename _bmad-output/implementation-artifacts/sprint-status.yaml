  11-9-undo-timeline-panel: backlog  # [UI/bridge] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). The rail's Undo Timeline (11-3): the preview = the 3 newest operations "description · when"; the pinned panel = a timeline, newest first, the moon dot on the current op, snapshots dimmed, paged through the shipped opLog(limit:) (2-7/3-4b). The export shows CLI command lines, which jj stores only for CLI ops (the args tag); Zanshin writes none by design (op_support.rs:679-681) -> show the description, plus the args tag once 9-21 exposes tags. ACTIONS through 10-9: Undo on the newest op (9-39, the same verb as 10-23's toast, the CLI's refusals verbatim); Redo / Show changes (9-21) and Restore to here (9-12) disabled until their stories land (recommended). It reloads on OpHeadsChangedEvent and names the op's workspace once 9-21 exposes it. Open: the actions before 9-12/9-21 (Undo only -- recommended), the "142 ops" count (none until 9-21 offers a cheap one -- recommended). Exports Operation + the undo result. Depends on 11-3, 10-9, 10-23; 9-21, 9-12 backlog. See epics.md Story 11.9. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The panel follows the three-place undo rule (decision 16.7) and ends an undo in the 'Undid <action> · Redo' toast (16.46); no Undo after jj op abandon; the current op's dot takes the accent role (16.43); the panel is drag-resizable like every pinned panel (16.22, 16.23).
  11-10-retire-docked-mock-ui: done  # DONE 2026-10-30 (spec-11-10-retire-docked-mock-ui, commit 9a7f3c6): mock UI, ZanshinColors, Zanshin.ttf, ZI.workstream, main2/3/4 + graph_poc/ and the yaru dependency (Ubuntu fonts) gone; NamiIndigo.icon has the DS's three wave layers stroked in gold (Dock check is Ralph's); DS manifest parity test lists the components open stories still own; the DS icon bundle's solid-fill crescents -> deferred-work. [UI] added 2026-10-14 (Ralph, console session on the floating-client export e74ced3; Claude builds it under 11-0's scope change). Deletes the docked mock UI that the running app no longer shows (home = the Yaru test page; the mock hangs only on a commented-out HomePage): shell/app_shell.dart, main_nav_rail.dart, status_bar.dart, window_title_bar.dart; history/, branches/; commits/ (card, detail, diff block) + shared/widgets/commit_tags.dart; projects/home_dialog.dart (11-6 replaces it; tree_drop.dart stays); shared/data/mock_data.dart (MockCommit, MockProject). Retires ZanshinColors/context.zc once 11-1's tokens cover every user (ZanshinIcon/ZI stay unless 11-1 replaces them); removes the Yaru test page; main2.dart goes after 11-4, main3.dart after 11-6, main4.dart + graph_poc/ after 10-1 promotes the viewport. Witness: no MockProject/MockCommit/context.zc/AppShell/MainNavRail/StatusBar/WindowTitleBar left; cargo make test passes; the app boots into the floating shell. Depends on 11-1, 11-3, 11-4, 11-6 (10-1 for main4). See epics.md Story 11.10. DESIGN UPDATE 2026-10-16 (console session, DS rounds 1-3): The retirement also takes the Yaru dependency, the icon font, flutter_svg and every Workstream remnant (decisions 16.1, 16.6, 16.26); the Widgetbook dev entrypoint stays the only dev host, no separate main*.dart demo hosts (16.29, 16.30). Also follows 11-11.
  11-13-menu-bar-shortcuts: backlog  # ADDED 2026-10-31 (Ralph, 10-5 design question (c)): View › Reload ⌘R, the same action as 10-12's reload button. [UI/native] added 2026-10-16 (Ralph, console session on the design-system rounds 1-3; Claude builds it under 11-0's scope change; decisions 16.7, 16.14, 16.16, 16.18, 16.34, 16.42, 16.46, 16.47). Today MainMenu.xib has 'Preferences… ⌘,' without an action, no File menu, no Close ⌘W, and stock items claiming ⌘F and ⌘J. Menus per DS readme 200-207 in Title Case: Zanshin (Settings… ⌘, replaces Preferences…), File (All Projects… ⇧⌘O, Open Recent, Project Settings…, Close Window ⌘W), Edit (Undo <action> ⌘Z, Redo <action> ⇧⌘Z, text items, Find ⌘F), View (Free ⌘1, Compact ⌘2, Detailed Cards, Group Stacks, Edit Configurations… ⌥⌘L, Show Minimap, Enter Full Screen), Change (New Change ⌘N, Describe…, Edit, Squash into Parent, Abandon ⌘⌫, Fetch without shortcut, Push… ⇧⌘P), Go (Selection ⌘J, Working Copy (@) ⇧⌘J, Parent, Child), Window, Help; the stock Find submenu goes. Routing: ⌘, opens/activates Settings on the last tab, never toggles; ⌘W on the project window closes the project and shows Projects, on a dirty Configurations window asks first; ⌘Z/⇧⌘Z only for Zanshin's own latest op while it is current, every undo ends in the 'Undid <action> · Redo' toast, undoing a push shows jj's warning; ⌘J/⇧⌘J only scroll; ⌘F from Settings/Projects per 16.47; project commands act on the project window from any Zanshin window; text shortcuts win inside fields; F6 to the toast. Greying table (sheets open, Minimize/Zoom per window, Undo without an own current op, after op abandon and update-stale, stale working copy, handlers not landed yet). The Change menu targets the selection, else @, and names it ('Abandon @'); Edit is greyed while its target is @. Every command is real. NEEDS DESIGN (Claude's proposals): (a) PlatformMenuBar in Dart after a spike, xib fallback; (b) Change > Edit with @ as target. Order: after 11-12, 10-9 and 10-23; before