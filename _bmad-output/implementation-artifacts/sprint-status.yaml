e rule; DESIGN-SYSTEM-SYNC entry, publish by the console session; zanshin_ui ZsSplitButton. (2) composer verb follows the pick: @ + a part = Split (default) ▾ Commit; @ + everything = plain Commit (describe + new); other + a part = plain Split; other + everything = no button (10.35 hint); nothing = disabled; paths and hunks arms; command line + summary placeholder follow the click's verb; menu rows Split first, each with its command. (3) local bookmarks on the change: chips in the composer preview (~:3910-3935) on the part where the click's verb puts them (split + legacy true = the rest / new working copy, legacy false or commit = selected part); in the Split ▾ Commit menu a quiet line per row ("main moves to the new working copy" / "main stays on this change") only when the rows differ — DESIGNED (Inspector Extras Study §1-3, approved by Ralph 2026-11-17): ZsMenuItem gains that quiet second line, hovering a row moves chips + command line to its verb; value via configGet('split.legacy-bookmark-behavior'), never assumed. (4) Squash (~:2554-2576) becomes a split button: main runs Squash into parent (with its form), chevron = the menu with both rows; a refused squash disables only the main part, the chevron stays while Absorb can run. NON-GOALS: remembering the last choice, split --parallel, changing jj's bookmark behavior or the config, other menu buttons (ZsMenuButton stays). WITNESSES: @ two of five files: Split runs jj split -r <id> -m … root:a root:b, @ ends on the rest; Commit from the menu runs jj commit …; @ everything = plain Commit; other change part = plain Split; bookmark feature on @: preview + rows say where it goes and it lands there, legacy false = selected part and no row lines; Squash click squashes, a merge disables the main part while Absorb stays; Tab reaches both parts; Marionette against the DS card in Paper and Night by the console session. Depends on 10.25, 10.26, 10.35, 10.36 (done). See epics.md Story 10.48.
