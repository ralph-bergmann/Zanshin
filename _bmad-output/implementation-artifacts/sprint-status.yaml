  9-7-workspace-reads-list-root: done  # DONE 2026-09-04 (commits 006b56c + 9aee860): the two workspace READ verbs through the FULL chain 9.3-9.6 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. One new noun module per side (zanshin-jj/src/workspace.rs, zanshin-ffi/src/workspace.rs) -- view.rs's own doc drew the line this story crosses ("the path lives in the WorkspaceStore, not the View"), so list_workspaces COMPOSES on top of the shipped view::list_working_copies rather than widening WorkingCopy; the two shapes stay distinct (WorkingCopy = raw View row, WorkspaceEntry = the jj workspace list row). THE STORY IS THE CLI'S OWN ASYMMETRY, REPRODUCED NOT SMOOTHED OVER: `workspace list` DEGRADES (every path-side failure -- store load, store read, absent entry, canonicalize -- collapses to root: None so a broken path can never fail the listing, commit_templater.rs:1787's dunce::canonicalize(..).ok()) while `workspace root --name` REFUSES with three distinct user_errors (root.rs:50-72), each minted as its own code because the remedies differ (jj.workspace_not_found = pick another; jj.workspace_no_recorded_path = predates jj 0.38, nothing to do; jj.workspace_path_unresolved = the directory moved, offer to forget it in 9.13) -- collapsing the last two would force a GUI to string-match `context`, which AR-P-4 forbids. resolve_root(None) reads the LOADER alone (no repo load, no store read, root.rs:78) and is the one path that cannot fail; resolve_root(Some(<the current workspace's OWN name>)) can still refuse, because the named path never shortcuts to the loader -- pinned by a test on both the jj and FFI layers. NAMED resolve_workspace_root, not workspace_root: the infallible &Path accessor has a production call site that cannot absorb a Result (zanshin-ffi/src/repo.rs arms the watcher with it); api_stability pins both signatures side by side. ARGUMENT ARITY IS THE CLI'S: `list` takes NOTHING (-T is rendering) so zanshin_workspace_list is HANDLE-ONLY -- the first read verb since remotes with no request buffer, which is why workspace_ffi.rs needs a second fn-pointer alias for the shared guard table; `root` takes one OPTIONAL long-only --name, so it gets a WorkspaceRootRequest buffer (absent = current workspace; a present EMPTY string is a VALUE and refuses as not_found). std::fs::canonicalize replaces the CLI's dunce:: (identical off Windows, no new dep) -- consequence: every path assertion canonicalizes BOTH sides (/var -> /private/var). TRAPS PINNED BY TESTS: SimpleWorkspaceStore::load is NOT a pure read (it CREATES workspace_store/ and writes an empty store on a legacy repo, workspace_store.rs:117-125) but writes NO operation; a missing/corrupt index is an Err, never Ok(None), so the two map to different codes in `root` while `list` flattens both; stored paths are relative to .jj/repo, not the workspace root. FIXTURE STALENESS IS A TEST ASSET: tiny-3-commits records `default` -> the GENERATOR's temp dir, so the shipped fixture is a free witness for BOTH halves of the asymmetry -- regeneration is forbidden and would destroy it. NOT DONE (deferred, 8 items): no workspace MUTATION (add/forget/rename/update-stale are 9.13/9.23), no MCP tool (Epic 7), no templates/-T/root.relative()/CWD-relative shortening (the GUI formats), `list` is widened past the CLI on a store-READ failure (the CLI's template property would propagate it; here it degrades like every other path failure, so a corrupt store cannot make a GUI unable to enumerate workspaces at all), a repo initialised through a path containing a symlink (macOS /var temp dirs) records a store entry relative to the NON-canonical .jj/repo while every read joins onto the canonical one, so its own root reports as absent -- a jj-lib/init-path interaction, out of this story's read-only scope, worked around in the tests with a documented canonicalize; plus three carried forward: request tables are structurally interchangeable (no file_identifier, house-wide since 9.3, and WorkspaceRootRequest makes the collision with ShowRequest exact), docs/ffi-abi.md still stale since 4.9 (9.1/9.3/9.4/9.5/9.6 did not update it either) and no working-copy snapshot (D2) -- which now affects a shipped payload COLUMN, since wc_commit_id is the LAST-SNAPSHOTTED @ where the CLI's `workspace list` snapshots first. cargo make test green x2, verify-codegen clean, coverage 99.15% overall with BOTH new files at 100.00%; no baseline lowered, no exclude_prefix added. WAS ADDED: [R] View::wc_commit_ids + WorkspaceStore::get_workspace_path Review: 9 patched (1 medium, 8 low), 4 deferred, 13 rejected; followup_review_recommended=true. The patches: no test opened the SECONDARY workspace, where .jj/repo is a FILE and Workspace::repo_path() resolving that indirection is the join base for every store lookup (deriving it locally left the whole suite green while every root went absent from that side); workspaceRoot's interior-NUL guard moved to the CALLING side (in the worker isolate it came back as internal.dispatch_error, not the documented ArgumentError -- the same fix 9.6 made for evolog's limit); and six verification gaps closed -- both store-LOAD failure branches shipped unpinned because `load` never reads the index (a dangling symlink at the store path makes it fail deterministically via EEXIST), jj.jj_lib_error had no witness at the FFI layer, the BTreeMap-order assertion was satisfied by insertion order too (a workspace named `aaa` added LAST now pins it), the "ABSOLUTE and canonicalized" promise was unverified because every assertion canonicalized both sides, the null-root decode and jj.workspace_no_recorded_path had no end-to-end cdylib witness, and WorkspaceEntry.wcCommitId's Dart doc referenced a WorkingCopy type that exists only in Rust.
  9-8-bookmark-crud-create-delete: done  # DONE 2026-09-04 (commits 93a1504 + 2bb36ac): the two cheapest bookmark MUTATIONS through the FULL chain 9.3-9.7 established (.fbs -> typed op -> extern "C" -> committed codegen -> Dart adapter/WorkerCommand/ZanshinWorker/RepoHandle -> tests); MCP stays empty for 9.3's reason. Supersedes part of deferred 6-9. One new noun module per side (zanshin-jj/src/bookmark_ops.rs, zanshin-ffi/src/bookmark_ops.rs) -- the shipped bookmarks.rs stays the pure READ with its own minimal BookmarkError, exactly as remotes.rs reads and git.rs mutates; one module per error taxonomy. ZERO new payload tables and NO union Payload change: both verbs return the shipped MutationResult, because which bookmarks are gone is answered by re-reading zanshin_bookmarks (ADR-0002) and the one fact a re-read cannot supply -- "did anything happen at all" -- is already the contract's pre-call-head new_op_id. THE SHARED TRANSACTION SKELETON MOVED: `struct Finished<T>` + `finish_or_no_op` went from git.rs to mutate.rs as pub(crate) (it was never a git concern -- it is the shape EVERY verb that may legitimately write nothing takes), git.rs's four call sites re-pointed; a second copy beside the bookmark verbs would have been a second, desyncable spelling of the no-op arm. PARAMETER CURRENCY SPLITS BY MEANING (9.3/9.6's rule): create's -r is resolve_single_rev, so it is an owned ChangeId that inherits the ambiguity REFUSAL but not the address space (no commit hex, no revset, no hidden commit), while delete's patterns are pass-through STRINGS because the pattern KIND is the parameter's meaning (FR-JJ-17). Create NAMES are DECODED values, not CLI argument text -- revset quoting ('foo bar', 'foo@bar') is terminal input syntax the GUI replaces (ADR-0003); the one behavioural residue kept is parse_symbol's empty-name refusal, which no CLI spelling avoids. OP-LOG PARITY IS BYTE-LEVEL (NFR-R-2): `create bookmark {names} pointing to commit {full hex}` with names in ARGUMENT order, `delete bookmark {matched names}` in VIEW (lexicographic) order, both rendered with RefName::as_symbol() -- the ONE place as_symbol is right, since the description is a rendering; every payload name still crosses as as_str. TWO NEW ERROR CODES, kept apart because the REMEDIES differ (the jj.remote_exists precedent): jj.bookmark_exists (the bookmark is there -- MOVE it with `bookmark set`) vs jj.bookmark_tracked_remote_exists (deleted-but-not-yet-pushed -- recreate with `bookmark set` or disassociate with `bookmark untrack`); collapsing them would force a GUI to string-match context, which AR-P-4 forbids. TRAPS PINNED BY TESTS: a BARE delete pattern is a GLOB, not an exact name (a bookmark literally named `foo*` AND one named `foo1` both match `foo*`; only the literal matches exact:"foo*"); a delete matching NOTHING is a SUCCESS that writes no operation and returns the PRE-CALL head (the machine-readable form of "No bookmarks to delete."), never a refusal; create's per-name loop is FAIL-FAST, so a run whose second name already exists creates nothing -- not even the first -- which the intuitive "create what you can" behavior would also have passed a naive suite; has_tracked_remote_bookmarks skips the default-ignored remote `git`, so a colocated foo@git does NOT block create while an untracked foo@origin does not either and a TRACKED one does; deleting a local bookmark prunes only remote rows that are themselves ABSENT, so a tracked name@origin SURVIVES and list_bookmarks keeps reporting it -- jj's "deleted, propagates on the next push" state, not a leak (`bookmark forget` is 9.11's); a CONFLICTED local bookmark deletes like any other; create on the ROOT commit succeeds, as in the CLI. NO manual rebase/normalize pass: set_local_bookmark_target calls View::add_head (clearing the head-normalized bit) but records no rewrite, and MutableRepo::consume() normalizes inside Transaction::write. Remote-tracking state is built IN-TEST with test_helpers::set_remote_bookmark -- fixture regeneration stays forbidden (tiny-3-commits has zero bookmarks, medium-1k-commits 29 local ones). NOT DONE (deferred, 7 items): no AUTO-TRACKING on create -- the CLI honours remotes.<r>.auto-track-bookmarks / auto-track-created-bookmarks by calling track_remote_bookmark, the verb Story 9.11 owns (deliberately deferred, not dropped); no other bookmark verb (set/forget/track/untrack are 9.11, move/advance/rename and `bookmark list` filters are 9.19); no MCP tool (Epic 7); no terminal UX (the CLI's "Target revision is empty.", "Created N bookmarks pointing to ...", "Deleted N bookmarks.", "No bookmarks to delete." and warn_unmatched_local_bookmarks are all stdout chatter the GUI replaces); plus three carried forward: docs/ffi-abi.md still stale since 4.9 (9.1/9.3-9.7 did not update it either), no working-copy snapshot (D2 -- an omitted revision is the LAST-SNAPSHOTTED @, Story 9.22), and request tables are structurally interchangeable (no file_identifier, house-wide since 9.3 -- BookmarkDeleteRequest is now a single-vector table like several others). cargo make test green x2, verify-codegen clean x2, coverage 99.21% overall with BOTH new files at 100.00%; mutate.rs 97.32 -> 97.91 (the skeleton move carried git.rs's two uncovered sync/no-op error branches into it, so abandon's previously unwitnessed PLURAL description -- `abandon commit <first> and <n-1> more`, argument order -- got the test it had always lacked), git.rs 98.87 -> 99.55, repo.rs 95.97 -> 96.13; no baseline lowered, no exclude_prefix added. WAS ADDED: [M] bookmark create + bookmark delete (MutableRepo::set_local_bookmark_target with RefTarget::normal/absent, View::local_bookmarks_matching, revset::parse_string_expression) Review: 12 patched (4 medium, 8 low), 7 deferred, 14 rejected; followup_review_recommended=true. The patches: BOTH verbs loaded the head TWICE -- each read it to build its op-log description (create for the target's commit hex, delete for the matched names), dropped it, and finish_or_no_op then loaded again and ran the guards and the writes against that SECOND view, a window the CLI does not have (it has one load per invocation) and one that matters because FR-MCP-9 has an external jj CLI or MCP process mutating the same repo: a delete could commit a description naming bookmarks it never touched, which is exactly the byte-level parity this story rests on -- finish_or_no_op now splits into a thin loading wrapper plus finish_or_no_op_at(workspace, readonly, ..), git.rs's four call sites untouched; a malformed delete pattern shipped only the wrapper prefix plus e.kind(), which is the same "Invalid string pattern" for EVERY bad pattern, while the error registry already promised jj-lib's own reason -- the reason is now kind + the FLATTENED source() chain, deliberately not a flatten of the whole error (its Display is a pest caret diagram, terminal rendering the GUI replaces), with the exact strings asserted at both levels and a negative assertion that the diagram never appears; and four tests asserted less than their names claimed -- the bare-glob test passed a QUOTED pattern so the trap was unproven at verb level, `revision` never crossed the Dart worker seam in a PASSING test (every create either omitted it or carried an interior NUL the calling-side guard rejects first, so deleting `revision:` from the dispatch arm, the command or the ObjectBuilder left the whole gate green while `bookmark create -r <commit>` would silently target @), the create reader's absent-names path and the documented "an explicitly empty revision is a VALUE, not an absence" claim had no witness at all, and two FFI refusals did not assert the unchanged head op id the contract promises. Plus six doc/comment fixes: the tracked binding's comment explained it by a borrow that does not exist, the `# Errors` bullet said `revision` refuses when "absent" in a paragraph where ABSENT applies the -r default, Finished's field docs still described git-only callers after the move, the dropped RevsetDiagnostics had no rationale, and the advertised ~/&/| pattern operators had no witness. Deferred from review (7): the two request tables verify interchangeably and this is the FIRST story where the colliding `names` vectors mean OPPOSITE things (exact names vs glob patterns), session_from_handle is now a fourth verbatim copy in zanshin-ffi, six copies of the Dart request-buffer helpers, the non-git arm of has_tracked_remote_bookmarks runs unasserted (a tracked name@git DOES block create on a native backend), MutationResult's other three fields are asserted nowhere for either verb, the same "absent revision" doc ambiguity survives on the 9.3/9.4/9.6 surfaces, and docs/ffi-abi.md.
