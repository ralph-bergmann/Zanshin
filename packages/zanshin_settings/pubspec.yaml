name: zanshin_settings
description: Persistent app settings for Zanshin - a Freezed AppSettings model cached in memory and stored as one JSON file.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.14.0-143.0.dev
  flutter: ^3.48.0-1.0.pre-295
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  inject_annotation: ^1.2.1
  json_annotation: ^4.12.0
  logging: ^1.3.0
  # WHY: the app's Material library is material_ui, whose ThemeMode is a
  # distinct type from package:flutter/material.dart's — the model must use
  # the one the UI feeds into MaterialApp.
  material_ui: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  # Test-only: fakes for SettingsStore.open() (path_provider) mix in MockPlatformInterfaceMixin.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.8
