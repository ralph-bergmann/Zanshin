[package]
name = "zanshin-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
# WHY: native_toolchain_rust 1.0.4 hard-requires both staticlib and cdylib
# (crate_info_validator.dart:29 enforces `['staticlib', 'cdylib'].every(types.contains)`).
# The cdylib is the actual FFI boundary; the staticlib is a tool-mandated artefact
# with no in-tree consumer. Revisit if upstream relaxes the constraint.
crate-type = ["staticlib", "cdylib"]
name = "zanshin_ffi"

[dependencies]
flatbuffers = { workspace = true }
# WHY: no release_max_level_info — debug/trace must compile in for the always-on
# console layer (WIP dev visibility, see tracing_init.rs); re-add before ship (deferred-work).
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
