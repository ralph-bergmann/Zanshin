[package]
name = "zanshin-jj"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { workspace = true }
etcetera = { workspace = true }  # WHY: one call site — `wc_ops.rs`'s `base_ignores` port needs the home dir exactly where the CLI (and jj-lib's own `expand_home_path`) takes it from
futures = { workspace = true }
getrandom = { workspace = true }  # WHY: one call site — `config.rs::SecureLayer::create_path` seeds a `ChaCha20Rng` without `rand::make_rng()`'s panic
gix = { workspace = true }
jj-lib = { workspace = true }
pollster = { workspace = true }
rand_chacha = { workspace = true }  # WHY: one call site — `config.rs::SecureLayer::create_path` hands `SecureConfig::load_config` the `ChaCha20Rng` it takes by concrete type
thiserror = { workspace = true }
tracing = { workspace = true }
whoami = { workspace = true }  # WHY: `config.rs`'s EnvBase layer + resolution-context hostname, exactly as the CLI's `ConfigEnv::from_environment`

[dev-dependencies]
# WHY the `testing` feature, DEV-only: `jj_lib::secret_backend::SecretBackend` is gated
# behind it, and it is the ONLY thing in jj-lib that raises
# `BackendError::ReadAccessDenied` — the single error `materialize_tree_value` turns into
# `MaterializedTreeValue::AccessDenied`, which `file_search`'s skip arm reports. Corrupting
# or chmod-ing a git object yields a DIFFERENT BackendError, so there is no other
# construction. Dev-only means `cargo build` and the shipped cdylib never enable it;
# putting it in `[dependencies]`, or in the `test-helpers` workspace member, would enable
# it for `cargo build --workspace` too.
jj-lib = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
test-helpers = { path = "../test-helpers", version = "0.1.0" }

# WHY: harness = false — the graph blueprint times manually (libtest `#[bench]` is
# nightly-only). Run with `cargo bench -p zanshin-jj --bench graph_blueprint`. It is a
# runnable reference for the jj-lib Stream graph walk (Story 3.11) and is excluded from
# coverage (benches are not run by `cargo make coverage`; see docs/coverage.md).
[[bench]]
name = "graph_blueprint"
harness = false

# WHY: harness = false — same reason as above. `show_limit` is the perf WITNESS for
# `ShowRequest.limit` (Epic 9 follow-up F): the early stop skips per-entry tree work no
# behavioural test can observe, so timings are the evidence. It asserts nothing about
# wall-clock. Run with `cargo bench -p zanshin-jj --bench show_limit`.
[[bench]]
name = "show_limit"
harness = false

[lints]
workspace = true
