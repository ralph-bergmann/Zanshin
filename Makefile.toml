# SPDX-License-Identifier: MIT

[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.default]
description = "List all available tasks."
command = "cargo"
args = ["make", "--list-all-steps"]

# ─── build ──────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the Rust workspace (release) and the Flutter macOS shell."
dependencies = ["build-rust", "build-flutter"]

[tasks.build-rust]
private = true
description = "Build the Rust production crates in release mode (skips xtask via default-members)."
command = "cargo"
args = ["build", "--release"]

[tasks.build-flutter]
private = true
description = "Build the Flutter macOS app in release mode."
command = "flutter"
args = ["build", "macos", "--release"]
cwd = "app"

# ─── run ────────────────────────────────────────────────────────────────────

[tasks.run]
description = "Run the Flutter macOS app in debug mode (Hot-Reload). Local execution only — unsigned."
command = "flutter"
args = ["run", "-d", "macos"]
cwd = "app"

[tasks.run-release]
description = "Run the Flutter macOS app in release mode (local-optimized, no Hot-Reload). Local execution only — unsigned."
command = "flutter"
args = ["run", "-d", "macos", "--release"]
cwd = "app"

# ─── test ───────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run the quality gate for what changed since the last green run (clippy + fmt + doctests + flutter test + dart analyze + dart format + cargo deny advisories+bans + cargo hygiene + the coverage ratchet, which runs the Rust and zanshin_core test suites). `cargo make test-full` runs every step."
# WHY: `gate-plan` (cargo xtask gate-plan) maps every path changed since the last green run to the
# steps it needs and writes them to target/gate/plan; each `gate-*` wrapper runs its step only when
# the plan lists it, and `gate-stamp` records the verified tree once everything passed. No stamp, a
# changed toolchain, a root manifest or a path no rule knows plans every step.
dependencies = [
    "gate-plan",
    "gate-test-clippy",
    "gate-test-fmt",
    "gate-test-cargo-doc",
    "gate-test-flutter",
    "gate-test-dart-analyze",
    "gate-test-dart-format",
    "gate-test-core-analyze",
    "gate-test-core-format",
    "gate-test-shell",
    "gate-test-shell-analyze",
    "gate-test-shell-format",
    "gate-test-shell-pi",
    "gate-test-shell-pi-analyze",
    "gate-test-shell-pi-format",
    "gate-test-shell-macos",
    "gate-test-shell-macos-analyze",
    "gate-test-shell-macos-format",
    "gate-test-settings",
    "gate-test-settings-analyze",
    "gate-test-settings-format",
    "gate-test-ui",
    "gate-test-ui-analyze",
    "gate-test-ui-format",
    "gate-test-cargo-deny",
    "gate-test-cargo-hygiene",
    "gate-test-jj-adapter-hygiene",
    "gate-coverage",
    "gate-stamp",
]

[tasks.test-full]
description = "Run every quality-gate step, whatever changed."
env = { ZANSHIN_GATE_FULL = "1" }
run_task = "test"

[tasks.test-cargo]
private = true
# WHY: not in the gate flow — `coverage` runs these tests (cargo llvm-cov); kept for manual runs.
command = "cargo"
args = ["test", "--workspace"]
# WHY: redirect the tracing file sink to a throwaway dir so any test that boots the cdylib and
# triggers zanshin_logging_init never writes into the developer's real ~/Library/Logs/Zanshin
# (test-isolation). No Rust test inits tracing today, but this future-proofs cheaply.
env = { ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs" }

[tasks.test-cargo-doc]
private = true
# WHY: the gate's Rust tests run inside `coverage`, and cargo llvm-cov runs no doctests.
command = "cargo"
args = ["test", "--workspace", "--doc"]

[tasks.test-clippy]
private = true
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test-fmt]
private = true
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.test-flutter]
private = true
# WHY: `flutter test` rewrites build/unit_test_assets only when the app's own pubspec or a file-backed
# asset is newer than its AssetManifest.bin (flutter_tools commands/test.dart `_needsRebuild`); the
# NOTICES bundle is not file-backed, so a dependency's `flutter: licenses:` change would leave a stale
# NOTICES.Z that the notices test in test/assets/font_manifest_test.dart reads. Deleting the manifest
# makes every gate run rebuild the test bundle.
script_runner = "bash"
script = '''
set -euo pipefail
rm -f build/unit_test_assets/AssetManifest.bin
xdg_config="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-xdg-config"
flutter_config="${XDG_CONFIG_HOME:-$HOME/.config/flutter}"
if [ "$flutter_config" != "$xdg_config" ]; then
    mkdir -p "$xdg_config"
    for name in settings tool_state; do
        rm -f "$xdg_config/$name"
        if [ -f "$flutter_config/$name" ]; then
            cp "$flutter_config/$name" "$xdg_config/$name"
        fi
    done
fi
export XDG_CONFIG_HOME="$xdg_config"
flutter test
'''
cwd = "app"
# WHY: pin jj/git global config so the Dart suite (which now drives real
# zanshin_repo_init/open through the cdylib) is deterministic on a clean CI
# runner vs a developer's machine — matching the Rust suites' empty-env
# convention (project-context "Property of every test suite"; Story 3.9 AC-16).
# Dart cannot set process env in-process, so it is pinned here at the task level.
# ZANSHIN_LOG_DIR redirects the cdylib's tracing file sink to a throwaway dir: the worker-isolate
# tests boot a real worker which calls zanshin_logging_init -> init_tracing, which would otherwise
# write into the developer's real ~/Library/Logs/Zanshin (test-isolation leak, fixed 2026-06-21).
# XDG_CONFIG_HOME is pinned like test-core/coverage (Story 9.28) — the app's real-worker tests
# write repo-scope jj config, which jj keeps in its secure store under $XDG_CONFIG_HOME/jj — but in
# the script, not in `env`, so it cannot leak into later tasks. `flutter test` reads its own
# config (e.g. `flutter config --enable-windowing`) from $XDG_CONFIG_HOME/<name> when that is set,
# else from ~/.config/flutter/<name> (flutter_tools base/config.dart `_configPath`), and it and the
# flutter_tester processes share one environment, so the pinned dir first gets a fresh copy of the
# developer's flutter config files (copied from, never written to).
env = { JJ_CONFIG = "", GIT_CONFIG_GLOBAL = "", JJ_USER = "Zanshin", JJ_EMAIL = "zanshin@localhost", JJ_OP_HOSTNAME = "localhost", JJ_OP_USERNAME = "zanshin", ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs" }

[tasks.test-dart-analyze]
private = true
command = "dart"
args = ["analyze", "--fatal-infos", "--fatal-warnings"]
cwd = "app"

[tasks.test-dart-format]
private = true
command = "dart"
args = ["format", "--output=none", "--set-exit-if-changed", "."]
cwd = "app"

[tasks.test-core]
private = true
description = "Run the pure-Dart zanshin_core bridge suite (real worker isolate + real cdylib) under `dart test`."
# WHY: not in the gate flow — `coverage` runs this suite against the instrumented cdylib; kept for manual runs.
command = "dart"
args = ["test"]
cwd = "packages/zanshin_core"
# WHY: pin jj/git global config + redirect the tracing sink so the worker-isolate tests
# (which drive real zanshin_repo_init/open through the cdylib and call zanshin_logging_init)
# are deterministic on a clean CI runner and never write into ~/Library/Logs/Zanshin.
# XDG_CONFIG_HOME (Story 9.28): keeps the config verbs' secure config store out of ~/.config/jj.
env = { JJ_CONFIG = "", GIT_CONFIG_GLOBAL = "", JJ_USER = "Zanshin", JJ_EMAIL = "zanshin@localhost", JJ_OP_HOSTNAME = "localhost", JJ_OP_USERNAME = "zanshin", ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs", XDG_CONFIG_HOME = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-xdg-config" }

[tasks.test-core-analyze]
private = true
command = "dart"
args = ["analyze", "--fatal-infos", "--fatal-warnings"]
cwd = "packages/zanshin_core"

[tasks.test-core-format]
private = true
command = "dart"
args = ["format", "--output=none", "--set-exit-if-changed", "."]
cwd = "packages/zanshin_core"

[tasks.test-shell]
private = true
command = "flutter"
args = ["test"]
cwd = "packages/zanshin_shell"

[tasks.test-shell-analyze]
private = true
command = "dart"
args = ["analyze", "--fatal-infos", "--fatal-warnings"]
cwd = "packages/zanshin_shell"

[tasks.test-shell-format]
