[tasks.test-cargo-deny]
private = true
# WHY: --workspace is auto-assumed for virtual manifests (current state) but we
# pass it explicitly so the advisory scan keeps covering xtask if the root manifest
# ever stops being virtual, and to make the "all crates scanned" intent explicit.
command = "cargo"
args = ["deny", "--workspace", "check", "advisories", "bans"]

[tasks.test-cargo-hygiene]
private = true
description = "Enforce the inline `# WHY:` backstop for `default-features = false` across all tracked Cargo.toml manifests (AR-P-8)."
script_runner = "bash"
script = '''
set -euo pipefail

# Enforce the inline `# WHY:` backstop for `default-features = false`
# (project-context.md § "Cargo.toml hygiene"; crates/README.md). Every tracked
# Cargo.toml that sets `default-features = false` must justify it with a `# WHY:`
# comment on the SAME line — the documented form (no preceding-line variant).
# ci.yml is Story 1.9's deliverable; landing the check here means `cargo make
# test` (the single entry point) gates it now and 1.9 inherits it for free.

# The detached spike workspace (spikes/, ADR-0001) is deliberately NOT part of
# CI per AC-7 and carries its own Cargo.lock — exclude it so its Cargo.toml
# neither inflates the count nor gets hygiene-checked with the real members.
manifests=$(git ls-files '*Cargo.toml' ':(exclude)spikes/')
count=$(git ls-files '*Cargo.toml' ':(exclude)spikes/' | wc -l | tr -d '[:space:]')

# Sanity: the workspace manifest set is fixed (root + seven crates). A count
# mismatch means a crate was added or removed without anyone revisiting this
# gate — surface it rather than silently checking a different set.
if [ "$count" -ne 8 ]; then
    echo "test-cargo-hygiene: expected 8 tracked Cargo.toml files, found $count:" >&2
    echo "$manifests" >&2
    exit 1
fi

violations=0
while IFS= read -r manifest; do
    # grep -n → file-relative line numbers; -E + [[:space:]] keep it portable to
    # macOS BSD grep (no -P). `|| true` so a no-match (grep exit 1) doesn't trip
    # `set -e`.
    matches=$(grep -nE 'default-features[[:space:]]*=[[:space:]]*false' "$manifest" || true)
    [ -z "$matches" ] && continue
    while IFS= read -r line; do
        case "$line" in
            *'# WHY:'*) ;;  # justified inline — OK
            *) printf '  %s:%s\n' "$manifest" "$line" >&2; violations=$((violations + 1)) ;;
        esac
    done <<< "$matches"
done <<< "$manifests"

if [ "$violations" -ne 0 ]; then
    echo "test-cargo-hygiene: $violations occurrence(s) of \`default-features = false\` lack an inline \`# WHY:\` comment (see crates/README.md)." >&2
    exit 1
fi
'''

[tasks.test-jj-adapter-hygiene]
private = true
description = "Enforce the no-jj_lib-re-export invariant (AC-4 / FR-JJ-16): `pub use jj_lib::…` is forbidden in crates/zanshin-jj/src/."
script_runner = "bash"
script = '''
set -euo pipefail

# Every `pub use jj_lib::` line in crates/zanshin-jj/src/ would leak a jj_lib
# type into the public API, breaking the anti-corruption layer (FR-JJ-16).
# Grep tracked source files only (git ls-files); untracked/generated files are
# excluded so the check is deterministic.

sources=$(git ls-files 'crates/zanshin-jj/src/')

violations=0
while IFS= read -r src; do
    # Exclude comment lines (//!, ///, //) — only flag actual code.
    matches=$(grep -nE 'pub[[:space:]]+use[[:space:]]+jj_lib' "$src" | grep -vE '^[0-9]+:[[:space:]]*//' || true)
    [ -z "$matches" ] && continue
    while IFS= read -r line; do
        printf '  %s:%s\n' "$src" "$line" >&2
        violations=$((violations + 1))
    done <<< "$matches"
done <<< "$sources"

if [ "$violations" -ne 0 ]; then
    echo "test-jj-adapter-hygiene: $violations occurrence(s) of \`pub use jj_lib::\` found." \
         "This would leak a jj_lib type into the public API (FR-JJ-16)." >&2
    exit 1
fi
'''

# ─── gate selection ─────────────────────────────────────────────────────────

[tasks.gate-plan]
private = true
description = "Plan the gate steps the changes since the last green run need (target/gate/plan)."
script_runner = "bash"
script = '''
set -euo pipefail
args=(--workspace-root "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}")
if [ "${ZANSHIN_GATE_FULL:-}" = "1" ]; then
    args+=(--full)
fi
cargo run -q -p xtask -- gate-plan "${args[@]}"
'''

[tasks.gate-stamp]
private = true
description = "Record the tree this green gate run verified (target/gate/last-green)."
command = "cargo"
args = ["run", "-q", "-p", "xtask", "--", "gate-stamp", "--workspace-root", "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"]

[tasks.gate-step]
private = true
# WHY: the wrappers below run their step only when gate-plan listed them; the steps themselves stay
# unconditional, so `cargo make coverage` and `cargo make --allow-private test-…` keep working alone.
condition_script = ['grep -qx "$CARGO_MAKE_CURRENT_TASK_NAME" "$CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY/target/gate/plan"']

