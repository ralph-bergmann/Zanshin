# SPDX-License-Identifier: MIT

[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.default]
description = "List all available tasks."
command = "cargo"
args = ["make", "--list-all-steps"]

# ─── build ──────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the Rust workspace (release) and the Flutter macOS shell."
dependencies = ["build-rust", "build-flutter"]

[tasks.build-rust]
private = true
description = "Build the Rust production crates in release mode (skips xtask via default-members)."
command = "cargo"
args = ["build", "--release"]

[tasks.build-flutter]
private = true
description = "Build the Flutter macOS app in release mode."
command = "flutter"
args = ["build", "macos", "--release"]
cwd = "app"

# ─── run ────────────────────────────────────────────────────────────────────

[tasks.run]
description = "Run the Flutter macOS app in debug mode (Hot-Reload). Local execution only — unsigned."
command = "flutter"
args = ["run", "-d", "macos"]
cwd = "app"

[tasks.run-release]
description = "Run the Flutter macOS app in release mode (local-optimized, no Hot-Reload). Local execution only — unsigned."
command = "flutter"
args = ["run", "-d", "macos", "--release"]
cwd = "app"

# ─── test ───────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run the WIP-minimal quality gate (cargo test + clippy + fmt + flutter test + dart analyze + dart format + cargo deny advisories+bans + cargo hygiene)."
dependencies = [
    "test-cargo",
    "test-clippy",
    "test-fmt",
    "test-flutter",
    "test-dart-analyze",
    "test-dart-format",
    "test-core",
    "test-core-analyze",
    "test-core-format",
    "test-cargo-deny",
    "test-cargo-hygiene",
]

[tasks.test-cargo]
private = true
command = "cargo"
args = ["test", "--workspace"]
# WHY: redirect the tracing file sink to a throwaway dir so any test that boots the cdylib and
# triggers zanshin_logging_init never writes into the developer's real ~/Library/Logs/Zanshin
# (test-isolation). No Rust test inits tracing today, but this future-proofs cheaply.
env = { ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs" }

[tasks.test-clippy]
private = true
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test-fmt]
private = true
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.test-flutter]
private = true
command = "flutter"
args = ["test"]
cwd = "app"
# WHY: pin jj/git global config so the Dart suite (which now drives real
# zanshin_repo_init/open through the cdylib) is deterministic on a clean CI
# runner vs a developer's machine — matching the Rust suites' empty-env
# convention (project-context "Property of every test suite"; Story 3.9 AC-16).
# Dart cannot set process env in-process, so it is pinned here at the task level.
# ZANSHIN_LOG_DIR redirects the cdylib's tracing file sink to a throwaway dir: the worker-isolate
# tests boot a real worker which calls zanshin_logging_init -> init_tracing, which would otherwise
# write into the developer's real ~/Library/Logs/Zanshin (test-isolation leak, fixed 2026-06-21).
env = { JJ_CONFIG = "", GIT_CONFIG_GLOBAL = "", ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs" }

[tasks.test-dart-analyze]
private = true
command = "dart"
args = ["analyze", "--fatal-infos", "--fatal-warnings"]
cwd = "app"

[tasks.test-dart-format]
private = true
command = "dart"
args = ["format", "--output=none", "--set-exit-if-changed", "."]
cwd = "app"

[tasks.test-core]
private = true
description = "Run the pure-Dart zanshin_core bridge suite (real worker isolate + real cdylib) under `dart test`."
command = "dart"
args = ["test"]
cwd = "packages/zanshin_core"
# WHY: pin jj/git global config + redirect the tracing sink so the worker-isolate tests
# (which drive real zanshin_repo_init/open through the cdylib and call zanshin_logging_init)
# are deterministic on a clean CI runner and never write into ~/Library/Logs/Zanshin.
env = { JJ_CONFIG = "", GIT_CONFIG_GLOBAL = "", ZANSHIN_LOG_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/test-logs" }

[tasks.test-core-analyze]
private = true
command = "dart"
args = ["analyze", "--fatal-infos", "--fatal-warnings"]
cwd = "packages/zanshin_core"

[tasks.test-core-format]
private = true
command = "dart"
args = ["format", "--output=none", "--set-exit-if-changed", "."]
cwd = "packages/zanshin_core"

[tasks.test-cargo-deny]
private = true
# WHY: --workspace is auto-assumed for virtual manifests (current state) but we
# pass it explicitly so the advisory scan keeps covering xtask if the root manifest
# ever stops being virtual, and to make the "all crates scanned" intent explicit.
command = "cargo"
args = ["deny", "--workspace", "check", "advisories", "bans"]

[tasks.test-cargo-hygiene]
private = true
description = "Enforce the inline `# WHY:` backstop for `default-features = false` across all tracked Cargo.toml manifests (AR-P-8)."
script_runner = "bash"
script = '''
set -euo pipefail

# Enforce the inline `# WHY:` backstop for `default-features = false`
# (project-context.md § "Cargo.toml hygiene"; crates/README.md). Every tracked
# Cargo.toml that sets `default-features = false` must justify it with a `# WHY:`
# comment on the SAME line — the documented form (no preceding-line variant).
# ci.yml is Story 1.9's deliverable; landing the check here means `cargo make
# test` (the single entry point) gates it now and 1.9 inherits it for free.

# The detached spike workspace (spikes/, ADR-0001) is deliberately NOT part of
# CI per AC-7 and carries its own Cargo.lock — exclude it so its Cargo.toml
# neither inflates the count nor gets hygiene-checked with the real members.
manifests=$(git ls-files '*Cargo.toml' ':(exclude)spikes/')
count=$(git ls-files '*Cargo.toml' ':(exclude)spikes/' | wc -l | tr -d '[:space:]')

# Sanity: the workspace manifest set is fixed (root + seven crates). A count
# mismatch means a crate was added or removed without anyone revisiting this
# gate — surface it rather than silently checking a different set.
if [ "$count" -ne 8 ]; then
    echo "test-cargo-hygiene: expected 8 tracked Cargo.toml files, found $count:" >&2
    echo "$manifests" >&2
    exit 1
fi

violations=0
while IFS= read -r manifest; do
    # grep -n → file-relative line numbers; -E + [[:space:]] keep it portable to
    # macOS BSD grep (no -P). `|| true` so a no-match (grep exit 1) doesn't trip
    # `set -e`.
    matches=$(grep -nE 'default-features[[:space:]]*=[[:space:]]*false' "$manifest" || true)
    [ -z "$matches" ] && continue
    while IFS= read -r line; do
        case "$line" in
            *'# WHY:'*) ;;  # justified inline — OK
            *) printf '  %s:%s\n' "$manifest" "$line" >&2; violations=$((violations + 1)) ;;
        esac
    done <<< "$matches"
done <<< "$manifests"

if [ "$violations" -ne 0 ]; then
    echo "test-cargo-hygiene: $violations occurrence(s) of \`default-features = false\` lack an inline \`# WHY:\` comment (see crates/README.md)." >&2
    exit 1
fi
'''

# ─── codegen ────────────────────────────────────────────────────────────────

[tasks.codegen]
description = "Regenerate FFI C header (cbindgen), Dart bindings (ffigen), and FlatBuffers accessors (flatc) for all schemas/*.fbs. Run after any .fbs or extern \"C\" change; commit the result."
# WHY: flatc must run before cbindgen/ffigen so the Rust types from the
# generated accessors are present when cbindgen reads the crate (even though
# the FlatBuffers types don't appear in the extern "C" signatures directly,
# keeping the order deterministic avoids surprises if that ever changes).
dependencies = ["codegen-flatc-rust", "codegen-flatc-dart", "codegen-cbindgen", "codegen-ffigen"]

[tasks.codegen-flatc-rust]
private = true
description = "Generate Rust FlatBuffers accessors from schemas/*.fbs into crates/zanshin-ffi/src/ and format them."
script_runner = "bash"
script = '''
set -euo pipefail
for fbs in schemas/*.fbs; do
    flatc --rust -o crates/zanshin-ffi/src/ "$fbs"
done
# WHY: flatc emits 2-space-indented Rust in a style that differs from ours, so
# `cargo fmt --check` (run by `cargo make test`) would flag the committed
# generated file. Normalise it with rustfmt — the exact mirror of the
# `dart format` step in codegen-flatc-dart. A rustfmt.toml `ignore` entry was
# tried instead and removed: `ignore` is nightly-only and inert on the pinned
# stable toolchain (rust-toolchain.toml). The `#[allow(warnings)]` on the
# `mod envelope_generated` declaration still suppresses clippy for the contents.
rustfmt crates/zanshin-ffi/src/*_generated.rs
'''

[tasks.codegen-flatc-dart]
private = true
description = "Generate Dart FlatBuffers accessors from schemas/*.fbs into packages/zanshin_core/lib/src/ffi/ and format them."
script_runner = "bash"
script = '''
set -euo pipefail
for fbs in schemas/*.fbs; do
    flatc --dart -o packages/zanshin_core/lib/src/ffi/ "$fbs"
done
# WHY: flatc generates code in its own style; dart format normalises it so
# that `cargo make test` (which runs dart format --set-exit-if-changed) does
# not flag the committed generated files as unformatted.
dart format packages/zanshin_core/lib/src/ffi/
'''

[tasks.codegen-cbindgen]
private = true
command = "cbindgen"
args = [
    "--config", "cbindgen.toml",
    "--crate", "zanshin-ffi",
    "--output", "crates/zanshin-ffi/include/zanshin_ffi.h",
]

[tasks.codegen-ffigen]
private = true
command = "dart"
args = ["run", "ffigen", "--config", "ffigen.yaml"]
cwd = "packages/zanshin_core"

# ─── verify-codegen ─────────────────────────────────────────────────────────

[tasks.verify-codegen]
description = "Re-run codegen, diff against committed files, fail on drift. Manual discipline tool — not chained into `cargo make test`."
# Recovery if the script is killed mid-flight (e.g. SIGKILL between regenerate and restore):
#   git checkout -- crates/zanshin-ffi/include/zanshin_ffi.h packages/zanshin_core/lib/src/ffi/bindings.dart
script_runner = "bash"
script = '''
set -euo pipefail

HEADER=crates/zanshin-ffi/include/zanshin_ffi.h
BINDINGS=packages/zanshin_core/lib/src/ffi/bindings.dart
FLATC_RUST=crates/zanshin-ffi/src/envelope_generated.rs
FLATC_DART=packages/zanshin_core/lib/src/ffi/envelope_zanshin.ffi_generated.dart

# Pre-flight: all codegen outputs must already exist.
missing=0
for f in "$HEADER" "$BINDINGS" "$FLATC_RUST" "$FLATC_DART"; do
    if [ ! -f "$f" ]; then
        echo "verify-codegen: missing committed codegen output: $f" >&2
        missing=1
    fi
done
if [ "$missing" -ne 0 ]; then
    echo "Run 'cargo make codegen' first." >&2
    exit 1
fi

# Pre-flight 2: reject if user has uncommitted edits to the codegen outputs.
# The snapshot-restore loop below would silently overwrite manual edits with
# the regenerated content. Manual edits to generated files are an AR-AP-7
# violation anyway — exit early with a clear message rather than after damage.
#
# git diff --quiet exit codes: 0 = clean, 1 = diff present, 128 = git error
# (no HEAD, not in a repo, git missing). Discriminate so an env error is not
# mislabelled as a dirty-tree refusal.
diff_rc=0
git diff --quiet HEAD -- "$HEADER" "$BINDINGS" "$FLATC_RUST" "$FLATC_DART" || diff_rc=$?
if [ "$diff_rc" -eq 1 ]; then
    echo "verify-codegen refuses to run with unstaged or staged edits to codegen outputs:" >&2
    for f in "$HEADER" "$BINDINGS" "$FLATC_RUST" "$FLATC_DART"; do echo "  - $f" >&2; done
    echo "Manual edits to generated files are an AR-AP-7 violation." >&2
    echo "Run 'cargo make codegen' to regenerate, or 'git checkout -- <files>' to revert." >&2
    exit 1
elif [ "$diff_rc" -ne 0 ]; then
    echo "verify-codegen could not query git for uncommitted edits (git diff exit $diff_rc)." >&2
    echo "Common causes: git not installed, not inside a git repository, or no HEAD commit yet." >&2
    exit "$diff_rc"
fi

TMP=$(mktemp -d)
trap 'rm -rf "$TMP"' EXIT
cp "$HEADER"     "$TMP/header.committed"
cp "$BINDINGS"   "$TMP/bindings.committed"
cp "$FLATC_RUST" "$TMP/flatc_rust.committed"
cp "$FLATC_DART" "$TMP/flatc_dart.committed"

cargo make codegen

# diff exit codes: 0 = identical, 1 = differs, >1 = error (missing file, I/O failure).
# Capture explicitly so we don't silently route errors into the "drift" branch.
check_drift() {
    local committed=$1
    local current=$2
    local rc=0
    diff -q "$committed" "$current" > /dev/null || rc=$?
    if [ "$rc" -gt 1 ]; then
        echo "diff failed unexpectedly (exit $rc) for $current — aborting." >&2
        exit "$rc"
    fi
    return "$rc"
}

drift=0
if ! check_drift "$TMP/header.committed" "$HEADER"; then
    diff -u "$TMP/header.committed" "$HEADER" || true
    cp "$TMP/header.committed" "$HEADER"
    echo "Drift in $HEADER — run 'cargo make codegen' and commit." >&2
    drift=1
fi
if ! check_drift "$TMP/bindings.committed" "$BINDINGS"; then
    diff -u "$TMP/bindings.committed" "$BINDINGS" || true
    cp "$TMP/bindings.committed" "$BINDINGS"
    echo "Drift in $BINDINGS — run 'cargo make codegen' and commit." >&2
    drift=1
fi
if ! check_drift "$TMP/flatc_rust.committed" "$FLATC_RUST"; then
    diff -u "$TMP/flatc_rust.committed" "$FLATC_RUST" || true
    cp "$TMP/flatc_rust.committed" "$FLATC_RUST"
    echo "Drift in $FLATC_RUST — run 'cargo make codegen' and commit." >&2
    drift=1
fi
if ! check_drift "$TMP/flatc_dart.committed" "$FLATC_DART"; then
    diff -u "$TMP/flatc_dart.committed" "$FLATC_DART" || true
    cp "$TMP/flatc_dart.committed" "$FLATC_DART"
    echo "Drift in $FLATC_DART — run 'cargo make codegen' and commit." >&2
    drift=1
fi
exit $drift
'''

# ─── coverage ───────────────────────────────────────────────────────────────

[tasks.coverage]
description = "Unified cross-FFI + Rust coverage (report-first, no gate). Instruments the cdylib via the zanshin_core hook marker, runs `dart test` (clean-exit atexit flush = native FFI-path coverage) + cargo-llvm-cov, and unions the two lcovs into target/coverage/coverage.lcov. macOS + rust-toolchain llvm-tools + cargo-llvm-cov only."
# WHY this shape (proven by spike, 2026-06-23): cargo-llvm-cov's `show-env` cannot reach the
# cdylib build (the Flutter/Dart hooks-runner scrubs the hook env), so instrumentation is
# triggered by a marker FILE the hook reads. `flutter test` hard-kills its tester so the LLVM
# atexit writer never fires — but `dart test` exits cleanly, so the FFI-path coverage flushes
# with NO explicit dump. The cdylib is --release while cargo's test bins are debug (different
# function hashes), and a hand-rolled `-object` list misses the integration-test binaries
# (revset-<hash>, *_ffi-<hash>) that carry most of the zanshin-jj coverage. So the two sides are
# produced separately — the cdylib via raw llvm-cov export, the Rust side via cargo-llvm-cov
# (which enumerates ALL test binaries) — and unioned at the source level by `cargo xtask lcov-union`.
script_runner = "bash"
script = '''
set -euo pipefail

ROOT="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
CORE="$ROOT/packages/zanshin_core"
COV="$ROOT/target/coverage"
TRIPLE="$(rustc -vV | awk '/host:/{print $2}')"
LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$TRIPLE/bin"

for t in llvm-profdata llvm-cov; do
    if [ ! -x "$LLVM_BIN/$t" ]; then
        echo "coverage: missing $LLVM_BIN/$t — run 'rustup component add llvm-tools-preview'." >&2
        exit 1
    fi
done
if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
    echo "coverage: cargo-llvm-cov not installed — 'brew install cargo-llvm-cov' (or cargo install cargo-llvm-cov)." >&2
    exit 1
fi

rm -rf "$COV"; mkdir -p "$COV"

# 1) FFI-path coverage: instrument the cdylib via the hook marker, then run `dart test`.
#    The marker FILE is the trigger (hook env is scrubbed); the hooks-runner cache ignores it,
#    so force a clean rebuild. `dart test` exits cleanly => LLVM atexit flushes .profraw. Export
#    the cdylib alone => ffi.lcov (the coverage reachable through the real worker/FFI path).
: > "$CORE/coverage.on"
trap 'rm -f "$CORE/coverage.on"' EXIT
rm -rf "$CORE/.dart_tool/hooks_runner"
( cd "$CORE" \
  && JJ_CONFIG="" GIT_CONFIG_GLOBAL="" ZANSHIN_LOG_DIR="$ROOT/target/test-logs" \
     LLVM_PROFILE_FILE="$COV/ffi-%p-%m.profraw" \
     dart test )
DYL="$(find "$CORE/.dart_tool/hooks_runner" -path '*release/libzanshin_ffi.dylib' | head -1)"
if [ -z "$DYL" ]; then
    echo "coverage: instrumented cdylib not found under $CORE/.dart_tool" >&2
    exit 1
fi
"$LLVM_BIN/llvm-profdata" merge -sparse -o "$COV/ffi.profdata" "$COV"/ffi-*.profraw
"$LLVM_BIN/llvm-cov" export -format=lcov -instr-profile "$COV/ffi.profdata" \
    -ignore-filename-regex='(_generated\.rs$|/\.cargo/registry/|/rustc/|/\.pub-cache/)' \
    "$DYL" > "$COV/ffi.lcov"

# 2) Rust-side coverage via cargo-llvm-cov, which enumerates ALL test binaries — including the
#    integration tests named after their test file (revset-<hash>, change-<hash>, *_ffi-<hash>)
#    that carry most of the zanshin-jj coverage and that a hand-rolled -object list would miss.
( cd "$ROOT" \
  && ZANSHIN_LOG_DIR="$ROOT/target/test-logs" \
     cargo llvm-cov --workspace --lcov --output-path "$COV/cargo.lcov" \
       --ignore-filename-regex='(_generated\.rs$|/tests/)' )

# 3) Union the two lcovs at the source level (a line is covered if covered in EITHER). Release
#    cdylib vs debug cargo bins => different function hashes => a single export cannot attribute
#    one to the other, so union the lcovs (max count per line). See xtask/src/tasks/lcov_union.rs.
( cd "$ROOT" && cargo run -q -p xtask -- lcov-union "$COV/ffi.lcov" "$COV/cargo.lcov" --output "$COV/coverage.lcov" )

echo "Unified coverage written: $COV/coverage.lcov  (ffi.lcov + cargo.lcov unioned)"
echo "Per-region view of an untaken arm, e.g.:"
echo "  \"$LLVM_BIN/llvm-cov\" show -instr-profile \"$COV/ffi.profdata\" --show-line-counts --show-regions \"$DYL\" crates/zanshin-jj/src/change.rs"
'''

# ─── clean ──────────────────────────────────────────────────────────────────

[tasks.clean]
description = "Remove all build outputs (cargo + flutter). Generated codegen is committed and stays."
dependencies = ["clean-cargo", "clean-flutter"]

[tasks.clean-cargo]
private = true
command = "cargo"
args = ["clean"]

[tasks.clean-flutter]
private = true
command = "flutter"
args = ["clean"]
cwd = "app"
