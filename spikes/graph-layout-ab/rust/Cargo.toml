# Standalone spike — intentionally DETACHED from the parent Zanshin workspace.
# The empty [workspace] table makes this its own workspace root so that the
# parent's `crates/*` glob, `cargo test --workspace`, clippy, deny and the
# coverage gate never touch this exploratory crate (SPEC.md §10).
[workspace]

[package]
name = "graph-layout"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "graph_layout"
path = "src/lib.rs"

[[bin]]
name = "graph-layout"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
