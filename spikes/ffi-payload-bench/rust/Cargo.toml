# Standalone spike — intentionally DETACHED from the parent Zanshin workspace.
# The empty [workspace] table makes this its own workspace root so that the
# parent's `crates/*` glob, `cargo test --workspace`, and clippy-pedantic gate
# never touch this exploratory crate or its flatc-generated code.
[workspace]

[package]
name = "ffi-payload-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
flatbuffers = "=25.12.19" # WHY: must match the installed `flatc` (25.12.19) used by build.rs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "serialize"
harness = false
