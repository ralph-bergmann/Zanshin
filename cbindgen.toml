# Workspace-level cbindgen configuration for the zanshin-ffi cdylib boundary.
# Output: crates/zanshin-ffi/include/zanshin_ffi.h (committed; regenerate via
# `cargo make codegen`). Per AR-P-6 / FR-BO-6 — never auto-regenerated by the
# build.

language = "C"
pragma_once = true
include_guard = "ZANSHIN_FFI_H"
sys_includes = ["stdint.h", "stdbool.h"]
style = "type"

# WHY: one-line banner so any reviewer reading the generated header in isolation
# sees the regenerate hint. AR-AP-7 enforcement signal.
header = "/* Auto-generated by cbindgen — DO NOT EDIT. Regenerate via `cargo make codegen`. */"

[parse]
# WHY: zanshin-ffi is the only crate with `extern "C"` items. Recursing into deps
# (zanshin-jj, zanshin-diff, zanshin-graph) would either no-op or, if any
# accidentally gets `#[no_mangle]`, leak it into the public header. Hard-no.
parse_deps = false
