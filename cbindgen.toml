# Workspace-level cbindgen configuration for the zanshin-ffi cdylib boundary.
# Output: crates/zanshin-ffi/include/zanshin_ffi.h (committed; regenerate via
# `cargo make codegen`). Per AR-P-6 / FR-BO-6 — never auto-regenerated by the
# build.

language = "C"
pragma_once = true
include_guard = "ZANSHIN_FFI_H"
sys_includes = ["stdint.h", "stdbool.h"]
style = "type"

# WHY: one-line banner so any reviewer reading the generated header in isolation
# sees the regenerate hint. AR-AP-7 enforcement signal.
header = "/* Auto-generated by cbindgen — DO NOT EDIT. Regenerate via `cargo make codegen`. */"

[parse]
# WHY: zanshin-ffi is the only crate with `extern "C"` items. Recursing into deps
# (zanshin-jj, zanshin-diff, zanshin-graph) would either no-op or, if any
# accidentally gets `#[no_mangle]`, leak it into the public header. Hard-no.
parse_deps = false

[export]
# WHY: FlatBuffers-generated modules expose Rust-internal constants (VT_* vtable
# offsets, ENUM_MIN/MAX) that must NOT appear in the C header — they have no
# meaning outside the Rust FlatBuffers runtime. Add new entries here whenever
# `cargo make codegen` produces unexpected items in zanshin_ffi.h from a newly
# added *_generated module. Keeping these here avoids cbindgen accidentally
# leaking FlatBuffers internals to the Dart/C side.
exclude = [
    # FlatBuffers enum range constants (module-level pub const from *_generated modules).
    "ENUM_MIN_PAYLOAD",
    "ENUM_MAX_PAYLOAD",
    # FlatBuffers vtable offset constants (associated consts in *_generated impl blocks;
    # cbindgen generates them as TypeName_CONST_NAME in the C header but matches them
    # by their Rust associated-constant name in this exclude list).
    "VT_CODE",
    "VT_CONTEXT",
    "VT_OK",
    "VT_ERROR",
    "VT_DATA_TYPE",
    "VT_DATA",
]
